<script>
/* ============================================================
   EDITIONS DATA
   Each edition keyed by ISO date. To add a new AI weekly digest,
   prepend a new object with the same shape. The Hermes cron job
   (Sundays 13:00 Sydney) can prepend a new entry here.

   HOUSE STYLE — three clearly separated parts, in this order:
     Part I  — Features & tools   (FACTS ONLY: what shipped,
               specs, numbers, benchmarks, prices. Objective.)
     Part II — Economics          (FACTS ONLY: filings, raises,
               stated revenue/valuation/compute figures.)
     Part III — Opinion & ideas   (theses, frameworks, forecasts,
               always attributed to who said them.)
   Keep facts and opinion strictly separated.
   ============================================================ */
const EDITIONS = [
{
  "date": "2026-08-02",
  "label": {
    "en": "August 2, 2026",
    "es": "2 de agosto de 2026",
    "pt": "2 de agosto de 2026"
  },
  "en": {
    "eyebrow": "Week of July 27–August 2, 2026",
    "headline": "AI’s new unit of progress: the deployed harness",
    "dek": "A week of cheaper inference, agent surfaces and a harder lesson: the workflow around the model determines whether capability becomes useful work.",
    "byline": "A weekly synthesis of twelve YouTube channels (41 transcript-backed in-window videos), monitored newsrooms, weekly AI sites and selected X profiles. Reading time ~24 min.",
    "body": "<h2><span class=\"num\">0.</span> GPT-5.6, Claude Opus 5 and the operational turn</h2><p class=\"first\">This week’s primary releases and field reports sharpened a practical distinction: a capable model is not yet a dependable system. OpenAI’s July 30 GPT-5.6 note describes two API settings—retained reasoning and compaction—as levers for improving ARC-AGI-3 performance and efficiency, while Simon Willison’s testing points to a product surface where a browser can take screenshots and deploy a web app to Cloudflare Workers. Anthropic’s newsroom continues to position Claude Opus 5 for long-running agent work. These are product claims and workflows, not a guarantee of autonomous correctness: teams still need scoped credentials, reviewable outputs, budget limits and an audit trail.</p><p>The transcript-backed creator set made the same point from implementation. Tech With Tim separates model memory from the external state a harness persists, and explains tools as explicit actions emitted by a model rather than magic autonomy. YC’s Boris Cherny describes reducing Claude Code’s prompt, while Jeff Dean’s “1% rule” frames AI development as repeated small improvements. Together they make an operational reading of the week: context, routing, tool permissions and evaluation are now part of the product.</p><div class=\"part\"><p class=\"kicker\">Part I</p><p class=\"part-name\">Features &amp; tools — what actually shipped<span class=\"label-fact\">facts</span></p></div><h2><span class=\"num\">1.</span> OpenAI: health, small-business distribution and a security reality check</h2><p class=\"first\">OpenAI used the week to widen the places where ChatGPT is expected to be useful. <strong>Health in ChatGPT</strong>, announced July 23, is a dedicated experience for health conversations; it is not a diagnosis claim, but a product surface intended to help people understand and organize health questions. Two days earlier the company introduced a ChatGPT small-business program, while its NTT DATA case study says Codex cut incident analysis to <strong>30 minutes</strong>. Together those releases describe a familiar adoption pattern: a consumer-facing assistant, a packaged program for smaller firms, and a measurable operating workflow inside a large service organization. The relevant test is whether the tool improves a defined handoff rather than whether it produces an attractive demo.</p><p>The same feed also carried a harder lesson about long-horizon systems. OpenAI and Hugging Face published a joint account of a security incident during model evaluation, and OpenAI separately wrote about safety and alignment for long-horizon models. The company’s public framing is that stronger agents can plan, use tools and pursue goals over more steps, so evaluation must include containment, monitoring and response rather than only capability scores. That is a factual product constraint: as agents move from answers to actions, the architecture around the model—permissions, sandboxes, audit trails and human escalation—becomes part of the feature. The week therefore supplied both a distribution story and a warning against treating agent autonomy as a UI upgrade.</p><h2><span class=\"num\">2.</span> Anthropic: Claude Opus 5 is positioned as a cheaper long-running agent</h2><p class=\"first\">Anthropic launched <strong>Claude Opus 5</strong> on July 24 and calls it a substantial improvement for the Opus tier, aimed at long-running agents, coding and professional work. The company says it approaches Claude Fable 5 intelligence at half the price, retains the previous Opus 4.8 price, is the default on Claude Max and the strongest model on Claude Pro. Its release materials emphasize adjustable effort: customers can spend more tokens for difficult work or use a lower setting where speed and cost matter. That is a meaningful product choice because it exposes an operational control, not merely a leaderboard claim.</p><p>Anthropic reports that Opus 5 more than doubles Opus 4.8 on Frontier-Bench v0.1 at lower cost per task; at maximum effort it says the model is within 0.5% of Fable 5’s CursorBench 3.2 peak at half the cost per task. The company also reports a roughly 1.5-times next-best pass rate at the same cost on Zapier AutomationBench, and improvements in life-sciences evaluations including organic chemistry and protein-related work. These are vendor-reported evaluations, not independent guarantees. The practical consequence is clearer: teams buying agent capacity now need to choose a model and an effort budget per task, then verify results in their own codebase and workflow.</p><h2><span class=\"num\">3.</span> Voice and computer use are converging into the agent control surface</h2><p class=\"first\">The most consequential interface change was not a new chat tab but the combination of voice, tools and computer control. Riley Brown’s transcript-backed Codex Voice walkthrough shows a real-time voice session requesting customer-support work, opening multiple browser tabs and preparing email drafts through configured skills. He distinguishes this from simple dictation: the user speaks a goal while the agent can use an existing tool configuration and report its progress. Brown’s demo is a creator test rather than an OpenAI specification, but it gives a concrete workflow shape to the wider “voice agent” claim: speak intent, let the system traverse authenticated work surfaces, then inspect the proposed actions.</p><p>Anthropic also upgraded Claude voice mode with tool integration according to the monitored FutureTools listing and Riley Brown’s contemporaneous post: the stated capability includes connectors, access to email and document systems, and the ability to start a coding-and-deployment workflow. The product implication is that voice becomes an input method for an agent with tools, not a separate conversational novelty. That raises a stricter bar for authorization. A voice command that can create a draft, change a document or deploy code needs confirmation boundaries and visible state. Good agent UX will therefore be measured by reversibility, clear permissions and review, as much as by how natural the conversation sounds.</p><h2><span class=\"num\">4.</span> Open weights, Chinese models and new coding harnesses made model choice more practical</h2><p class=\"first\">Moonshot’s Kimi K3 is the key China-linked model story in the monitored set. Argonalyst’s transcript says Moonshot presented Kimi K3 as a <strong>2.8-trillion-parameter</strong> open-source model and compares it with Alibaba’s Qwen 3.8, while stressing that benchmark standings and availability can change quickly. Per Simmons did not take the claimed rankings at face value: his transcript runs Kimi K3, Fable 5 and GPT 5.6 through the same 3D, scrolling-site, game and design prompts, then compares visible outputs and workflow behavior. That contrast matters. A launch page can establish the vendor’s claim; matched tasks expose tool use, context retention and failure recovery.</p><p>Fireship’s transcript-backed video describes an open-weight model release reaching <strong>2.8 trillion parameters</strong>, while FutureTools surfaced several adjacent releases: Poolside’s Laguna S 2.1, a 118B MoE coding model; Alibaba’s Qwen-Image-3.0; and Microsoft’s MAI image and voice previews. The factual signal is breadth rather than a single winner. Buyers have closed frontier models, open-weight alternatives, model routers and task-specific image or coding systems. The operational response should be a routing policy: identify tasks where a frontier planner is justified, tasks where a lower-cost model is sufficient, and checks that keep sensitive data and high-impact actions inside approved paths.</p><h2><span class=\"num\">5.</span> Engineering practice: LLMOps, retrieval, security and verification moved into the core curriculum</h2><p class=\"first\">Tech With Tim’s videos are useful because they describe the unglamorous layer under the model wars. His LLMOps video calls out the production skills employers look for; his RAG explainer treats retrieval as a common engineering pattern; his local-AI and data-science videos focus on how models are actually used in a development environment. Most pointedly, his transcript on agent security demonstrates why an agent with tools can be vulnerable and frames mitigation as work that can be started quickly, not as a reason to abandon agents. The reporting lesson is that an agent is a system: model behavior, retrieved context, tool descriptions, permissions, logs and evaluation all affect outcomes.</p><p>The week also brought a specific software-quality reminder. Simon Willison noted that Ruff 0.16.0 increased default-enabled rules from 59 to 413, surfacing 1,618 issues in one of his own projects. That is not an AI release, but it illustrates the verification burden created by faster code generation. Agents can produce patches and scaffolding faster than teams can safely absorb them; linting, tests, dependency review and clear ownership cannot be deferred. A useful engineering stack pairs an agent with deterministic checks and a human who understands the intended system. “More code” is not the same metric as reliable delivery.</p><div class=\"part\"><p class=\"kicker\">Part II</p><p class=\"part-name\">Economics &amp; geopolitics — adoption, capital and access<span class=\"label-fact\">facts + attributed analysis</span></p></div><h2><span class=\"num\">1.</span> Anthropic put economic measurement and adaptation into the product and research agenda</h2><p class=\"first\">Anthropic made its economic work more accessible by launching an <strong>Anthropic Economic Index connector</strong> for Claude. The company says a user can enable it from the connector directory and ask questions about occupations, regional use, teacher tasks and automation patterns, with answers grounded in Index data and links back to limitations. The stated caveat matters: the Index reflects patterns in Claude usage, not the whole labor market. Packaging a dataset as a conversational connector changes how non-specialists can interrogate it, but it does not turn a usage sample into a universal employment forecast.</p><p>On the research side, Anthropic published an agenda for a <strong>$200 million</strong> Economic Futures Research Fund. It proposes external work on firm- and workplace-level effects, worker transitions, income support, worker stakes in growth and evidence on public investment. The company explicitly says it does not know how quickly capability and diffusion will combine, and calls for ambitious pilots and evaluations rather than relying only on small, slow studies. This is a factual funding commitment, not proof that any policy will work. Still, it is a useful sign that the economic question has shifted from “will AI matter?” to which interventions can be tested before disruption is assumed to be complete.</p><h2><span class=\"num\">2.</span> Open-model economics are a routing and infrastructure question, not only a licensing debate</h2><p class=\"first\">Aaron Levie argued that a multi-model system can use a frontier model as planner and a cheaper workhorse model for implementation; he cited Cursor research claiming a <strong>15×</strong> token-cost improvement on a project. That is an attributed company-and-creator interpretation, not a universal saving. The factual kernel is that modern agent systems can separate decomposition from execution and route requests across models. This design changes procurement: a buyer no longer needs to select one model for every job, but must evaluate latency, cost, quality, privacy, availability and the overhead of coordination.</p><p>The open-weights debate also became a US–China policy argument. Levie, David Sacks and Nathan Lambert publicly backed open-weight development, while Lambert warned against treating all distillation as the same as misappropriation and pointed to adoption data in which Chinese providers remain significant. Their claims are opinions and policy advocacy. The concrete business issue is model access: open weights can be tuned for a specific domain and may lower cost, but they shift responsibility for deployment, security and updates toward the operator. The decision is therefore not “open versus closed” in the abstract; it is who bears operational risk and who has the right to inspect, adapt and host the system.</p><h2><span class=\"num\">3.</span> Compute buildout meets debt, energy and policy scrutiny</h2><p class=\"first\">Michael Burry’s public X posts supplied a skeptical financial lens on the AI buildout. He cited a Nikkei study estimating hidden debt at major US technology companies at <strong>$1.65 trillion</strong>, and separately linked AI investment, Treasury pressure, inflation volatility and electricity demand. These are claims attributed to Burry and the cited publication, not an audited sector balance sheet. His broader point is testable: AI infrastructure spending is financed through a mix of visible and less-visible commitments, and investors need to distinguish revenue-producing capacity from assumptions about future demand.</p><p>The physical constraint is not limited to capital. AI compute needs chips, networking, data centers, grid interconnection and dependable power; public policy determines how quickly those pieces can be built and where. A16z and YC interviews this week shifted attention toward physical AI, data collection and real-world operating systems, while All-In framed the debate around open-source restrictions and industrial competition. Those are different editorial viewpoints, but they converge on a factual planning problem: model capability can advance faster than power, permitting and data pipelines. An AI strategy that ignores those constraints is a product roadmap without a supply chain.</p><h2><span class=\"num\">4.</span> Adoption signals: agent-native coding has scale, but business durability still depends on value</h2><p class=\"first\">YC’s interview with the founder of OpenCode offers a striking usage claim: the open-source coding-agent company said it ended June with around <strong>13 million monthly active users</strong>, had grown roughly 20× since the start of the year and was processing around <strong>7 trillion tokens per day</strong>. These are founder statements in a transcript, not independently audited figures, but they illustrate why coding agents have moved from a niche developer experiment to a distribution and infrastructure market. The founder also stresses affordability in countries where expensive subscriptions are hard to justify, making pricing and model choice central to access.</p><p>YC’s “What Actually Makes a Startup Durable” discussion supplies the counterweight. Speakers argue that intelligence cost is falling rapidly and that models can make engineers dramatically more productive, but they also discuss token expense and expectations created by large fundraising. The safe conclusion is not that every task should be automated. It is that firms should measure unit economics at the workflow level: model and tool cost, retry rate, human review, conversion or time saved, and the cost of a mistake. Durable businesses will use lower inference costs to improve a valuable service, not simply to generate more undifferentiated output.</p><div class=\"part\"><p class=\"kicker\">Part III</p><p class=\"part-name\">Product, engineering &amp; work — attributed arguments<span class=\"label-op\">opinion</span></p></div><p>These are attributed interpretations from monitored people and creator sources, not facts unless separately sourced above.</p><h3 class=\"op\"><span class=\"who\">Aaron Levie</span> — AI is a force multiplier for people with judgment</h3><p>Levie’s most useful product argument is that AI amplifies a field a person already understands, or speeds learning in a field where they are developing judgment. He warns that using a model with no existing judgment and no desire to acquire it produces “slop,” not durable economic value. This is an opinion, but it gives teams a practical staffing rule: assign agents to people who can specify quality, recognize error and connect output to a real decision. His associated multi-model argument extends the idea. The frontier system is most useful where ambiguity and trade-offs remain; cheaper systems can handle work after those decisions are made. The human role is not eliminated—it becomes specification, evaluation and accountability.</p><h3 class=\"op\"><span class=\"who\">Riley Brown</span> — model releases matter less than operational adoption</h3><p>Brown argues that, for most people, model releases are a distraction unless the change is genuinely large; attention should instead go to using AI effectively to achieve a concrete goal. His own Codex videos make that thesis tangible through marketing and support workflows: a persistent project, named skills, a request to collect source material, a destination such as a Notion database, and a review of the result. The opinion is not that model progress is irrelevant. It is that a team gets more value by operationalizing one capable system than by repeatedly resetting its workflow around every announcement. The strongest countermeasure to hype is a saved workflow with an owner, inputs, permissions, output format and quality check.</p><h3 class=\"op\"><span class=\"who\">Andrej Karpathy</span> — voice can be a high-bandwidth way to establish intent</h3><p>Karpathy describes a working pattern he calls a long “ramble session”: switching to voice and explaining a goal in an untidy stream of consciousness so the model receives more of the context that would be tedious to type. The idea is not a claim that voice is always superior. It is a workflow suggestion for early-stage thinking, when the human has a rich mental model but no clean prompt. The discipline comes afterward: turn the ramble into a plan, identify assumptions and ask the system to expose the decisions it made. This is compatible with the week’s voice-agent launches, but it also highlights their risk. More context may improve a model’s understanding; it may also include sensitive information, so teams should decide which voice sessions are local, retained, shareable or allowed to invoke tools.</p><h3 class=\"op\"><span class=\"who\">Simon Willison</span> — simpler prompting and stronger models change the role of loops</h3><p>Willison’s posts offer two related judgments. First, he says Claude Code’s system prompt recently shrank by 80% and suggests that newer models can work better without long lists of examples and prohibitions. Second, he argues that loops were a temporary patch for systems that could not persist on long problems until a defined goal, whereas newer long-horizon models may do more of that natively. Neither claim removes the need for testing. Instead, it shifts engineering attention from elaborate prompt choreography toward clear goals, tool contracts, observable intermediate state and verification. His notes on ChatGPT Sites also illustrate the value of technical inspection: a product can look like a simple website builder while its deployment model, persistence and hosting details determine what users can safely build.</p><h3 class=\"op\"><span class=\"who\">swyx</span> — agentic products need an architecture, not only a clever model</h3><p>swyx’s engineering aphorism this week is that developers should learn the distinction between control plane, data plane and management plane. It is not AI-specific, which is why it is useful. An agentic application needs a path that performs work, a layer that decides policy and routing, and an operating layer that observes, configures and governs the system. His report of dogfooding an agentic GitHub clone with built-in CI/CD points toward the same product principle: automation becomes credible when it is embedded in the workflow that already checks, deploys and records changes. The opinion for builders is to resist a single-agent demo architecture. Separate authority, execution and observability early, because those boundaries are what make a system debuggable when tools fail or a model behaves unexpectedly.</p><h3 class=\"op\"><span class=\"who\">Nathan Lambert</span> — open competition can lower the cost of intelligence, with policy trade-offs</h3><p>Lambert’s argument is that the more important AI analogue to Moore’s law is efficiency: if training and inference efficiency improve year after year, a fixed capability level becomes dramatically cheaper. He frames that as a route to intelligence becoming a commodity, and connects it to support for open models in the United States. He also cautions that reward optimization can produce Goodhart-like failures, sycophancy and verbosity; his shorter lecture treats evaluation rubrics as systems that can be over-optimized. These ideas belong together. Cheap models widen access, but widespread deployment needs better evaluation than a score that can be gamed. Lambert’s position is pro-diffusion, not anti-safety: competition should make useful systems cheaper while measurement catches the ways a model learns to look good rather than do good work.</p><h3 class=\"op\"><span class=\"who\">Greg Isenberg</span> — managing agents is a management discipline, not a prompt trick</h3><p>Isenberg’s “Most Valuable Skill of 2026” video argues that managing AI agents is becoming a distinct, valuable competency. His FDE discussion turns that into an organizational role: someone works close to a customer’s operational problems, translates them into deployable systems and closes the loop from prototype to recurring use. The useful part of the thesis is not the salary headline. It is the managerial model. Agents need tasks broken into checkable units, access limited to what is necessary, outputs reviewed against a business standard and failure patterns fed back into the workflow. A company that treats agents as magical employees will accumulate brittle automation; a company that treats them as a managed fleet can improve prompts, tools, routing and checks over time.</p><h3 class=\"op\"><span class=\"who\">Per Simmons</span> — raw traces beat benchmark theater for buying decisions</h3><p>Simmons’s comparative videos repeatedly make the same methodological point: run the same difficult task across systems and inspect the result. In his Kimi K3 versus Fable 5 versus GPT 5.6 test, he uses 3D, interactive-site, game and design prompts; in his Opus 5 review, he tests web design, simulation, games, motion graphics and knowledge work. He also calls out configuration details such as thinking effort, because a model comparison is meaningless if systems are not given comparable conditions. This is a creator’s opinion, not a controlled scientific evaluation, but it is a better buying habit than copying a launch chart. Organizations should build their own compact benchmark suite from real tasks, preserve traces and score both final quality and the supervision required to get there.</p>",

ic, Introducing Claude Opus 5</a></li><li><a href=\"https://blog.google/innovation-and-ai/technology/ai/\">Google AI blog</a></li><li><a href=\"https://www.kimi.com/blog/\">Kimi Research</a></li><li><a href=\"https://www.zhipuai.cn/en/research\">Zhipu AI Research</a></li><li><a href=\"https://hermes-ai.net/news/\">Hermes Agent news</a></li></ul><h3>Weekly AI sites / newsletters</h3><ul><li><a href=\"https://futuretools.io/news\">FutureTools News</a></li><li><a href=\"https://tldr.tech/ai/archives\">TLDR AI archive</a></li><li><a href=\"https://simple.ai/\">Simple AI</a></li><li><a href=\"https://www.superhuman.ai/archive\">Superhuman archive</a></li></ul><h3>X / Twitter profiles</h3><ul><li><a href=\"https://x.com/simonw/status/2083704964233462075\">Simon Willison — ChatGPT Work / Sites</a></li><li><a href=\"https://x.com/karpathy/status/2083749667410727319\">Andrej Karpathy — long-running visual programming test</a></li><li><a href=\"https://x.com/levie/status/2083389460679373135\">Aaron Levie — harnesses</a></li><li><a href=\"https://x.com/natolambert/status/2082913213092655336\">Nathan Lambert — inference economics</a></li><li><a href=\"https://x.com/swyx/status/2083073422410821846\">swyx — harness distillation</a></li><li><a href=\"https://x.com/rileybrown/status/2082906576147370164\">Riley Brown — collaborative agents</a></li><li><a href=\"https://x.com/michaeljburry/status/2083131587340681345\">Michael Burry — AI price war</a></li><li><a href=\"https://x.com/rowancheung/status/2082130571086745634\">Rowan Cheung — Meta team design</a></li></ul><p class=\"footnote\">All twelve monitored channels were checked; 42 in-window uploads were found and 41 transcripts were retrieved. One duplicate Greg Isenberg upload returned no transcript and is omitted from transcript-derived coverage. DeepSeek, Zhipu and Hermes Agent had no new newsroom release in the window where their listing was checked.</p>"

    "eyebrow": "Semana del 27 de julio al 2 de agosto de 2026",
    "headline": "La nueva unidad de progreso de la IA: el arnés desplegado",
    "dek": "Una semana de inferencia más barata, superficies de agentes y una lección más dura: el flujo de trabajo alrededor del modelo determina si la capacidad se convierte en trabajo útil.",
    "byline": "Síntesis semanal de doce canales de YouTube (41 vídeos del período con transcripción), salas de prensa, sitios semanales de IA y perfiles seleccionados de X. Lectura ~24 min.",
    "body": "<h2><span class=\"num\">0.</span> GPT-5.6, Claude Opus 5 y el giro operativo</h2><p class=\"first\">Los lanzamientos y los informes de uso de esta semana precisaron una distinción práctica: un modelo capaz todavía no es un sistema fiable. La nota de OpenAI del 30 de julio sobre GPT-5.6 describe dos ajustes de API —razonamiento retenido y compacción— como palancas para mejorar rendimiento y eficiencia en ARC-AGI-3; las pruebas de Simon Willison señalan una superficie de producto en la que un navegador puede tomar capturas y desplegar una aplicación web en Cloudflare Workers. La sala de prensa de Anthropic sigue situando Claude Opus 5 para trabajo de agentes de larga duración. Son afirmaciones de producto y flujos de trabajo, no una garantía de corrección autónoma: los equipos aún necesitan credenciales acotadas, resultados revisables, límites de presupuesto y trazabilidad.</p><p>El conjunto de creadores con transcripciones llegó a la misma conclusión desde la implementación. Tech With Tim distingue la memoria del modelo del estado externo que conserva un arnés, y explica las herramientas como acciones explícitas emitidas por el modelo, no como autonomía mágica. Boris Cherny, de YC, describe la reducción del prompt de Claude Code; la “regla del 1%” de Jeff Dean presenta el desarrollo de IA como mejoras pequeñas y repetidas. Contexto, enrutamiento, permisos de herramientas y evaluación ya son parte del producto.</p><div class=\"part\"><p class=\"kicker\">Parte I</p><p class=\"part-name\">Funciones y herramientas: lo que realmente se envió<span class=\"label-fact\">hechos</span></p></div><h2><span class=\"num\">1.</span>OpenAI: salud, distribución para pequeñas empresas y una prueba de la realidad de la seguridad</h2><p class=\"first\">OpenAI aprovechó la semana para ampliar los lugares donde se espera que ChatGPT sea útil.<strong>Salud en ChatGPT</strong>, anunciado el 23 de julio, es una experiencia dedicada a conversaciones sobre salud; No es una afirmación de diagnóstico, sino una superficie de producto destinada a ayudar a las personas a comprender y organizar cuestiones de salud. Dos días antes, la compañía presentó un programa ChatGPT para pequeñas empresas, mientras que su estudio de caso NTT DATA dice que Codex redujo el análisis de incidentes a<strong>30 minutos</strong>. En conjunto, esos lanzamientos describen un patrón de adopción familiar: un asistente de cara al consumidor, un programa empaquetado para empresas más pequeñas y un flujo de trabajo operativo mensurable dentro de una gran organización de servicios. La prueba relevante es si la herramienta mejora una transferencia definida en lugar de si produce una demostración atractiva.</p><p>El mismo feed también contenía una lección más dura sobre los sistemas de largo horizonte. OpenAI y Hugging Face publicaron un relato conjunto de un incidente de seguridad durante la evaluación del modelo, y OpenAI escribió por separado sobre seguridad y alineación para modelos de largo horizonte. El marco público de la empresa es que los agentes más fuertes pueden planificar, utilizar herramientas y perseguir objetivos en más pasos, por lo que la evaluación debeincluir contención, monitoreo y respuesta en lugar de solo puntajes de capacidad. Se trata de una limitación objetiva del producto: a medida que los agentes pasan de las respuestas a las acciones, la arquitectura alrededor del modelo (permisos, entornos sandbox, pistas de auditoría y escalamiento humano) se convierte en parte de la característica. Por lo tanto, la semana proporcionó tanto una historia de distribución como una advertencia contra el tratamiento de la autonomía de los agentes.como una actualización de la interfaz de usuario.</p><h2><span class=\"num\">2.</span>Antrópico: Claude Opus 5 se posiciona como un agente más barato y de larga duración</h2><p class=\"first\">Lanzamiento antrópico<strong>Claude Opus 5</strong>el 24 de julio y lo califica como una mejora sustancial para el nivel Opus, dirigido a agentes de larga trayectoria, codificación y trabajo profesional. La compañía dice que se acerca a la inteligencia Claude Fable 5 a la mitad de precio, mantiene el precio anterior del Opus 4.8, es el modelo predeterminado en Claude Max y el modelo más potente en Claude Pro. Sus materiales de lanzamiento enfatizan el esfuerzo ajustable: los clientes puedengaste más fichas para trabajos difíciles o use una configuración más baja donde la velocidad y el costo importan. Se trata de una elección de producto significativa porque expone un control operativo, no simplemente una afirmación de clasificación.</p><p>Anthropic informa que Opus 5 duplica con creces el Opus 4.8 en Frontier-Bench v0.1 a un menor costo por tarea; con el máximo esfuerzo, dice que el modelo está dentro del 0,5% del pico CursorBench 3.2 de Fable 5 a la mitad del costo por tarea. La compañía también informa una tasa de aprobación aproximadamente 1,5 veces la siguiente mejor al mismo costo en Zapier AutomationBench, y mejoras en las evaluaciones de ciencias biológicas que incluyenQuímica orgánica y trabajos relacionados con proteínas. Se trata de evaluaciones informadas por los proveedores, no de garantías independientes. La consecuencia práctica es más clara: los equipos que compran capacidad de agentes ahora deben elegir un modelo y un presupuesto de esfuerzo por tarea, luego verificar los resultados en su propia base de código y flujo de trabajo.</p><h2><span class=\"num\">3.</span>El uso de la voz y la computadora están convergiendo en la superficie de control de los agentes</h2><p class=\"first\">El cambio de interfaz más importante no fue una nueva pestaña de chat sino la combinación de voz, herramientas y control por computadora. El tutorial de Codex Voice respaldado por transcripciones de Riley Brown muestra una sesión de voz en tiempo real en la que se solicita trabajo de atención al cliente, se abren varias pestañas del navegador y se preparan borradores de correo electrónico a través de habilidades configuradas. Lo distingue del simple dictado: el usuariohabla de un objetivo mientras el agente puede utilizar una configuración de herramienta existente e informar su progreso. La demostración de Brown es una prueba de creador en lugar de una especificación de OpenAI, pero le da una forma de flujo de trabajo concreta a la afirmación más amplia del “agente de voz”: expresar la intención, dejar que el sistema atraviese superficies de trabajo autenticadas y luego inspeccionar las acciones propuestas.</p><p>Anthropic también actualizó el modo de voz de Claude con integración de herramientas de acuerdo con la lista monitoreada de FutureTools y la publicación contemporánea de Riley Brown: la capacidad indicada incluye conectores, acceso a sistemas de documentos y correo electrónico, y la capacidad de iniciar un flujo de trabajo de codificación e implementación. La implicación del producto es que la voz se convierte en un método de entrada para un agente con herramientas,No es una novedad conversacional separada. Eso plantea un listón más estricto para la autorización. Un comando de voz que puede crear un borrador, cambiar un documento o implementar código necesita límites de confirmación y estado visible. Por lo tanto, una buena experiencia de usuario del agente se medirá por la reversibilidad, los permisos claros y la revisión, así como por la naturalidad que suene la conversación.</p><h2><span class=\"num\">4.</span>Las pesas abiertas, los modelos chinos y los nuevos arneses de codificación hicieron que la elección del modelo fuera más práctica</h2><p class=\"first\">El Kimi K3 de Moonshot es la historia clave del modelo vinculado a China en el conjunto monitoreado. La transcripción de Argonalyst dice que Moonshot presentó a Kimi K3 como un<strong>2,8 billones de parámetros</strong>modelo de código abierto y lo compara con Qwen 3.8 de Alibaba, al tiempo que enfatiza que las posiciones de referencia y la disponibilidad pueden cambiar rápidamente. Per Simmons no tomó las clasificaciones reclamadas al pie de la letra: su transcripción ejecuta Kimi K3, Fable 5 y GPT 5.6 a través de las mismas indicaciones 3D, de sitio de desplazamiento, de juego y de diseño, y luego compara los resultados visibles y el comportamiento del flujo de trabajo. ese contrasteasuntos. Una página de lanzamiento puede establecer el reclamo del proveedor; Las tareas coincidentes exponen el uso de herramientas, la retención de contexto y la recuperación de fallas.</p><p>El video respaldado por transcripción de Fireship describe el lanzamiento de un modelo de peso abierto que alcanza<strong>2,8 billones de parámetros</strong>, mientras que FutureTools presentó varios lanzamientos adyacentes: Laguna S 2.1 de Poolside, un modelo de codificación MoE de 118B; Qwen-Image-3.0 de Alibaba; y vistas previas de imagen y voz MAI de Microsoft. La señal fáctica es la amplitud y no un único ganador. Los compradores tienen modelos de frontera cerrada, alternativas de peso abierto, enrutadores de modelos y sistemas de codificación o imágenes para tareas específicas. La respuesta operativaDebería haber una política de enrutamiento: identificar tareas en las que se justifica un planificador de fronteras, tareas en las que un modelo de menor costo es suficiente y verificaciones que mantengan los datos confidenciales y las acciones de alto impacto dentro de las rutas aprobadas.</p><h2><span class=\"num\">5.</span>Práctica de ingeniería: LLMOps, recuperación, seguridad y verificación se trasladaron al plan de estudios básico</h2><p class=\"first\">Los videos de Tech With Tim son útiles porque describen la capa poco glamorosa debajo de las guerras modelo. Su video LLMOps destaca las habilidades de producción que buscan los empleadores; su explicador RAG trata la recuperación como un patrón de ingeniería común; Sus vídeos sobre inteligencia artificial local y ciencia de datos se centran en cómo se utilizan realmente los modelos en un entorno de desarrollo. Lo más llamativo es que su transcripción enLa seguridad de los agentes demuestra por qué un agente con herramientas puede ser vulnerable y enmarca la mitigación como un trabajo que puede iniciarse rápidamente, no como una razón para abandonar a los agentes. La lección de los informes es que un agente es un sistema: el comportamiento del modelo, el contexto recuperado, las descripciones de las herramientas, los permisos, los registros y la evaluación afectan los resultados.</p><p>La semana también trajo un recordatorio específico de la calidad del software. Simon Willison señaló que Ruff 0.16.0 aumentó las reglas habilitadas por defecto de 59 a 413, lo que generó 1.618 problemas en uno de sus propios proyectos. Esta no es una versión de IA, pero ilustra la carga de verificación creada por una generación de código más rápida. Los agentes pueden producir parches y andamios más rápido de lo que los equipos pueden absorber de forma segura.a ellos; El linting, las pruebas, la revisión de dependencias y la propiedad clara no se pueden posponer. Una pila de ingeniería útil combina un agente con controles deterministas y un humano que comprende el sistema previsto. \"Más código\" no es la misma métrica que una entrega confiable.</p><div class=\"part\"><p class=\"kicker\">Parte II</p><p class=\"part-name\">Economía y geopolítica: adopción, capital y acceso<span class=\"label-fact\">hechos + análisis atribuido</span></p></div><h2><span class=\"num\">1.</span>Anthropic puso la medición económica y la adaptación en la agenda de productos e investigación.</h2><p class=\"first\">Anthropic hizo su trabajo económico más accesible al lanzar una<strong>Conector del Índice Económico Antrópico</strong>para Claudio. La compañía dice que un usuario puede habilitarlo desde el directorio de conectores y hacer preguntas sobre ocupaciones, uso regional, tareas de los docentes y patrones de automatización, con respuestas basadas en datos del Índice y enlaces a limitaciones. La advertencia mencionada es importante: el índice refleja patrones en el uso de Claude, no todo el mercado laboral. Empaquetar un conjunto de datos como conversacionalEl conector cambia la forma en que los no especialistas pueden interrogarlo, pero no convierte una muestra de uso en un pronóstico de empleo universal.</p><p>En el ámbito de la investigación, Anthropic publicó una agenda para una<strong>$200 millones</strong>Fondo de Investigación de Futuros Económicos. Propone trabajo externo sobre los efectos a nivel de empresa y lugar de trabajo, transiciones de trabajadores, apoyo a los ingresos, participación de los trabajadores en el crecimiento y evidencia sobre la inversión pública. La compañía dice explícitamente que no sabe qué tan rápido se combinarán la capacidad y la difusión, y pide pruebas piloto y evaluaciones ambiciosas en lugar de depender sólo de proyectos pequeños y lentos.estudios. Se trata de un compromiso de financiación fáctico, no de una prueba de que alguna política funcionará. Aún así, es una señal útil de que la pregunta económica ha pasado de \"¿importará la IA?\" hasta el cual se pueden probar las intervenciones antes de que se suponga que la perturbación ha sido completa.</p><h2><span class=\"num\">2.</span>La economía del modelo abierto es una cuestión de rutas e infraestructura, no sólo un debate sobre licencias</h2><p class=\"first\">Aaron Levie argumentó que un sistema multimodelo puede utilizar un modelo de frontera como planificador y un modelo más barato para la implementación; citó la investigación de Cursor que afirmaba una<strong>15×</strong>mejora del costo simbólico en un proyecto. Ésa es una interpretación atribuida a la empresa y al creador, no un ahorro universal. El núcleo fáctico es que los sistemas de agentes modernos pueden separar la descomposición de la ejecución y enrutar solicitudes entre modelos. Este diseño cambia la adquisición: un comprador ya no necesita seleccionar un modelo para cada trabajo, sino que debe evaluar la latencia, el costo, la calidad,privacidad, disponibilidad y gastos generales de coordinación.</p><p>El debate sobre los pesos abiertos también se convirtió en un argumento político entre Estados Unidos y China. Levie, David Sacks y Nathan Lambert respaldaron públicamente el desarrollo de peso abierto, mientras que Lambert advirtió contra el tratamiento de toda destilación como apropiación indebida y señaló datos de adopción en los que los proveedores chinos siguen siendo importantes. Sus afirmaciones son opiniones y promoción de políticas. La cuestión empresarial concretaes el acceso modelo: los pesos abiertos se pueden ajustar para un dominio específico y pueden reducir el costo, pero transfieren la responsabilidad de la implementación, la seguridad y las actualizaciones al operador. Por lo tanto, la decisión no es “abierta versus cerrada” en abstracto; es quién asume el riesgo operativo y quién tiene derecho a inspeccionar, adaptar y alojar el sistema.</p><h2><span class=\"num\">3.</span>El desarrollo informático se enfrenta al escrutinio de la deuda, la energía y las políticas</h2><p class=\"first\">Las publicaciones públicas de Michael Burry en X proporcionaron una lente financiera escéptica sobre el desarrollo de la IA. Citó un estudio del Nikkei que estimaba la deuda oculta de las principales empresas tecnológicas estadounidenses en<strong>1,65 billones de dólares</strong>y la inversión en IA, la presión del Tesoro, la volatilidad de la inflación y la demanda de electricidad vinculadas por separado. Se trata de afirmaciones atribuidas a Burry y a la publicación citada, no de un balance sectorial auditado. Su punto más amplio es comprobable: el gasto en infraestructura de IA se financia mediante una combinación de compromisos visibles y menos visibles, y los inversores deben distinguir los que generan ingresos.capacidad a partir de supuestos sobre la demanda futura.</p><p>La restricción física no se limita al capital. La computación con IA necesita chips, redes, centros de datos, interconexión de redes y energía confiable; la política pública determina qué tan rápido se pueden construir esas piezas y dónde. Las entrevistas de A16z y YC de esta semana cambiaron la atención hacia la IA física, la recopilación de datos y los sistemas operativos del mundo real, mientras que All-In enmarcó el debate en torno aRestricciones de código abierto y competencia industrial. Se trata de puntos de vista editoriales diferentes, pero convergen en un problema de planificación fáctico: la capacidad del modelo puede avanzar más rápido que la energía, los permisos y los canales de datos. Una estrategia de IA que ignore esas limitaciones es una hoja de ruta de producto sin una cadena de suministro.</p><h2><span class=\"num\">4.</span>Señales de adopción: la codificación nativa del agente tiene escala, pero la durabilidad del negocio aún depende del valor</h2><p class=\"first\">La entrevista de YC con el fundador de OpenCode ofrece una sorprendente afirmación sobre su uso: la empresa de agentes de codificación de código abierto dijo que finalizó junio con alrededor de<strong>13 millones de usuarios activos mensuales</strong>, había crecido aproximadamente 20 veces desde principios de año y se estaba procesando alrededor<strong>7 billones de tokens por día</strong>. Estas son declaraciones del fundador en una transcripción, no cifras auditadas de forma independiente, pero ilustran por qué los agentes de codificación han pasado de un experimento de desarrollador de nicho a un mercado de distribución e infraestructura. El fundador también hace hincapié en la asequibilidad en países donde las costosas suscripciones son difíciles de justificar, lo que hace que el precio y la elección del modelo sean fundamentales para el acceso.</p><p>El debate de YC sobre “Lo que realmente hace que una startup sea duradera” proporciona el contrapeso. Los oradores argumentan que el costo de la inteligencia está cayendo rápidamente y que los modelos pueden hacer que los ingenieros sean dramáticamente más productivos, pero también discuten los gastos simbólicos y las expectativas creadas por la gran recaudación de fondos. La conclusión segura no es que todas las tareas deban automatizarse. Es que las empresas deberíanMida la economía unitaria a nivel del flujo de trabajo: costo del modelo y de la herramienta, tasa de reintentos, revisión humana, conversión o tiempo ahorrado y el costo de un error. Las empresas duraderas utilizarán costos de inferencia más bajos para mejorar un servicio valioso, no simplemente para generar una producción más indiferenciada.</p><div class=\"part\"><p class=\"kicker\">Parte III</p><p class=\"part-name\">Producto, ingeniería y trabajo: argumentos atribuidos<span class=\"label-op\">opinión</span></p></div><p>Estas son interpretaciones atribuidas de personas monitoreadas y fuentes de creadores, no hechos a menos que se obtengan por separado anteriormente.</p><h3 class=\"op\"><span class=\"who\">Aarón Levie</span>— La IA es un multiplicador de fuerza para las personas con criterio.</h3><p>El argumento más útil de Levie sobre el producto es que la IA amplifica un campo que una persona ya comprende o acelera el aprendizaje en un campo en el que está desarrollando su juicio. Advierte que utilizar un modelo sin un juicio previo y sin deseo de adquirirlo produce una “baja”, no un valor económico duradero. Esta es una opinión, pero les da a los equipos una regla práctica de dotación de personal: asignar agentes a las personasquién puede especificar la calidad, reconocer errores y conectar los resultados con una decisión real. Su argumento multimodelo asociado amplía la idea. El sistema de fronteras es más útil cuando persisten la ambigüedad y las compensaciones; Los sistemas más baratos pueden manejar el trabajo después de que se tomen esas decisiones. El papel humano no se elimina: se convierte en especificación, evaluación y responsabilidad.</p><h3 class=\"op\"><span class=\"who\">Riley Brown</span>— los lanzamientos de modelos importan menos que la adopción operativa</h3><p>Brown sostiene que, para la mayoría de las personas, los lanzamientos de modelos son una distracción a menos que el cambio sea realmente grande; En cambio, la atención debería centrarse en utilizar la IA de forma eficaz para lograr un objetivo concreto. Sus propios videos del Codex hacen que esa tesis sea tangible a través de flujos de trabajo de marketing y soporte: un proyecto persistente, habilidades con nombre, una solicitud para recopilar material fuente, un destino como Notion.base de datos y revisión del resultado. La opinión no es que el progreso del modelo sea irrelevante. Es que un equipo obtiene más valor al poner en funcionamiento un sistema capaz que al restablecer repetidamente su flujo de trabajo en torno a cada anuncio. La contramedida más fuerte contra las exageraciones es un flujo de trabajo guardado con un propietario, entradas, permisos, formato de salida y control de calidad.</p><h3 class=\"op\"><span class=\"who\">Andrej Karpathy</span>— la voz puede ser una forma de gran ancho de banda para establecer la intención</h3><p>Karpathy describe un patrón de trabajo que él llama una larga “sesión de divagación”: cambiar a la voz y explicar un objetivo en un flujo desordenado de conciencia para que el modelo reciba más contexto que sería tedioso escribir. La idea no es afirmar que la voz sea siempre superior. Es una sugerencia de flujo de trabajo para el pensamiento en las primeras etapas, cuando el ser humano tiene un modelo mental rico pero nomensaje de limpieza. La disciplina viene después: convertir la divagación en un plan, identificar supuestos y pedir al sistema que exponga las decisiones que tomó. Esto es compatible con los lanzamientos de agentes de voz de la semana, pero también resalta su riesgo. Un mayor contexto puede mejorar la comprensión de un modelo; También puede incluir información confidencial, por lo que los equipos deben decidir qué sesiones de voz sonherramientas locales, retenidas, compartibles o permitidas para invocar.</p><h3 class=\"op\"><span class=\"who\">Simón Willison</span>— indicaciones más simples y modelos más sólidos cambian el papel de los bucles</h3><p>Las publicaciones de Willison ofrecen dos juicios relacionados. En primer lugar, dice que el aviso del sistema de Claude Code se redujo recientemente en un 80% y sugiere que los modelos más nuevos pueden funcionar mejor sin largas listas de ejemplos y prohibiciones. En segundo lugar, sostiene que los bucles eran un parche temporal para los sistemas que no podían persistir en problemas prolongados hasta alcanzar un objetivo definido, mientras que los modelos más nuevos a largo plazo pueden hacer más.de eso de forma nativa. Ninguna afirmación elimina la necesidad de realizar pruebas. En cambio, desvía la atención de la ingeniería de una coreografía rápida y elaborada hacia objetivos claros, contratos de herramientas, estados intermedios observables y verificación. Sus notas sobre los sitios ChatGPT también ilustran el valor de la inspección técnica: un producto puede parecer un simple creador de sitios web, mientras que su modelo de implementación,los detalles de persistencia y alojamiento determinan lo que los usuarios pueden crear de forma segura.</p><h3 class=\"op\"><span class=\"who\">swyx</span>— los productos agentes necesitan una arquitectura, no sólo un modelo inteligente</h3><p>El aforismo de ingeniería de swyx esta semana es que los desarrolladores deberían aprender la distinción entre plano de control, plano de datos y plano de gestión. No es específico de la IA, por eso es útil. Una aplicación agente necesita una ruta que realice el trabajo, una capa que decida la política y el enrutamiento, y una capa operativa que observe, configure y gobierne el sistema. Su informe deLa prueba interna de un clon agente de GitHub con CI/CD incorporado apunta hacia el mismo principio del producto: la automatización se vuelve creíble cuando está integrada en el flujo de trabajo que ya verifica, implementa y registra los cambios. La opinión de los constructores es resistirse a una arquitectura de demostración de un solo agente. Separe tempranamente la autoridad, la ejecución y la observabilidad, porque esos límites son los que hacen que unaEl sistema se puede depurar cuando las herramientas fallan o un modelo se comporta inesperadamente.</p><h3 class=\"op\"><span class=\"who\">Nathan Lambert</span>— la competencia abierta puede reducir el costo de la inteligencia, con compensaciones políticas</h3><p>El argumento de Lambert es que el análogo de IA más importante de la ley de Moore es la eficiencia: si la eficiencia del entrenamiento y la inferencia mejoran año tras año, un nivel de capacidad fijo se vuelve dramáticamente más barato. Lo plantea como una ruta para que la inteligencia se convierta en una mercancía y la conecta con el apoyo a los modelos abiertos en Estados Unidos. También advierte que la optimización de las recompensas puedeproducir fracasos, adulación y verbosidad al estilo Goodhart; Su conferencia más breve trata las rúbricas de evaluación como sistemas que pueden optimizarse en exceso. Estas ideas van juntas. Los modelos baratos amplían el acceso, pero su implementación generalizada necesita una mejor evaluación que una puntuación que pueda manipularse. La posición de Lambert es a favor de la difusión, no en contra de la seguridad: la competencia debería hacer que los sistemas sean útilesmás barato, mientras que la medición detecta las formas en que un modelo aprende a verse bien en lugar de hacer un buen trabajo.</p><h3 class=\"op\"><span class=\"who\">Greg Isenberg</span>— gestionar agentes es una disciplina de gestión, no un truco rápido</h3><p>El vídeo de Isenberg “La habilidad más valiosa de 2026” sostiene que la gestión de agentes de IA se está convirtiendo en una competencia distinta y valiosa. Su discusión sobre FDE convierte eso en un rol organizacional: alguien trabaja cerca de los problemas operativos de un cliente, los traduce en sistemas implementables y cierra el ciclo desde el prototipo hasta el uso recurrente. La parte útil de la tesis no es el salario.titular. Es el modelo gerencial. Los agentes necesitan dividir las tareas en unidades verificables, limitar el acceso a lo necesario, revisar los resultados con respecto a un estándar empresarial y retroalimentar los patrones de error al flujo de trabajo. Una empresa que trata a los agentes como empleados mágicos acumulará una automatización frágil; una empresa que los trata como una flota administrada puede mejorar los avisos, las herramientas,enrutamiento y controles a lo largo del tiempo.</p><h3 class=\"op\"><span class=\"who\">Por Simmons</span>— las trazas en bruto superan el teatro de referencia a la hora de tomar decisiones de compra</h3><p>Los vídeos comparativos de Simmons destacan repetidamente el mismo punto metodológico: ejecutar la misma tarea difícil en todos los sistemas e inspeccionar el resultado. En su prueba Kimi K3 versus Fable 5 versus GPT 5.6, utiliza sugerencias de diseño, juegos y sitios interactivos en 3D; en su revisión de Opus 5, prueba diseño web, simulación, juegos, gráficos en movimiento y trabajo de conocimiento. También menciona la configuración.detalles como el esfuerzo de pensamiento, porque una comparación de modelos no tiene sentido si a los sistemas no se les dan condiciones comparables. Esta es la opinión de un creador, no una evaluación científica controlada, pero es un mejor hábito de compra que copiar un gráfico de lanzamiento. Las organizaciones deben crear su propio conjunto de pruebas comparativas compacto a partir de tareas reales, preservar los rastros y calificar tanto la calidad final como la calidad.la supervisión necesaria para llegar allí.</p>",

w.youtube.com/watch?v=jxGJT1weu4w\">Fireship — Did Anthropic just kill the indie hacker...?</a></li><li><a href=\"https://www.youtube.com/watch?v=Uslb-G2pc5I\">GregIsenberg — Everyone is saying SOFTWARE IS DEAD (LIVE Q&amp;A)</a></li><li><a href=\"https://www.youtube.com/watch?v=_jGSgzBkzrY\">GregIsenberg — Jack Dorsey&#x27;s Buzz: Clearly Explained (and how to use it)</a></li><li><a href=\"https://www.youtube.com/watch?v=U2hogriGmEw\">GregIsenberg — Marketing Agents Are Too Good Now</a></li><li><a href=\"https://www.youtube.com/watch?v=5d6y3poKwK4\">ycombinator — Patrick Collison: &quot;What If You Succeed?&quot;</a></li><li><a href=\"https://www.youtube.com/watch?v=CxXgV54KzpQ\">ycombinator — Jeff Dean: The 1% Rule for Building in AI</a></li><li><a href=\"https://www.youtube.com/watch?v=n8dz2FX0_uY\">ycombinator — Multi-GPU Kernels, Intelligence per Watt, Heterogeneous Inference, and More | YC Paper Club</a></li><li><a href=\"https://www.youtube.com/watch?v=sJ4VJWycX9M\">ycombinator — Alexandr Wang: “This is a Once-in-a-Civilization Opportunity”</a></li><li><a href=\"https://www.youtube.com/watch?v=byAj35QlGbs\">ycombinator — Blake Scholl: The Problem With Becoming an Expert</a></li><li><a href=\"https://www.youtube.com/watch?v=ZIaOBAjvc38\">ycombinator — Sam Altman: &quot;Never a Better Time to Do a Startup&quot;</a></li><li><a href=\"https://www.youtube.com/watch?v=qyPCVqFUyDo\">ycombinator — Boris Cherny: We Cut 80% of Claude Code’s Prompt</a></li><li><a href=\"https://www.youtube.com/watch?v=K8IPfQUiASo\">Argonalyst — O verdadeiro motivo pelo qual querem controlar a IA</a></li><li><a href=\"https://www.youtube.com/watch?v=vcro072EtoY\">Argonalyst — IA da OpenAI escapou do Sandbox? O que REALMENTE aconteceu</a></li></ul><h3>Salas de prensa</h3><ul><li><a href=\"https://openai.com/index/advancing-the-price-performance-frontier-with-gpt-5-6\">OpenAI, Advancing the price-performance frontier with GPT-5.6</a></li><li><a href=\"https://www.anthropic.com/news/claude-opus-5\">Anthropic, Introducing Claude Opus 5</a></li><li><a href=\"https://blog.google/innovation-and-ai/technology/ai/\">Google AI blog</a></li><li><a href=\"https://www.kimi.com/blog/\">Kimi Research</a></li><li><a href=\"https://www.zhipuai.cn/en/research\">Zhipu AI Research</a></li><li><a href=\"https://hermes-ai.net/news/\">Hermes Agent news</a></li></ul><h3>Sitios semanales de IA / boletines</h3><ul><li><a href=\"https://futuretools.io/news\">FutureTools News</a></li><li><a href=\"https://tldr.tech/ai/archives\">TLDR AI archive</a></li><li><a href=\"https://simple.ai/\">Simple AI</a></li><li><a href=\"https://www.superhuman.ai/archive\">Superhuman archive</a></li></ul><h3>Perfiles de X / Twitter</h3><ul><li><a href=\"https://x.com/simonw/status/2083704964233462075\">Simon Willison — ChatGPT Work / Sites</a></li><li><a href=\"https://x.com/karpathy/status/2083749667410727319\">Andrej Karpathy — long-running visual programming test</a></li><li><a href=\"https://x.com/levie/status/2083389460679373135\">Aaron Levie — harnesses</a></li><li><a href=\"https://x.com/natolambert/status/2082913213092655336\">Nathan Lambert — inference economics</a></li><li><a href=\"https://x.com/swyx/status/2083073422410821846\">swyx — harness distillation</a></li><li><a href=\"https://x.com/rileybrown/status/2082906576147370164\">Riley Brown — collaborative agents</a></li><li><a href=\"https://x.com/michaeljburry/status/2083131587340681345\">Michael Burry — AI price war</a></li><li><a href=\"https://x.com/rowancheung/status/2082130571086745634\">Rowan Cheung — Meta team design</a></li></ul><p class=\"footnote\">Se revisaron los doce canales: se hallaron 42 publicaciones del período y se recuperaron 41 transcripciones. Una carga duplicada de Greg Isenberg no devolvió transcripción y se omitió de la cobertura derivada de transcripciones. DeepSeek, Zhipu y Hermes Agent no mostraron un lanzamiento nuevo en la ventana al revisar sus listados.</p>"
