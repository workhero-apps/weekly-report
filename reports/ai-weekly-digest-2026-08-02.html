                "headline": "Los agentes pasaron de lanzamientos a flujos de trabajo",
                "dek": "GPT-5.6 entró en Microsoft 365, ChatGPT Work y GPT-Live ampliaron las superficies de OpenAI, Anthropic llevó Claude a reflexión y despliegues físicos, y los builders preguntaron qué flujos agente son confiables.",
                "byline": "Una síntesis semanal de once canales de YouTube, cuatro redacciones, cuatro sitios/boletines semanales de IA y perfiles seleccionados de X. Edición estructurada: 5 notas de producto, 4 notas económicas y 10 opiniones de fuentes únicas, con 19 videos respaldados por transcripción. Tiempo de lectura ~25 min.",
                "body": "<div class=\"part\"><p class=\"kicker\">Parte I</p><p class=\"part-name\">Funciones y herramientas — lo que realmente salió<span class=\"label-fact\">datos</span></p></div>\n<h2><span class=\"num\">1.</span> OpenAI convirtió GPT-5.6 en línea de producto, agente de escritorio, voz y modelo predilecto de Microsoft</h2>\n<p class=\"first\">El RSS de OpenAI hizo del 9 de julio el día de producto más denso de la semana. <strong>GPT-5.6</strong> apareció como inteligencia frontier con más inteligencia por token, mejor rendimiento por dólar y más capacidad bajo demanda para trabajos difíciles. La misma fuente dice que <strong>Microsoft 365 Copilot</strong> adoptó GPT-5.6 como modelo predilecto en Word, Excel, PowerPoint, Chat y Cowork, de modo que el lanzamiento entró de inmediato en flujos de oficina y no quedó como historia de API o benchmark. OpenAI también anunció <strong>ChatGPT Work</strong>, un agente que puede actuar entre aplicaciones y archivos, tomar contexto de material local, acompañar un proyecto durante horas y convertir un objetivo en trabajo terminado. Superhuman añadió el empaquetado para usuarios: una nueva aplicación de escritorio que reúne ChatGPT, Work y Codex, gratuita en todos los planes, mientras Work se despliega como superficie de agente para computadora y teléfono.</p>\n<p>El segundo hilo de OpenAI fue multimodal y operativo. <strong>GPT-Live</strong>, anunciado el 8 de julio, es una nueva generación de modelos de voz para interacción natural y ya impulsa ChatGPT Voice; Superhuman lo describió como escuchar y hablar a la vez, un detalle importante porque los asistentes de voz fallan cuando la conversación parece dictado por turnos. Los demás anuncios completaron los bordes del despliegue: un programa Bio Bug Bounty para GPT-5.5, una política para alianzas de seguridad nacional, una crítica a evaluaciones ruidosas de programación en SWE-Bench Pro, jornadas de habilidades de IA para docentes K–12 con Walton Family Foundation y casos empresariales con Deutsche Telekom, MUFG y Australian Payments Plus. El patrón factual es claro: OpenAI lanzó modelo, lo insertó en Microsoft, lo envolvió en un escritorio agente, amplió voz y publicó notas de gobierno en la misma ventana.</p>\n<h2><span class=\"num\">2.</span> Anthropic lanzó reflexión, despliegues de IA física y un proceso público de preguntas alrededor de Claude</h2>\n<p>La semana de Anthropic trató menos de un solo nombre de modelo y más de cómo se usa Claude después de adoptarlo. El 9 de julio presentó en beta una forma de <strong>reflexionar y mejorar el uso de Claude</strong>. El anuncio dice que las entrevistas con usuarios mostraron deseo de entender exactamente cómo usan el asistente, dónde ayuda y cómo mejorar la práctica. Eso convierte la analítica de uso en un ciclo de aprendizaje: mirar patrones en vez de tratar cada chat como desechable. Ese mismo día, Anthropic publicó “Inviting hard questions”, pidió al público preguntas difíciles sobre IA y prometió mostrar su trabajo al responderlas. Los ejemplos incluyeron quién decide las reglas, si la IA puede dar un futuro mejor a los niños, si vuelve el mundo más peligroso y si puede ayudar a curar enfermedades.</p>\n<p>Los despliegues fueron concretos. UST lleva Claude a la IA física: Anthropic plantea el problema como el mundo previo a fabricar, donde validación de chips, fallas de fábrica y defectos de producto se vuelven caros si aparecen tarde. FutureTools resumió que UST despliega Claude para <strong>20.000 ingenieros</strong> en validación de chips y flujos de IA física. El caso del Gobierno de Alberta dice que desde 2025 usa Claude Code con modelos Opus y Sonnet para encontrar y corregir vulnerabilidades de ciberseguridad en sistemas gubernamentales. Anthropic también nombró al ex presidente de la Reserva Federal <strong>Ben Bernanke</strong> en su Long-Term Benefit Trust, organismo independiente que debe sostener la misión de beneficio público. En conjunto, Claude pasó de chat a auditoría, ingeniería, seguridad, rendición pública y gobernanza.</p>\n<h2><span class=\"num\">3.</span> Google, Meta, xAI y Microsoft empujaron modelos especializados hacia agentes, medios y optimización de código</h2>\n<p>Fuera de los dos incumbentes frontier, las fuentes semanales mostraron una ola amplia de lanzamientos. FutureTools enlazó la disponibilidad general de <strong>AlphaEvolve</strong> en Google Cloud: un agente de optimización de código de Google disponible para todos mediante Google Cloud. Su valor no es otra interfaz conversacional; ataca un problema de producción más estrecho, encontrar mejoras algorítmicas y de código que puedan evaluarse, probarse y desplegarse. TLDR del 8 de julio también marcó “Gemini API agents”, colocando la semana de Google en el mismo carril de infraestructura agente que OpenAI Work y Claude Cowork. En ese contexto, AlphaEvolve es el elemento más concreto porque transforma trabajo de modelos en salidas de optimizador para equipos de ingeniería.</p>\n<p>Meta presentó <strong>Muse Spark 1.1</strong> el 9 de julio mediante una nueva API. El artículo original de Meta lo llama modelo de razonamiento multimodal de Meta Superintelligence Labs y dice que mejora con fuerza uso de herramientas, uso de computadora, programación y tareas multimodales. Superhuman había enmarcado el trabajo de imagen de Meta como superior a los principales modelos de Google y Microsoft y capaz de llevar creación de imágenes dentro de Instagram y WhatsApp. xAI lanzó <strong>Grok 4.5</strong> el 8 de julio; su página lo describe como el modelo más inteligente de la empresa para programación, trabajo agente y conocimiento, con superficies en Grok, empresas, gobierno y desarrolladores. Microsoft AI mostró el extremo opuesto con Ode: modelos de audio para artefactos culturales expresivos, junto con su menú propio de razonamiento, código e imagen.</p>\n<h2><span class=\"num\">4.</span> Las superficies agente pasaron de demos a tareas programadas, navegadores, móviles y diseño visible</h2>\n<p>La historia de agentes no fue solo modelos nuevos; fue dónde vive el trabajo. El ensayo de Simple AI del 10 de julio sostuvo que las tareas programadas de IA son la diferencia entre herramienta y compañero. Dio rutas de configuración para tareas programadas en ChatGPT y Claude, aclaró que ambas son funciones pagas y ubicó la suscripción relevante cerca de <strong>20 dólares mensuales</strong>. El punto operativo es sencillo: cuando un prompt ayuda de forma confiable, programarlo convierte el asistente en flujo recurrente. El texto “Fan Out” del 7 de julio añadió la táctica complementaria: pedir varias versiones en paralelo en vez de iterar una sola respuesta. Para diseño, copy, investigación y producto, es un primitivo porque usa generación barata para mejorar opciones.</p>\n<p>Los videos monitoreados mostraron la misma migración en práctica. Riley Brown probó Grok 4.5 dentro de Cursor y construyó con Claude Fable 5; Per Simmons comparó GPT-5.6 y Fable 5 en la misma app, revisó GPT-5.6 sin hype y creó un arnés agente; Tech With Tim se concentró en plugins de Claude Code, Pyright, bloqueo de modelo, revisión de código y análisis de negocio sin código; Fellyph Cintra entrevistó en portugués sobre web agéntica y WebMCP; YC publicó lecciones de diseño y analítica para productos de IA, incluyendo diseño con IA, dot plots de comportamiento y el problema del lienzo en blanco. Claude Cowork en web y móvil encaja en la misma categoría: el asistente debe entregar trabajo entre dispositivos, no solo responder dentro de un chat.</p>\n<h2><span class=\"num\">5.</span> Benchmarks de programación y modelos locales se volvieron infraestructura de confianza</h2>\n<p>“Separating signal from noise in coding evaluations” de OpenAI fue un correctivo útil ante la fiebre de lanzamientos. El RSS dice que OpenAI encontró problemas en <strong>SWE-Bench Pro</strong>, benchmark popular de programación, y alertó sobre confiabilidad y precisión al evaluar modelos. Importa porque casi cada lanzamiento promete fuerza en código, pero la adopción depende de si las pruebas predicen pull requests, depuración y mantenimiento reales. Simon Willison reflejó en X la confusión práctica: GPT-5.6 llega con varios modelos y niveles de razonamiento, de modo que elegir modelo ya es una decisión de trabajo. El resultado factual es que evaluar forma parte de la calidad del producto; un modelo puede ser poderoso y estar mal medido para el flujo exacto que compra el cliente.</p>\n<p>El editorial de FutureTools “Why Everyone Should Have a Local AI Model (Even If You Love ChatGPT)” capturó el segundo tema de confianza. Los modelos locales dan privacidad, continuidad sin conexión, control de coste y resiliencia cuando los agentes en nube cambian precios o políticas. Los mensajes de Aaron Levie hicieron la versión empresarial: la mayoría de los datos útiles no está en la web abierta; vive en organizaciones, sistemas heredados y conocimiento tácito. Si los modelos comparten entrenamiento público parecido, la ventaja pasa a la capa aplicada que conecta con contexto privado de forma segura. Por eso plugins, Pyright, revisión de código, modelos locales y benchmarks pertenecen junto a los grandes lanzamientos: son plomería de dependencia, no adornos.</p>\n<div class=\"part\"><p class=\"kicker\">Parte II</p><p class=\"part-name\">Economía — adopción, distribución y cifras duras<span class=\"label-fact\">datos</span></p></div>\n<h2><span class=\"num\">1.</span> La distribución de Microsoft volvió GPT-5.6 un predeterminado empresarial inmediato</h2>\n<p>El RSS de OpenAI del 9 de julio dice que <strong>GPT-5.6 es ahora el modelo predilecto en Microsoft 365 Copilot</strong>. El significado económico es distribución: Word, Excel, PowerPoint, Chat y Cowork ya son superficies colaborativas presupuestadas por grandes organizaciones, así que la adopción no exige que cada comprador descubra una herramienta aislada. Microsoft puede empaquetar mayor calidad de modelo como mejora productiva dentro de puestos existentes. Para OpenAI, es una ruta desde capacidad de modelo hacia uso empresarial recurrente; para Microsoft, mantiene Copilot diferenciado cuando clientes comparan agentes de ChatGPT, Claude, Gemini y Grok. No se publicó precio nuevo, así que el hecho sólido es ubicación, no ingresos.</p>\n<h2><span class=\"num\">2.</span> Los casos empresariales vendieron el mismo cambio operativo en telecom, bancos y pagos</h2>\n<p>OpenAI publicó tres casos empresariales en la ventana. Deutsche Telekom está “recableando” telecomunicaciones con IA: atención al cliente, flujos de empleados, operaciones de red y futuro de voz. MUFG busca volverse AI-native con ChatGPT Enterprise y nuevos servicios financieros con IA. Australian Payments Plus usa ChatGPT Enterprise y Codex para avanzar en complejidad de pagos manteniendo juicio humano. Ningún post, según el RSS disponible, reveló valor contractual; el hecho duro es amplitud sectorial. Los proveedores venden no solo acceso al modelo sino cambio de modo operativo en sectores regulados, donde velocidad, calidad, control de riesgo y contexto de dominio pesan más que la novedad.</p>\n<h2><span class=\"num\">3.</span> El despliegue de Claude para 20.000 ingenieros de UST vendió apalancamiento antes de fabricar</h2>\n<p>UST entregó la cifra de adopción más limpia de la semana. FutureTools resumió el caso de Anthropic como despliegue de Claude para <strong>20.000 ingenieros</strong> en validación de chips y flujos de IA física. El marco original explica por qué importa: errores antes de fabricar millones de chips o antes de enviar un producto pueden convertirse en fallas muy caras. Claude se posiciona como apalancamiento en validación, donde razonamiento de software se cruza con producción física. Es un centro presupuestario distinto del chat de productividad. Compite por dólares de ingeniería, calidad y preproducción prometiendo detección temprana, revisión más rápida y coordinación en sistemas técnicos complejos.</p>\n<h2><span class=\"num\">4.</span> Funciones pagas de agentes y el primer modelo pago de Meta desplazaron la conversación hacia margen</h2>\n<p>Simple AI señaló explícitamente que las tareas programadas en ChatGPT y Claude son funciones pagas y estimó la suscripción relevante en unos <strong>20 dólares al mes</strong>. Superhuman del 10 de julio dijo que Meta estrenó su primer modelo pago, <strong>Muse Spark 1.1</strong>, mediante una nueva API, giro frente a una postura puramente de pesos abiertos. TLDR también informó que Apple y Broadcom extendieron una alianza de chips personalizados hasta <strong>2031</strong>, recordando que la economía de IA incluye compromisos de cómputo a largo plazo, no solo suscripciones. El hilo común es disciplina de monetización: agentes necesitan asientos recurrentes, modelos multimodales necesitan precios de API y el despliegue frontier necesita chips asegurados por años.</p>\n<div class=\"part\"><p class=\"kicker\">Parte III</p><p class=\"part-name\">Opinión e ideas — argumentos atribuidos, no hechos<span class=\"label-op\">opinión</span></p></div>\n<p>Estas son interpretaciones de personas y publicaciones monitoreadas; son argumentos útiles, no hechos verificados salvo cuando se citaron arriba.</p>\n<h3 class=\"op\"><span class=\"who\">Aaron Levie</span> — el contexto empresarial es la capa defendible</h3>\n<p>Aaron Levie argumentó que los datos más valiosos para IA no están en la web pública. Están dentro de compañías, sistemas heredados, permisos, flujos y conocimiento de empleados. Su visión es que los modelos frontier seguirán siendo importantes para casos nuevos, pero la ventaja duradera pasará a la capa aplicada que protege, recupera y actúa sobre contenido propietario. También sostuvo que las vacantes de software pueden subir cuando la IA reduce el coste de producir software, porque el coste menor expande la demanda de herramientas internas. Es una tesis empresarial optimista: la IA no solo elimina trabajo; aumenta la superficie de trabajo que vale automatizar.</p>\n<h3 class=\"op\"><span class=\"who\">Riley Brown</span> — construir software para agentes, no solo para humanos</h3>\n<p>Riley Brown impulsó una tesis de producto agent-native. Escribió que conviene crear algo que los agentes quieran y predijo que algunos de los mejores plugins para Codex, Claude y Cursor serán productos solo-plugin, no apps tradicionales con extensión añadida. En sus pruebas de Grok 4.5 y GPT-5.6, el punto no fue un leaderboard abstracto sino qué tan rápido un modelo crea apps funcionales dentro de Cursor o Codex. Su marco de “motores de acción” para ChatGPT, Claude, Grok y Gemini marca el giro de búsqueda a ejecución: la interfaz a optimizar puede ser el agente que hace clic, edita, redacta y lanza.</p>\n<h3 class=\"op\"><span class=\"who\">Simon Willison</span> — “empleados de IA” es una metáfora equivocada</h3>\n<p>Simon Willison objetó la etiqueta “AI employees”: la consideró miope, irrespetuosa con humanos y mala descripción de lo que las herramientas hacen bien. Su analogía fue que nadie agrega hojas de Excel al organigrama. Importa porque el lenguaje cambia la gestión: si una empresa imagina agentes como empleados, puede sobreconfiar en autonomía, invertir poco en interfaces e ignorar revisión. Willison también notó confusión entre ChatGPT, ChatGPT Codex, ChatGPT Work, Claude, Claude Code y Claude Cowork. Su advertencia práctica es que nombres de producto y elección de modelo se volvieron carga cognitiva para builders.</p>\n<h3 class=\"op\"><span class=\"who\">swyx</span> — la interpretabilidad pasa de observar a intervenir</h3>\n<p>swyx destacó la investigación J-space de Anthropic porque sugiere dos cosas: se pueden hacer intervenciones tipo “cirugía cerebral” que cambian la dirección de razonamiento de un modelo, y el modelo detecta algunas intervenciones. Su lectura es que la interpretabilidad mecanicista se mueve de visualización pasiva a control activo. También señaló la dificultad productiva de usar modelos chinos en laboratorios de agentes que venden a gobierno y defensa, con evaluaciones multilingües de propaganda y censura. Su idea más amplia es que los sistemas de IA ya son sociotécnicos: capacidad, interpretabilidad, geopolítica y compras se mezclan.</p>\n<h3 class=\"op\"><span class=\"who\">Nathan Lambert</span> — hablar de transparencia sin open source queda incompleto</h3>\n<p>Nathan Lambert reaccionó a AI 2040 aceptando su foco en transparencia, pero encontró raro que no tratara en serio el open source. El argumento no es un lema genérico. Dice que transparencia no puede significar solo reportes, auditorías o divulgaciones de laboratorios cerrados; también incluye si terceros pueden inspeccionar, ejecutar, adaptar y disputar sistemas. En una semana donde Meta introdujo un modelo pago por API y FutureTools defendió modelos locales, su punto es la versión de gobernanza del argumento local: la confianza pública mejora cuando más partes del stack pueden examinarse y reproducirse.</p>\n<h3 class=\"op\"><span class=\"who\">Greg Isenberg</span> — un lanzamiento importa si cambia el apalancamiento de una startup</h3>\n<p>Los videos con transcripción de Greg Isenberg enmarcaron Grok 4.5, Fable 5 y GPT-5.6 desde el uso de startups, no desde compras corporativas. Su pregunta central fue si una versión permite que un equipo diminuto cree un producto, un bucle de crecimiento o un operador interno que antes requería más plantilla. Por eso su formato de compartir pantalla importa: la opinión se prueba en flujos reales. Para builders, la conclusión es juzgar un modelo por cuántos experimentos de negocio nuevos habilita por semana. Un modelo algo peor en benchmark pero más fácil de colocar en Cursor, voz, navegador o agentes puede valer más que una puntuación teórica.</p>\n<h3 class=\"op\"><span class=\"who\">Per Simmons</span> — comparar modelos por conducta cruda, no por hype</h3>\n<p>Per Simmons comparó GPT-5.6 y Fable 5 en la misma app, revisó GPT-5.6 sin hype y construyó un arnés agente con Fable 5. Su método editorial es la opinión: usar prompts idénticos, mostrar fallos sin limpiar, inspeccionar código y preguntar si el modelo maneja estado, interfaz, llamadas a herramientas y casos borde sin ayuda constante. Eso contrarresta la semana de lanzamientos donde cada laboratorio propone su modelo como nuevo predeterminado. Para practicantes, su argumento es que un benchmark privado hecho con tareas propias puede ser más útil que afirmaciones públicas, sobre todo cuando elegir modelo incluye razonamiento, coste e integración agente.</p>\n<h3 class=\"op\"><span class=\"who\">Tech With Tim</span> — programar con IA necesita barandillas antes que velocidad</h3>\n<p>Los videos de Tech With Tim formaron una lista de control: usar Pyright, escoger plugins de Claude Code con cuidado, evitar encierro en un modelo, revisar código generado y no tratar salida vibe-coded como software terminado. La opinión de fondo es conservadora en buen sentido. La IA acelera implementación, pero velocidad sin tipos, pruebas, revisión e higiene de seguridad se transforma en deuda escondida. Sus avisos breves sobre apps con filtraciones y herramientas de scraping van en la misma línea: el mejor ingeniero de IA no es quien prompea más rápido, sino quien construye un circuito de verificación alrededor del código generado.</p>\n<h3 class=\"op\"><span class=\"who\">YC</span> — el diseño se vuelve habilidad central de producto con IA</h3>\n<p>Los videos de YC sobre diseñar con IA, dot plots y el problema del lienzo en blanco sostuvieron que producto de IA no es solo selección de modelo. Los equipos necesitan ver qué hacen realmente los usuarios, convertir pantallas vacías en comienzos guiados y usar IA como colaborador de diseño sin perder gusto. La entrevista sobre el cofundador de IA de Gusto apunta a que el lienzo en blanco frena adopción porque el usuario no sabe qué pedir ni por dónde empezar. La visión de YC es pragmática: puede ganar el producto que reduce incertidumbre en la interfaz, no el que anuncia el modelo más potente.</p>\n<h3 class=\"op\"><span class=\"who\">Fireship</span> — las semanas de lanzamiento necesitan escepticismo y compresión</h3>\n<p>El primer vistazo de Fireship a GPT-5.6 y su video sobre conciencia de Claude aportaron escepticismo comprimido a una semana ruidosa. La idea útil es editorial: desarrolladores necesitan filtros rápidos para separar cambios relevantes de branding, drama antropomórfico y teatro de guerras de modelos. Con GPT-5.6, Grok 4.5, Muse Spark 1.1, AlphaEvolve, herramientas de reflexión de Claude y varias superficies agente, comprimir tiene valor. Pero el escepticismo funciona en ambos sentidos: descartar todo lanzamiento como hype hace perder la acumulación de infraestructura. La mejor lectura es usar videos de lanzamiento como triage y luego probar pocas herramientas capaces de cambiar el trabajo diario.</p>",
                "sources": "<h3>Videos · transcripciones de YouTube (últimos 7 días)</h3>\n<ul>\n  <li><a href=\"https://www.youtube.com/watch?v=PHL1j2ti420\">All-In — OpenAI vs Anthropic IPOs, Anthropic $3T, Zuck price war</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=Y7p4rUCdqi0\">All-In — Open Source Wins, AGI Is Here, Cerebras and Black Forest Labs</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=LvsQR7Vc4fQ\">Greg Isenberg — Grok 4.5 is a bigger deal than Fable 5</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=6qLoYDZJpdk\">Greg Isenberg — Screensharing top takes in AI/startups</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=7pVTQSA4s5I\">Greg Isenberg — GPT 5.6 Sol is here</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=Mxs4erDxOEE\">a16z — Software in the Age of Agents</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=jlZfuNoBBCY\">Tech With Tim — AI app to analyze business data</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=uuUo7gWuH9w\">Tech With Tim — Claude Code plugins</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=dLaIl6LehsU\">Riley Brown — Grok 4.5 + Cursor</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=COh_cjrDOzc\">Riley Brown — Claude Fable 5 built my website</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=1njjOIiA8Kc\">Per Simmons — GPT 5.6 and Fable 5 build the same app</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=rdqgMNjvhMY\">Per Simmons — GPT 5.6 Sol no-hype review</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=HhWwllcbc2g\">Per Simmons — Claude Fable 5 agent harness</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=xpTvJvxNYJw\">Fellyph Cintra — Web Agêntica and WebMCP</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=URKml8lgw8Y\">Fireship — GPT 5.6 Sol first look</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=KGtko3y2RXQ\">Fireship — Claude is not conscious</a></li>\n  <li><a href=\"https:/ el-outranks-competitors\">Superhuman — Meta image model</a></li>\n  <li><a href=\"https://futuretools.io/news\">FutureTools — AI News</a></li>\n  <li><a href=\"https://futuretools.io/news/why-everyone-should-have-a-local-ai-model-even-if-you-love-chatgpt\">FutureTools — Local AI model</a></li>\n  <li><a href=\"https://tldr.tech/ai/2026-07-09\">TLDR AI — Grok 4.5, GPT-Live, SWE-1.7</a></li>\n  <li><a href=\"https://tldr.tech/ai/2026-07-08\">TLDR AI — GPT-5.6 Thursday</a></li>\n  <li><a href=\"https://tldr.tech/ai/2026-07-07\">TLDR AI — J-space research</a></li>\n</ul>\n<h3>Perfiles de X / Twitter</h3>\n<ul>\n  <li><a href=\"https://x.com/levie/status/2076116544980214164\">Aaron Levie — AI and software demand</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2075436860344594838\">Riley Brown — agent-native software</a></li>\n  <li><a href=\"https://x.com/simonw/status/2075996740717871125\">Simon Willison — AI employees metaphor</a></li>\n  <li><a href=\"https://x.com/swyx/status/2074344727202463832\">swyx — J-space interpretation</a></li>\n  <li><a href=\"https://x.com/natolambert/status/2075953907704967331\">Nathan Lambert — transparency and open source</a></li>\n  <li><a href=\"https://x.com/rowancheung/status/2075634108324089943\">Rowan Cheung — Muse Spark 1.1 pricing frame</a></li>\n</ul>\n<p class=\"footnote\">TranscriptAPI devolvió 34 videos en ventana con transcripción; un duplicado de Greg Isenberg no tuvo transcripción y Argonalyst devolvió 408 transitorio, por eso no se resumieron. Las páginas de OpenAI dieron 403 con fetch normal; se usaron descripciones RSS para esos hechos, mientras Anthropic, Google, Meta, xAI y boletines se consultaron directamente. hermes-ai.net no mostró noticia visible dentro de la ventana.</p>"

                "headline": "Agentes saíram dos lançamentos e entraram nos fluxos de trabalho",
                "dek": "GPT-5.6 entrou no Microsoft 365, ChatGPT Work e GPT-Live ampliaram as superfícies da OpenAI, a Anthropic levou Claude para reflexão e IA física, e builders perguntaram quais fluxos agentes são confiáveis.",
                "byline": "Uma síntese semanal de onze canais do YouTube, quatro redações, quatro sites/newsletters semanais de IA e perfis selecionados no X. Edição estruturada: 5 notícias de produto, 4 notícias econômicas e 10 opiniões de fontes únicas, com 19 vídeos respaldados por transcrição. Tempo de leitura ~25 min.",
                "body": "<div class=\"part\"><p class=\"kicker\">Parte I</p><p class=\"part-name\">Recursos e ferramentas — o que realmente saiu<span class=\"label-fact\">fatos</span></p></div>\n<h2><span class=\"num\">1.</span> A OpenAI transformou GPT-5.6 em linha de produto, agente de desktop, voz e padrão da Microsoft</h2>\n<p class=\"first\">O RSS da OpenAI fez de 9 de julho o dia de produto mais denso da semana. <strong>GPT-5.6</strong> apareceu como inteligência frontier com mais inteligência por token, melhor desempenho por dólar e mais capacidade sob demanda para trabalhos difíceis. A mesma fonte diz que <strong>Microsoft 365 Copilot</strong> adotou GPT-5.6 como modelo preferido em Word, Excel, PowerPoint, Chat e Cowork, levando o lançamento direto a fluxos de escritório, não apenas a uma história de API ou benchmark. A OpenAI também anunciou <strong>ChatGPT Work</strong>, agente capaz de agir entre aplicativos e arquivos, puxar contexto de material local, acompanhar um projeto por horas e converter um objetivo em trabalho finalizado. A Superhuman acrescentou o pacote visível: novo aplicativo de desktop reunindo ChatGPT, Work e Codex, gratuito em todos os planos, enquanto Work chega como superfície agente para computador e telefone.</p>\n<p>O segundo fio da OpenAI foi multimodal e operacional. <strong>GPT-Live</strong>, anunciado em 8 de julho, é uma nova geração de modelos de voz para interação natural e já alimenta ChatGPT Voice; a Superhuman descreveu a mudança como escutar e falar ao mesmo tempo, detalhe importante porque assistentes de voz falham quando a conversa parece ditado em turnos. Os outros anúncios completaram as bordas do lançamento: Bio Bug Bounty para GPT-5.5, política de parcerias de segurança nacional, crítica a avaliações ruidosas de programação em SWE-Bench Pro, jornadas de habilidades de IA para professores K–12 com Walton Family Foundation e casos corporativos com Deutsche Telekom, MUFG e Australian Payments Plus. O padrão factual é claro: modelo, Microsoft, desktop agente, voz e governança chegaram na mesma janela.</p>\n<h2><span class=\"num\">2.</span> A Anthropic lançou reflexão, implantações de IA física e perguntas públicas ao redor do Claude</h2>\n<p>A semana da Anthropic falou menos de um nome de modelo e mais de como Claude é usado depois da adoção. Em 9 de julho, a empresa apresentou em beta uma forma de <strong>refletir e aprimorar o uso do Claude</strong>. O anúncio diz que entrevistas com usuários revelaram desejo de entender exatamente como usam o assistente, onde ele ajuda e como melhorar a prática. Isso transforma análise de uso em ciclo de aprendizado: observar padrões em vez de tratar cada chat como descartável. No mesmo dia, a Anthropic publicou “Inviting hard questions”, pediu ao público perguntas difíceis sobre IA e prometeu mostrar seu trabalho ao respondê-las. Os exemplos incluíram quem decide regras, se IA pode dar futuro melhor às crianças, se torna o mundo mais perigoso e se pode ajudar a curar doenças.</p>\n<p>As implantações foram concretas. A UST leva Claude para IA física: a Anthropic enquadra o problema no mundo anterior à fabricação, em que validação de chips, falhas de fábrica e defeitos de produto ficam caros quando aparecem tarde. A FutureTools resumiu que a UST implanta Claude para <strong>20.000 engenheiros</strong> em validação de chips e fluxos de IA física. O caso do Governo de Alberta diz que desde 2025 usa Claude Code com modelos Opus e Sonnet para achar e corrigir vulnerabilidades de cibersegurança em sistemas governamentais. A Anthropic também nomeou o ex-presidente do Federal Reserve <strong>Ben Bernanke</strong> para seu Long-Term Benefit Trust, corpo independente pensado para sustentar a missão de benefício público. Claude se moveu de chat para auditoria, engenharia, segurança, prestação pública e governança.</p>\n<h2><span class=\"num\">3.</span> Google, Meta, xAI e Microsoft empurraram modelos especializados para agentes, mídia e otimização de código</h2>\n<p>Fora dos dois incumbentes frontier, as fontes semanais mostraram uma onda ampla de lançamentos. A FutureTools apontou a disponibilidade geral do <strong>AlphaEvolve</strong> no Google Cloud: um agente de otimização de código do Google agora disponível para todos pelo Google Cloud. Seu valor não é outra interface de conversa; ele ataca um problema de produção estreito, encontrando melhorias algorítmicas e de código que podem ser avaliadas, testadas e implantadas. A TLDR de 8 de julho também sinalizou “Gemini API agents”, colocando a semana do Google no mesmo trilho de infraestrutura agente de OpenAI Work e Claude Cowork. Nesse contexto, AlphaEvolve é o item mais concreto porque converte trabalho de modelos em saída de otimizador para times de engenharia.</p>\n<p>A Meta apresentou <strong>Muse Spark 1.1</strong> em 9 de julho por uma nova API. O artigo original da Meta o chama de modelo de raciocínio multimodal da Meta Superintelligence Labs e diz que a atualização traz grandes ganhos em uso de ferramentas, uso de computador, programação e tarefas multimodais. A Superhuman enquadrou o trabalho de imagem da Meta como superior aos principais modelos de Google e Microsoft e capaz de levar criação de imagens para Instagram e WhatsApp. A xAI lançou <strong>Grok 4.5</strong> em 8 de julho; sua página o descreve como o modelo mais inteligente da empresa para programação, trabalho agente e conhecimento, com superfícies em Grok, empresas, governo e desenvolvedores. A Microsoft AI mostrou o extremo oposto com Ode: modelos de áudio para artefatos culturais expressivos, junto com menu próprio de raciocínio, código e imagem.</p>\n<h2><span class=\"num\">4.</span> Superfícies agentes saíram de demos para tarefas agendadas, navegadores, celulares e desenho visível</h2>\n<p>A história de agentes não foi só novos modelos; foi onde o trabalho vive. O ensaio da Simple AI de 10 de julho sustentou que tarefas agendadas de IA são a diferença entre ferramenta e colega. Ele deu caminhos práticos para agendar tarefas em ChatGPT e Claude, lembrou que ambas são funções pagas e colocou a assinatura relevante perto de <strong>20 dólares por mês</strong>. O ponto operacional é simples: quando um prompt ajuda de modo confiável, agendá-lo transforma o assistente em fluxo recorrente. O texto “Fan Out” de 7 de julho adicionou a tática complementar: pedir várias versões em paralelo em vez de iterar uma só resposta. Para design, texto, pesquisa e produto, é um primitivo porque usa geração barata para aumentar a qualidade das opções.</p>\n<p>Os vídeos monitorados mostraram a mesma migração na prática. Riley Brown testou Grok 4.5 dentro do Cursor e construiu com Claude Fable 5; Per Simmons comparou GPT-5.6 e Fable 5 no mesmo aplicativo, revisou GPT-5.6 sem hype e criou um arnês agente; Tech With Tim focou em plugins de Claude Code, Pyright, bloqueio por modelo, revisão de código e análise de negócio sem código; Fellyph Cintra entrevistou em português sobre web agêntica e WebMCP; YC publicou lições de design e analítica para produtos de IA, incluindo desenhar com IA, dot plots de comportamento e o problema da tela em branco. Claude Cowork na web e no celular cabe na mesma categoria: o assistente precisa entregar trabalho entre dispositivos, não só responder dentro de um chat.</p>\n<h2><span class=\"num\">5.</span> Benchmarks de programação e modelos locais viraram infraestrutura de confiança</h2>\n<p>“Separating signal from noise in coding evaluations”, da OpenAI, foi um corretivo útil na febre de lançamentos. O RSS diz que a OpenAI encontrou problemas no <strong>SWE-Bench Pro</strong>, benchmark popular de programação, e alertou sobre confiabilidade e precisão ao avaliar modelos. Isso importa porque quase todo lançamento promete força em código, mas a adoção depende de as provas preverem pull requests, depuração e manutenção reais. Simon Willison ecoou no X a confusão prática: GPT-5.6 chega com vários modelos e esforços de raciocínio, então escolher modelo virou decisão de trabalho. O resultado factual é que avaliação agora faz parte da qualidade do produto; um modelo pode ser poderoso e ainda mal medido para o fluxo exato que compradores valorizam.</p>\n<p>O editorial da FutureTools “Why Everyone Should Have a Local AI Model (Even If You Love ChatGPT)” capturou o segundo tema de confiança. Modelos locais dão privacidade, continuidade offline, controle de custo e resiliência quando agentes em nuvem mudam preços ou políticas. As postagens de Aaron Levie fizeram a versão empresarial: a maioria dos dados úteis não está na web aberta; vive em organizações, sistemas legados e conhecimento tácito. Se modelos compartilham treino público parecido, a vantagem passa à camada aplicada que conecta contexto privado com segurança. Por isso plugins, Pyright, revisão de código, modelos locais e higiene de benchmark pertencem ao lado dos grandes lançamentos: são encanamento de confiabilidade, não enfeite.</p>\n<div class=\"part\"><p class=\"kicker\">Parte II</p><p class=\"part-name\">Economia — adoção, distribuição e números duros<span class=\"label-fact\">fatos</span></p></div>\n<h2><span class=\"num\">1.</span> A distribuição da Microsoft tornou GPT-5.6 padrão empresarial imediato</h2>\n<p>O RSS da OpenAI de 9 de julho diz que <strong>GPT-5.6 agora é o modelo preferido no Microsoft 365 Copilot</strong>. O significado econômico é distribuição: Word, Excel, PowerPoint, Chat e Cowork já são superfícies colaborativas com orçamento em grandes organizações, então a adoção não exige que cada comprador descubra uma ferramenta isolada. A Microsoft pode empacotar maior qualidade de modelo como ganho produtivo dentro de assentos existentes. Para a OpenAI, é uma rota de capacidade de modelo para uso empresarial recorrente; para a Microsoft, mantém Copilot diferenciado quando clientes comparam agentes de ChatGPT, Claude, Gemini e Grok. O item não publicou preço novo, portanto o fato sustentado é posicionamento, não receita. Isso também muda o comportamento de compra: se o modelo já aparece como padrão em superfícies familiares do Office, equipes piloto podem comparar qualidade, latência e governança sem abrir uma compra separada para cada experimento. A distribuição vira recurso do produto, pois controles administrativos, permissões de documentos e hábitos colaborativos existentes reduzem o atrito entre lançamento frontier e uso empresarial mensurável.</p>\n<h2><span class=\"num\">2.</span> Casos empresariais venderam a mesma mudança operacional em telecom, bancos e pagamentos</h2>\n<p>A OpenAI publicou três casos empresariais na janela. A Deutsche Telekom está “recabeando” telecomunicações com IA: atendimento ao cliente, fluxos de funcionários, operações de rede e futuro da voz. MUFG quer se tornar AI-native com ChatGPT Enterprise e novos serviços financeiros com IA. Australian Payments Plus usa ChatGPT Enterprise e Codex para avançar na complexidade de pagamentos mantendo julgamento humano. Nenhum desses posts, pelo RSS disponível, divulgou valor de contrato; o fato duro é amplitude setorial. Fornecedores vendem não só acesso a modelo, mas mudança de modo operacional em setores regulados, onde velocidade, qualidade, risco e contexto de domínio pesam mais que novidade.</p>\n<h2><span class=\"num\">3.</span> O Claude para 20.000 engenheiros da UST precificou IA como alavanca antes da manufatura</h2>\n<p>A UST trouxe o número de adoção mais limpo da semana. A FutureTools resumiu o caso da Anthropic como implantação de Claude para <strong>20.000 engenheiros</strong> em validação de chips e fluxos de IA física. O enquadramento original explica por que importa: erros antes de uma fábrica produzir milhões de chips, ou antes de um produto sair, podem virar falhas caríssimas. Claude é posicionado como alavanca na validação, onde raciocínio de software encontra produção física. É um centro de orçamento diferente do chat produtivo. Compete por dólares de engenharia, qualidade e pré-produção prometendo detecção mais cedo, revisão mais rápida e coordenação em sistemas técnicos complexos.</p>\n<h2><span class=\"num\">4.</span> Funções pagas de agentes e primeiro modelo pago da Meta deslocaram atenção para margem</h2>\n<p>A Simple AI observou explicitamente que tarefas agendadas em ChatGPT e Claude são funções pagas e estimou a assinatura relevante em cerca de <strong>20 dólares por mês</strong>. A Superhuman de 10 de julho disse que a Meta estreou seu primeiro modelo pago, <strong>Muse Spark 1.1</strong>, por uma nova API, giro em relação a postura só de pesos abertos. A TLDR também relatou Apple e Broadcom estendendo parceria de chips customizados até <strong>2031</strong>, mostrando que economia de IA inclui compromissos longos de computação, não apenas assinaturas de apps. O fio comum é disciplina de monetização: agentes precisam de assentos recorrentes, modelos multimodais precisam de preço de API, e implantação frontier precisa de chips garantidos por anos.</p>\n<div class=\"part\"><p class=\"kicker\">Parte III</p><p class=\"part-name\">Opinião e ideias — argumentos atribuídos, não fatos<span class=\"label-op\">opinião</span></p></div>\n<p>Estas são interpretações de pessoas e publicações monitoradas; são argumentos úteis, não fatos verificados salvo quando citados acima.</p>\n<h3 class=\"op\"><span class=\"who\">Aaron Levie</span> — contexto empresarial é a camada defensável</h3>\n<p>Aaron Levie argumentou que os dados mais valiosos para IA não estão na web pública. Estão dentro de empresas, sistemas legados, permissões, fluxos e saber de funcionários. Sua visão é que modelos frontier continuarão importantes para casos novos, mas a vantagem durável passa para a camada aplicada que protege, recupera e age sobre conteúdo proprietário. Ele também afirmou que vagas de software podem subir quando IA reduz o custo de produzir software, porque custo menor expande demanda por ferramentas internas. É uma tese empresarial otimista: IA não apenas remove trabalho; aumenta a superfície de trabalho que vale automatizar.</p>\n<h3 class=\"op\"><span class=\"who\">Riley Brown</span> — criar software para agentes, não só para humanos</h3>\n<p>Riley Brown defendeu uma tese de produto agent-native. Escreveu que builders devem fazer algo que agentes queiram e previu que alguns dos melhores plugins para Codex, Claude e Cursor serão produtos somente plugin, não aplicativos tradicionais com extensão. Em seus testes de Grok 4.5 e GPT-5.6, o ponto não foi leaderboard abstrato, mas a rapidez com que um modelo cria aplicativos funcionais dentro de Cursor ou Codex. Seu enquadramento de “motores de ação” para ChatGPT, Claude, Grok e Gemini marca a virada da busca para execução: a interface otimizada pode ser o agente que clica, edita, redige e lança.</p>\n<h3 class=\"op\"><span class=\"who\">Simon Willison</span> — “funcionários de IA” é metáfora errada</h3>\n<p>Simon Willison rejeitou o rótulo “AI employees”: chamou de míope, desrespeitoso com humanos e má descrição do que as ferramentas fazem bem. Sua analogia foi que ninguém adiciona planilhas Excel ao organograma. A ideia importa porque linguagem muda gestão: se empresas imaginam agentes como funcionários, podem confiar demais em autonomia, investir pouco em interfaces e ignorar revisão. Willison também notou confusão entre ChatGPT, ChatGPT Codex, ChatGPT Work, Claude, Claude Code e Claude Cowork. Seu alerta prático é que nomes de produto e escolha de modelo viraram carga cognitiva para builders.</p>\n<h3 class=\"op\"><span class=\"who\">swyx</span> — interpretabilidade vira intervenção, não só observação</h3>\n<p>swyx destacou a pesquisa J-space da Anthropic porque ela sugere duas coisas: pesquisadores podem fazer intervenções tipo “cirurgia cerebral” que mudam a direção de raciocínio de um modelo, e o modelo detecta algumas dessas intervenções. Sua leitura é que interpretabilidade mecanicista sai da visualização passiva rumo a controle ativo. Ele também apontou a dificuldade produtiva de usar modelos chineses em laboratórios de agentes que vendem para governo e defesa, com avaliações multilíngues de propaganda e censura. A ideia maior é que sistemas de IA são sociotécnicos: capacidade, interpretabilidade, geopolítica e compras interagem.</p>\n<h3 class=\"op\"><span class=\"who\">Nathan Lambert</span> — transparência sem open source fica incompleta</h3>\n<p>Nathan Lambert reagiu a AI 2040 concordando com o foco em transparência, mas achando estranho quase não discutir open source. O argumento é diferente de um slogan genérico. Ele diz que transparência não pode ser só relatórios, auditorias ou divulgações de laboratórios fechados; inclui se terceiros podem inspecionar, rodar, adaptar e contestar sistemas. Em uma semana em que a Meta introduziu modelo pago por API e a FutureTools defendeu modelos locais, o ponto dele é a versão de governança do argumento local: confiança pública melhora quando mais partes do stack podem ser examinadas e reproduzidas.</p>\n<h3 class=\"op\"><span class=\"who\">Greg Isenberg</span> — lançamento importa quando muda alavancagem de startup</h3>\n<p>Os vídeos transcritos de Greg Isenberg enquadraram Grok 4.5, Fable 5 e GPT-5.6 pelo uso de startups, não por compras corporativas. A pergunta central foi se um lançamento permite que uma equipe minúscula crie produto, ciclo de crescimento ou operador interno que antes exigia mais gente. Por isso o formato de tela compartilhada importa: a opinião é testada em fluxos, não apenas discutida. Para builders, a conclusão é julgar um modelo pelo número de novos experimentos de negócio que ele libera por semana. Um modelo ligeiramente pior em benchmark mas fácil de pôr em Cursor, voz, navegador ou agentes pode valer mais que uma pontuação teórica.</p>\n<h3 class=\"op\"><span class=\"who\">Per Simmons</span> — comparar modelos por comportamento cru, não por hype</h3>\n<p>Per Simmons comparou GPT-5.6 e Fable 5 no mesmo app, revisou GPT-5.6 sem hype e construiu um arnês agente com Fable 5. Seu método editorial é a opinião: usar prompts idênticos, mostrar falhas cruas, inspecionar código e perguntar se o modelo lida com estado, interface, chamadas de ferramentas e casos de borda sem ajuda constante. Isso contraria a semana de lançamentos em que cada laboratório apresenta seu modelo como novo padrão. Para praticantes, o argumento é que um benchmark privado feito de tarefas reais pode ser mais útil que afirmações públicas, principalmente quando escolha de modelo inclui raciocínio, custo e integração agente.</p>\n<h3 class=\"op\"><span class=\"who\">Tech With Tim</span> — programação com IA precisa de guardrails antes da velocidade</h3>\n<p>Os vídeos de Tech With Tim formaram uma lista de verificação: usar Pyright, escolher plugins de Claude Code com cuidado, evitar aprisionamento em um modelo, revisar código gerado e não tratar saída vibe-coded como software terminado. A opinião por baixo é conservadora no melhor sentido. IA acelera implementação, mas velocidade sem tipos, testes, revisão e higiene de segurança vira dívida escondida. Seus alertas curtos sobre apps vazando e ferramentas de scraping seguem a mesma linha: o engenheiro de IA mais útil não é quem prompta mais rápido, mas quem constrói um ciclo de verificação ao redor do código gerado.</p>\n<h3 class=\"op\"><span class=\"who\">YC</span> — design vira habilidade central de produto com IA</h3>\n<p>Os vídeos da YC sobre desenhar com IA, dot plots e o problema da tela em branco defenderam que produto de IA não é só seleção de modelo. Times precisam ver o que usuários realmente fazem, transformar telas vazias em começos guiados e usar IA como colaborador de design sem perder gosto. O tema do cofundador de IA da Gusto, refletido no título monitorado, é que telas em branco travam adoção porque usuários não sabem o que pedir nem por onde começar. A visão da YC é pragmática: pode vencer o produto que reduz incerteza na interface, não o que anuncia o modelo mais poderoso.</p>\n<h3 class=\"op\"><span class=\"who\">Fireship</span> — semanas de lançamento precisam de ceticismo e compressão</h3>\n<p>O primeiro olhar da Fireship para GPT-5.6 e o vídeo sobre consciência de Claude trouxeram ceticismo comprimido a uma semana ruidosa. A ideia útil é editorial: desenvolvedores precisam de filtros rápidos para separar mudanças relevantes de branding, drama antropomórfico e teatro de guerra de modelos. Com GPT-5.6, Grok 4.5, Muse Spark 1.1, AlphaEvolve, ferramentas de reflexão de Claude e várias superfícies agentes, compressão tem valor. Mas o ceticismo corta para os dois lados: descartar todo lançamento como hype perde a mudança cumulativa de infraestrutura. A melhor leitura é usar vídeos de lançamento como triagem e testar poucas ferramentas capazes de mudar o trabalho diário.</p>",
                "sources": "<h3>Vídeos · transcrições do YouTube (últimos 7 dias)</h3>\n<ul>\n  <li><a href=\"https://www.youtube.com/watch?v=PHL1j2ti420\">All-In — OpenAI vs Anthropic IPOs, Anthropic $3T, Zuck price war</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=Y7p4rUCdqi0\">All-In — Open Source Wins, AGI Is Here, Cerebras and Black Forest Labs</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=LvsQR7Vc4fQ\">Greg Isenberg — Grok 4.5 is a bigger deal than Fable 5</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=6qLoYDZJpdk\">Greg Isenberg — Screensharing top takes in AI/startups</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=7pVTQSA4s5I\">Greg Isenberg — GPT 5.6 Sol is here</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=Mxs4erDxOEE\">a16z — Software in the Age of Agents</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=jlZfuNoBBCY\">Tech With Tim — AI app to analyze business data</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=uuUo7gWuH9w\">Tech With Tim — Claude Code plugins</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=dLaIl6LehsU\">Riley Brown — Grok 4.5 + Cursor</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=COh_cjrDOzc\">Riley Brown — Claude Fable 5 built my website</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=1njjOIiA8Kc\">Per Simmons — GPT 5.6 and Fable 5 build the same app</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=rdqgMNjvhMY\">Per Simmons — GPT 5.6 Sol no-hype review</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=HhWwllcbc2g\">Per Simmons — Claude Fable 5 agent harness</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=xpTvJvxNYJw\">Fellyph Cintra — Web Agêntica and WebMCP</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=URKml8lgw8Y\">Fireship — GPT 5.6 Sol first look</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=KGtko3y2RXQ\">Fireship — Claude is not conscious</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=VbqaL_eHhKY\">YC — Design with AI</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=e5-6rEwzxLs\">YC — Dot Plots</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=xpeRVyFFy_Q\">YC — Blank Canvas Problem</a></li>\n</ul>\n<h3>Redações</h3>\n<ul>\n  <li><a href=\"https://openai.com/index/gpt-5-6\">OpenAI — GPT-5.6</a></li>\n  <li><a href=\"https://openai.com/index/chatgpt-for-your-most-ambitious-work\">OpenAI — ChatGPT Work</a></li>\n  <li><a href=\"https://openai.com/index/introducing-gpt-live\">OpenAI — GPT-Live</a></li>\n  <li><a href=\"https://openai.com/index/gpt-5-6-preferred-model-microsoft-365-copilot\">OpenAI — GPT-5.6 in Microsoft 365 Copilot</a></li>\n  <li><a href=\"https://www.anthropic.com/news/reflect-with-claude\">Anthropic — Reflect with Claude</a></li>\n  <li><a href=\"https://www.anthropic.com/news/ust-claude\">Anthropic — UST brings Claude to physical AI</a></li>\n  <li><a href=\"https://www.anthropic.com/news/hard-questions\">Anthropic — Inviting hard questions</a></li>\n  <li><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/alphaevolve-is-available-for-everyone\">Google Cloud — AlphaEvolve availability</a></li>\n  <li><a href=\"https://ai.meta.com/blog/introducing-muse-spark-meta-model-api/\">Meta — Muse Spark 1.1</a></li>\n  <li><a href=\"https://x.ai/news/grok-4-5\">xAI — Grok 4.5</a></li>\n</ul>\n<h3>Sites/newsletters semanais de IA</h3>\n<ul>\n  <li><a href=\"https://simple.ai/p/automate-more-work-with-scheduled-ai-tasks\">Simple AI — Scheduled AI tasks</a></li>\n  <li><a href=\"https://simple.ai/p/fan-out-the-ai-tactic-that-still-works\">Simple AI — Fan Out</a></li>\n  <li><a href=\"https://www.superhuman.ai/p/openai-launches-chatgpt-work-a-new-desktop-agent\">Superhuman — ChatGPT Work desktop agent</a></li>\n  <li><a href=\"https://www.superhuman.ai/p/the-model-wars-are-raging-on\">Superhuman — Model wars</a></li>\n  <li><a href=\"https://www.superhuman.ai/p/meta-s-new-image-model-outranks-competitors\">Superhuman — Meta image model</a></li>\n  <li><a href=\"https://futuretools.io/news\">FutureTools — AI News</a></li>\n  <li><a href=\"https://futuretools.io/news/why-everyone-should-have-a-local-ai-model-even-if-you-love-chatgpt\">FutureTools — Local AI model</a></li>\n  <li><a href=\"https://tldr.tech/ai/2026-07-09\">TLDR AI — Grok 4.5, GPT-Live, SWE-1.7</a></li>\n  <li><a href=\"https://tldr.tech/ai/2026-07-08\">TLDR AI — GPT-5.6 Thursday</a></li>\n  <li><a href=\"https://tldr.tech/ai/2026-07-07\">TLDR AI — J-space research</a></li>\n</ul>\n<h3>Perfis de X / Twitter</h3>\n<ul>\n  <li><a href=\"https://x.com/levie/status/2076116544980214164\">Aaron Levie — AI and software demand</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2075436860344594838\">Riley Brown — agent-native software</a></li>\n  <li><a href=\"https://x.com/simonw/status/2075996740717871125\">Simon Willison — AI employees metaphor</a></li>\n  <li><a href=\"https://x.com/swyx/status/2074344727202463832\">swyx — J-space interpretation</a></li>\n  <li><a href=\"https://x.com/natolambert/status/2075953907704967331\">Nathan Lambert — transparency and open source</a></li>\n  <li><a href=\"https://x.com/rowancheung/status/2075634108324089943\">Rowan Cheung — Muse Spark 1.1 pricing frame</a></li>\n</ul>\n<p class=\"footnote\">TranscriptAPI retornou 34 vídeos da janela com transcrição; uma duplicata de Greg Isenberg não tinha transcrição e Argonalyst retornou 408 transitório, portanto não foram resumidos. Páginas da OpenAI deram 403 por fetch normal; foram usadas descrições RSS para fatos da OpenAI, enquanto Anthropic, Google, Meta, xAI e newsletters foram buscados diretamente. hermes-ai.net não mostrou notícia visível dentro da janela.</p>"
