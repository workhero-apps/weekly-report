{
  "date": "2026-06-09",
  "label": {
    "en": "June 9, 2026",
    "pt": "9 de junho de 2026"
  },
  "en": {
    "eyebrow": "Week of June 3–9, 2026",
    "headline": "Agents Become Products, Platforms and Budgets",
    "dek": "The week’s signal was bigger than model demos: Codex Sites turned agents into shareable internal apps, Claude Fable 5 pushed long-horizon work into the product tier, and the conversation shifted to routing, pricing, review loops and capital markets.",
    "byline": "A weekly synthesis of six YouTube channels, four newsrooms, and selected X profiles. Reading time ~18 min.",
    "body": "\n<div class=\"part\"><p class=\"kicker\">Part I</p><p class=\"part-name\">Features &amp; tools — what actually shipped<span class=\"label-fact\">facts</span></p></div>\n<h2><span class=\"num\">1.</span> OpenAI turns Codex into a workspace app platform, not just a coding agent</h2>\n<p class=\"first\">The biggest missing piece in the first June 9 draft was Codex. OpenAI’s concrete Codex release was broader than “agents for developers”: Codex now has role-specific plugins, Sites, and annotations aimed at analysts, marketers, operators, designers, researchers, investors and bankers as well as engineers. OpenAI says <strong>more than 5 million people use Codex every week</strong>, and that non-developers are already <strong>about 20%</strong> of overall Codex users while growing <strong>more than 3x as fast</strong> as developers.</p>\n<p>The plugin layer is the distribution move. OpenAI launched <strong>six role-specific plugins</strong> — data analytics, creative production, sales, product design, public-equity investing and investment banking — bundling <strong>62 popular apps</strong> and <strong>110 skills</strong>. The data plugin connects workflows around tools such as Snowflake, Databricks Genie, Hex and Tableau; the creative plugin names Figma, Canva, Shutterstock, Picsart and Fal; the sales plugin names Salesforce, HubSpot, Slack, Outreach, Clay, Rox and Actively; the investing and banking plugins point toward data rooms, market data and diligence workflows.</p>\n<p><strong>Sites</strong> is the more important product primitive. OpenAI describes it as a way for Codex to create and share interactive, hosted websites and apps through a URL. In practice, that means dashboards, planners, review workspaces, project boards, galleries and lightweight internal tools can be generated inside Codex and shared with a workspace instead of exported as a static deck or spreadsheet. OpenAI’s examples include a customer-review site with product updates, open questions and usage trends; a financial-model scenario planner; and a launch hub with messaging, milestones, owners and decisions.</p>\n<p>The developer documentation adds operational detail. The <strong>Sites plugin</strong> can create, save, deploy and inspect websites, web apps and games hosted by OpenAI. Every deployment URL is a <strong>production deployment</strong>, so OpenAI recommends saving a version first when review is needed. The workflow has two stages: <strong>save a version</strong>, where Codex builds a deployable candidate tied to the source Git commit, and <strong>deploy a version</strong>, where that candidate becomes live. Sites is in preview for <strong>ChatGPT Business and Enterprise</strong>; Business workspaces have it enabled by default, while Enterprise admins use RBAC. Sites also supports durable application data and uploaded files, with project metadata such as <code>.openai/hosting.json</code> and storage bindings for <strong>D1</strong> and <strong>R2</strong>.</p>\n<h2><span class=\"num\">2.</span> Codex gets an editing loop: annotations, partner sites and the Convex question</h2>\n<p>OpenAI’s annotations feature is the post-first-draft loop. Instead of asking Codex to regenerate a whole page, slide or document, users can point to a specific part — a navigation bar, a chart label, a claim in an investment thesis — and ask for a targeted change or source check. This matters because the first useful agent output is rarely the final artifact; the bottleneck moves to review, taste and iteration.</p>\n<p>The Sites ecosystem also started to look like a distribution surface. OpenAI named early partners including <strong>Vercel, Wix, Base44, Replit, Lovable, Figma, Webflow and Emergent</strong>. The week’s creator discussion then focused on the practical next question: whether Sites can connect to real backend primitives such as <strong>Convex</strong>, persistent data and app workflows rather than staying a polished demo canvas. That is why Codex Sites belongs in the report: it is the bridge between agent-written code and shareable internal software.</p>\n<h2><span class=\"num\">3.</span> Anthropic launches Claude Fable 5 and Mythos 5 — same model family, different safeguards</h2>\n<p>Anthropic’s June 9 launch changed the top of the model stack. <strong>Claude Fable 5</strong> is described as a <strong>Mythos-class</strong> model made safe for general use, with capabilities Anthropic says exceed any model it has previously made generally available. <strong>Claude Mythos 5</strong> is the same underlying model with some safeguards lifted for a small group of vetted cyberdefenders and infrastructure providers through Project Glasswing, with a broader trusted-access program planned.</p>\n<p>The safety design is the product story. Anthropic says Fable 5 routes some cybersecurity, biology and chemistry requests to <strong>Claude Opus 4.8</strong> instead of answering with the Mythos-level model. Those conservative safeguards trigger in <strong>less than 5% of sessions on average</strong>, but Anthropic warns they can catch harmless requests. Mythos 5 access is more restricted, and using it requires a <strong>30-day data-retention policy</strong> for safety monitoring.</p>\n<p>Availability and pricing are unusually explicit. Fable 5 is available via <code>claude-fable-5</code> in the Claude API, on consumption-based Enterprise plans, and through marketplaces including AWS, Google Cloud and Microsoft Foundry. Pricing is <strong>$10 per million input tokens</strong> and <strong>$50 per million output tokens</strong>, with the existing <strong>90% prompt-caching input discount</strong>. US-only inference costs <strong>1.1x</strong>. On subscription plans, Anthropic is including Fable 5 on Pro, Max, Team and seat-based Enterprise at no extra cost through <strong>June 22</strong>, then moving usage after <strong>June 23</strong> to credits unless capacity allows an extension.</p>\n<h2><span class=\"num\">4.</span> Fable 5’s claimed gains are long-horizon work, coding, vision and memory</h2>\n<p>Anthropic’s customer examples point to long-running autonomy rather than short benchmark wins. Stripe reportedly used Fable 5 in a <strong>50-million-line Ruby codebase</strong> to perform a codebase-wide migration in <strong>one day</strong> that Anthropic says would otherwise have taken a whole team <strong>over two months</strong> by hand. Anthropic also says Fable 5 scored highest among frontier models on Cognition’s <strong>FrontierCode</strong> evaluation even at medium effort, and that it is more token-efficient than prior Claude models.</p>\n<p>For knowledge work, Anthropic cites Hebbia’s senior-level finance benchmark and IMC trading-analysis evaluations. For vision, the memorable example is that Fable 5 completed <strong>Pokémon FireRed</strong> with a minimal vision-only harness, while earlier Claude models needed more elaborate helper tooling. For long context, Anthropic says Fable 5 can stay focused across <strong>millions of tokens</strong> in long-running tasks and improve outputs over time. The important pattern: the model is being sold as a worker that can persist, check itself, and use vision — not only as a chat model with a better answer.</p>\n<h2><span class=\"num\">5.</span> Google ships infrastructure around Gemini: speech, Apple APIs, NotebookLM, Gemma and Kaggle</h2>\n<p>Google’s week was not one release; it was a stack. <strong>Gemini 3.5 Live Translate</strong> is a streaming speech-to-speech model that detects <strong>70+ languages</strong>, preserves intonation, pacing and pitch, and runs a few seconds behind the speaker. It is in public preview for developers through the Gemini Live API and Google AI Studio, in private preview for enterprises in Google Meet this month, and rolling out through Google Translate on Android and iOS.</p>\n<p>For Apple developers, Google said Gemini can be called through Apple’s Foundation Models framework using the Firebase Apple SDK. Starting with <strong>iOS 27, macOS 27, iPadOS 27, visionOS 27 and watchOS 27</strong>, Apple’s public <code>LanguageModel</code> protocol can route to cloud-hosted Gemini behind the same surface used for local Apple models. That turns model choice into routing: local inference when latency and privacy matter, cloud Gemini when the task needs heavier reasoning or agentic capacity.</p>\n<p>NotebookLM moved further toward an agentic research environment. Google says the upgraded system runs on <strong>Gemini 3.5 and Antigravity</strong>, gives each notebook a secure cloud computer, and includes <strong>100+ curated software skills</strong> for code execution and deeper analysis. Google says the new NotebookLM won by an average of <strong>over 65%</strong> across its top five evaluation dimensions, including <strong>69.9%</strong> in large-document analysis and <strong>78.2%</strong> in advanced web research and source discovery. On the open-model side, <strong>Gemma 4</strong> QAT checkpoints include formats that bring <strong>Gemma 4 E2B to a 1GB memory footprint</strong>, and Kaggle added local development after its Benchmarks community produced <strong>10,000+ evaluation tasks</strong>.</p>\n<h2><span class=\"num\">6.</span> OpenAI’s other week: S-1, memory, Rosalind, biodefense and edge runtime work</h2>\n<p>OpenAI’s June 3–9 feed also included a confidential draft <strong>S-1</strong> submission to the SEC, the <strong>OpenAI Economic Research Exchange</strong>, a <strong>Dreaming</strong> memory system for ChatGPT, an AI-powered biodefense plan, new biological reasoning and lab-workflow capabilities for <strong>GPT-Rosalind</strong>, and policy documents on public governance of frontier AI. The article bodies were partially gated in this environment, so the report uses official feed/page descriptions rather than unsupported details.</p>\n<p>The most concrete developer case study was Wasmer: OpenAI says Wasmer used <strong>Codex with GPT-5.5</strong> to build a Node.js runtime for the edge, accelerating development <strong>10x to 20x</strong> and shipping in weeks rather than months. Together with Sites, annotations and role plugins, the pattern is clear: Codex is being pushed from “AI pair programmer” into “agentic operating layer for work artifacts.”</p>\n<h2><span class=\"num\">7.</span> Anthropic’s services channel and cyber report show commercialization and risk management moving together</h2>\n<p>Anthropic expanded the Claude Partner Network with a Services Track and Partner Hub, backed by a <strong>$100 million</strong> investment in partner training, technical support and shared marketing. Anthropic says <strong>40,000+</strong> firms have applied to join and <strong>10,000+</strong> consultants have earned a Claude certification. Named rollouts include Accenture training <strong>30,000</strong> professionals, Cognizant rolling Claude out to roughly <strong>350,000</strong> associates, Deloitte making it available to <strong>470,000</strong> people and KPMG integrating Claude across more than <strong>276,000</strong> workers.</p>\n<p>Its cyber report examined <strong>832</strong> banned accounts associated with malicious cyber activity from March 2025 through March 2026 and mapped them to MITRE ATT&amp;CK. Malware writing appeared in <strong>560 of 832 accounts</strong>, or <strong>67.3%</strong>; <strong>54 accounts</strong>, or <strong>6.5%</strong>, used AI to assist with lateral movement. Anthropic’s risk scoring put <strong>33%</strong> of actors at medium risk or higher in the first six months and <strong>56%</strong> in the second six months. It also argued that MITRE ATT&amp;CK lacks a category for agentic orchestration, citing a November 2025 state-sponsored operation using <strong>30 techniques across 13 tactics</strong>.</p>\n<div class=\"part\"><p class=\"kicker\">Part II</p><p class=\"part-name\">Economics — hard numbers only<span class=\"label-fact\">facts</span></p></div>\n<h2><span class=\"num\">8.</span> The hard numbers: Codex usage, Fable pricing, partner budgets, IPO signals and AI spend</h2>\n<p>OpenAI disclosed <strong>5 million+</strong> weekly Codex users, with non-developers at <strong>about 20%</strong> of the base and growing <strong>more than 3x</strong> as fast as developers. It also disclosed six role plugins spanning <strong>62 apps</strong> and <strong>110 skills</strong>. Anthropic priced Fable 5 and Mythos 5 at <strong>$10 per million input tokens</strong> and <strong>$50 per million output tokens</strong>, kept a <strong>90%</strong> prompt-caching input discount, set US-only inference at <strong>1.1x</strong>, and offered temporary subscription-plan access through <strong>June 22</strong>.</p>\n<p>Anthropic’s partner program added a <strong>$100 million</strong> channel-enablement budget, <strong>40,000+</strong> applicant firms and <strong>10,000+</strong> certified consultants. OpenAI confirmed a confidential draft <strong>S-1</strong> submission but did not disclose valuation, revenue, share count or target listing timing. Google’s economic signals were infrastructure-cost signals: Gemma 4 QAT aims at cheaper local inference, Kaggle Benchmarks reached <strong>10,000+</strong> community tasks, and Gemini’s Apple/Firebase route turns model calls into a cloud service available inside native apps.</p>\n<p>The video slate reinforced the same economics even where transcripts were unavailable from this IP: All-In’s June 4 Thomas Laffont episode framed a potential <strong>$4T AI IPO wave</strong>; All-In’s June 7 and June 6 panels focused on secondary markets and IPO reopening; a16z’s Benedict Evans episode was explicitly about AI usage economics and SaaS; and Tech With Tim’s “software development bottleneck moved” title matches the shift from coding to orchestration, review and deployment.</p>\n<div class=\"part\"><p class=\"kicker\">Part III</p><p class=\"part-name\">Opinion &amp; ideas — attributed arguments only<span class=\"label-op\">opinion</span></p></div>\n<p>These are arguments, interpretations and forecasts from named people or clearly titled creator episodes, not settled facts.</p>\n<h3 class=\"op\"><span class=\"who\">Aaron Levie</span> — context, evals and routing become the enterprise moat</h3>\n<p>Levie’s strongest thread this week was that model intelligence does not remove the need for instructions, domain context and proprietary data. He argues that the same general-purpose model will be used by lawyers, engineers, financial analysts and healthcare workers, so useful output still depends on guiding it toward the differentiated task. In a separate thread he says token costs are becoming a major enterprise operating-expense line, which makes model routing and domain-specific evals a core applied-AI differentiator.</p>\n<h3 class=\"op\"><span class=\"who\">Aaron Levie</span> — raw benchmark scores need compute normalization</h3>\n<p>After the Fable 5 launch, Levie argued that apparent model performance increasingly depends on how much inference-time compute is applied. His view is that compute-normalized benchmarks are the logical path forward, but hard to implement because “how much thinking” to spend on a task is subjective and can reverse model rankings at different effort levels.</p>\n<h3 class=\"op\"><span class=\"who\">Riley Brown</span> — Fable/Mythos signals a new Anthropic model class</h3>\n<p>Brown’s immediate reaction to Fable/Mythos was that Anthropic had broken its recent Haiku/Sonnet/Opus naming pattern with a new class of model. He called the model “really really good” after first tests and posted a Cowork experiment that uploaded a McKinsey-style report and asked Fable/Mythos to create a document of similar quality. Treat that as early creator evaluation, not a benchmark.</p>\n<h3 class=\"op\"><span class=\"who\">Riley Brown</span> — agent platforms need reusable skills that repair themselves</h3>\n<p>Brown framed Claude Code and Codex skills as the missing operating layer for personal agents. His key observation: when a skill causes a mistake, Claude can immediately fix the skill, turning a one-off failure into persistent process improvement. That is the same idea behind Codex Sites and annotations: agents become more valuable when their work product is reviewable, editable and reusable.</p>\n<h3 class=\"op\"><span class=\"who\">Riley Brown</span> — Mythos-level apps may be expensive but qualitatively different</h3>\n<p>Brown predicted that Mythos could one-shot almost any full-stack mobile app end to end and submit it to an app store, but warned that if it is <strong>5x more expensive than Opus</strong>, the API cost could be roughly <strong>$120–$400 per app</strong>. The important economic idea is not the exact estimate; it is the trade-off between high-priced frontier inference and replacing many rounds of human prompting, debugging and integration.</p>\n<h3 class=\"op\"><span class=\"who\">Tech With Tim</span> — the software-development bottleneck moved</h3>\n<p>Tech With Tim’s week of videos centered on learning, infrastructure and labor-market bottlenecks: “The Software Development Bottleneck Just Moved,” “Why Companies Won’t Hire Junior Devs And Why It’ll Backfire,” and an AI infrastructure conference recap. Without transcript access here, the report only treats the titles as source signals, but the theme aligns with the week’s facts: code generation is less scarce; product judgment, review, deployment, infrastructure and training pipelines become more scarce.</p>\n<h3 class=\"op\"><span class=\"who\">Greg Isenberg</span> — Codex Sites pushes “AI-native” from prompt to product</h3>\n<p>Greg Isenberg’s Codex and AI-native videos, plus the “Codex Sites is good.. but can it run Convex?” discussion, put practical pressure on Sites: a generated page is useful, but an AI-native internal app needs persistent data, permissions, real backend workflows and a maintenance loop. That is why Convex and similar backends came up: the frontier is not generating UI, it is making generated software operational.</p>\n<h3 class=\"op\"><span class=\"who\">Benedict Evans</span> — SaaS economics are being repriced around usage</h3>\n<p>The a16z episode with Benedict Evans was titled around the economics of AI usage and what comes next for SaaS. Paired with Levie’s token-budget posts and OpenAI’s Codex expansion into non-developer roles, the argument to watch is that software pricing moves away from seat licenses alone and toward usage, outcome, routing and model-mix economics.</p>\n<h3 class=\"op\"><span class=\"who\">All-In guests</span> — the AI capital cycle moved from private liquidity to public markets</h3>\n<p>All-In’s week of finance-heavy episodes — Thomas Laffont on a <strong>$4T AI IPO wave</strong>, panels on secondary markets and IPO reopening, and Bill Maris on AI’s “Atari stage” — framed the market as early rather than mature. Because transcripts were blocked here, the report does not quote them; it records the directional thesis visible from the episode set: AI company formation, secondary liquidity and public-market readiness are becoming one integrated story.</p>\n",
    "sources": "<h3>Videos · YouTube transcripts (last 7 days)</h3>\n<ul>\n  <li><a href=\"https://www.youtube.com/watch?v=0umrMuUClC4\">All-In — Bill Maris: How Google Could Crush AI Competitors, Why Small Funds Win, and AI's Atari Stage</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=hObRMv6qCi0\">All-In — Palo Alto Networks CEO: “AI Found 5 Years of Bugs in 6 Weeks”</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=V0lFjTWx36I\">All-In — Why Secondary Markets Are Eating the IPO</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=jLICvWE7w2Q\">All-In — The IPO Comeback: Why Tech Giants Are Finally Going Public</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=i8OI8CNdZgU\">All-In — Dan Loeb: The Lost Art of Short Selling, and Why Stock Picking is Back</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=UIoV8rG_25s\">All-In — Thomas Laffont: The $4T AI IPO Wave Is Coming</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=_TJFqEhxQg4\">All-In — Bill Ackman: Here's What the Market is MISSING</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=ktl8mNiWqMM\">a16z — The Economics of AI Usage and What's Next For SaaS | Benedict Evans</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=EJSuA6BUFv8\">Tech With Tim — The Software Development Bottleneck Just Moved</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=iTJQV9l5w-c\">Tech With Tim — Why Companies Won't Hire Junior Devs And Why It'll Backfire</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=nu5TH_lyjqg\">Tech With Tim — I Went to the Biggest AI Infrastructure Conference</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=mTYxpIRK7xA\">Tech With Tim — Hermes Agent: Full Course &amp; Setup Guide</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=LztPaNmcWGU\">Greg Isenberg — Become AI Native in less than 60 mins</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=EJm8Ka-gVOc\">Greg Isenberg — Hermes Agent Desktop: Full Setup + Real Use Cases</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=tUeSxXHmE9w\">Greg Isenberg — OpenAI Codex: Build Apps That Work For You 24/7</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=ZvIEVC6dhX8\">Greg Isenberg / Startup Ideas — Codex Sites is good.. but can it run Convex?</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=DbeFq_uoaRs\">Riley Brown — Hermes Agent NEW Super-App and DeepSeek v4</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=j--dqLJxrtE\">Riley Brown — ChatGPT And Codex Are Merging</a></li>\n  <li><a href=\"https://www.youtube.com/@DwarkeshPatel/videos\">Dwarkesh Patel — Alex Imas and Phil Trammell AI-economy clips, June 5–9</a></li>\n</ul>\n<h3>Newsrooms</h3>\n<ul>\n  <li><a href=\"https://openai.com/index/codex-for-every-role-tool-workflow/\">OpenAI — Codex for every role, tool, and workflow</a></li>\n  <li><a href=\"https://developers.openai.com/codex/sites\">OpenAI Developers — Sites for Codex</a></li>\n  <li><a href=\"https://developers.openai.com/showcase/sites\">OpenAI Developers — Sites showcase</a></li>\n  <li><a href=\"https://openai.com/index/openai-submits-confidential-s-1\">OpenAI — Confidential submission of draft S-1 to the SEC</a></li>\n  <li><a href=\"https://openai.com/index/economic-research-exchange\">OpenAI — OpenAI Economic Research Exchange</a></li>\n  <li><a href=\"https://openai.com/index/chatgpt-memory-dreaming\">OpenAI — Dreaming: better memory for ChatGPT</a></li>\n  <li><a href=\"https://openai.com/index/introducing-new-capabilities-to-gpt-rosalind\">OpenAI — New capabilities to GPT-Rosalind</a></li>\n  <li><a href=\"https://openai.com/index/wasmer\">OpenAI — Wasmer used Codex to build a Node.js runtime for the edge</a></li>\n  <li><a href=\"https://www.anthropic.com/news/claude-fable-5-mythos-5\">Anthropic — Claude Fable 5 and Claude Mythos 5</a></li>\n  <li><a href=\"https://www.anthropic.com/claude/fable\">Anthropic — Claude Fable model page</a></li>\n  <li><a href=\"https://www.anthropic.com/claude/mythos\">Anthropic — Claude Mythos model page</a></li>\n  <li><a href=\"https://www.anthropic.com/news/services-track-partner-hub\">Anthropic — Services Track and Partner Hub of the Claude Partner Network</a></li>\n  <li><a href=\"https://www.anthropic.com/news/AI-enabled-cyber-threats-mitre-attack\">Anthropic — Mapping a year of AI-enabled cyber threats to MITRE ATT&amp;CK</a></li>\n  <li><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-live-3-5-translate/\">Google — Gemini 3.5 Live Translate</a></li>\n  <li><a href=\"https://blog.google/innovation-and-ai/technology/developers-tools/bringing-gemini-models-to-apple-developers/\">Google — Gemini models for Apple developers</a></li>\n  <li><a href=\"https://blog.google/innovation-and-ai/products/notebooklm/better-research-notebooklm/\">Google — NotebookLM research upgrades</a></li>\n  <li><a href=\"https://blog.google/innovation-and-ai/technology/developers-tools/quantization-aware-training-gemma-4/\">Google — Gemma 4 QAT checkpoints</a></li>\n  <li><a href=\"https://blog.google/innovation-and-ai/technology/developers-tools/build-kaggle--benchmarks-locally/\">Google — Kaggle Benchmarks local development</a></li>\n  <li><a href=\"https://hermes-ai.net/changelog/\">Hermes Agent — Changelog</a></li>\n</ul>\n<h3>X / Twitter profiles</h3>\n<ul>\n  <li><a href=\"https://x.com/levie/status/2064396746953023647\">Aaron Levie — Fable 5 capability jump and agent work</a></li>\n  <li><a href=\"https://x.com/levie/status/2064379199629181139\">Aaron Levie — compute-normalized benchmarks</a></li>\n  <li><a href=\"https://x.com/levie/status/2064186766907887941\">Aaron Levie — context remains the scarce input for useful AI</a></li>\n  <li><a href=\"https://x.com/levie/status/2063835799096090749\">Aaron Levie — frontier models versus cheaper high-volume model families</a></li>\n  <li><a href=\"https://x.com/levie/status/2063756386572681606\">Aaron Levie — enterprise software is not just code</a></li>\n  <li><a href=\"https://x.com/levie/status/2063320673217609936\">Aaron Levie — token budgets and model routing</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2064395899522998357\">Riley Brown — Anthropic’s new model class</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2064407515752722521\">Riley Brown — first Fable/Mythos test in Cowork</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2064006354772033761\">Riley Brown — Claude/Codex skills that repair themselves</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2063383381816029429\">Riley Brown — Mythos one-shot mobile app costs</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2063015700684329000\">Riley Brown — Cursor canvas / Sites-like feature</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2062576634025353444\">Riley Brown — content strategy in the age of AI agents</a></li>\n</ul>\n<p class=\"footnote\">Window: June 3–9, 2026 inclusive, with OpenAI’s Codex Sites announcement from June 2 included because it is the feature Paulo explicitly asked to cover and it shaped the week’s Codex discussion. YouTube RSS was checked for all standing channels; transcript retrieval from this cloud IP was blocked by YouTube, so video-derived items are treated as source pointers or attributed opinions only unless backed by official pages or X posts. hermes-ai.net/news had no dated article in the window; its changelog was checked for completeness.</p>"

  "pt": {
    "eyebrow": "Semana de 3–9 de junho de 2026",
    "headline": "Agentes Viram Produtos, Plataformas e Orçamentos",
    "dek": "O sinal da semana foi maior que demos de modelo: Codex Sites transformou agentes em apps internos compartilháveis, Claude Fable 5 levou trabalho longo para a camada de produto, e a conversa mudou para roteamento, preço, revisão e mercados de capital.",
    "byline": "Uma síntese semanal de seis canais do YouTube, quatro redações e perfis selecionados no X. Tempo de leitura ~18 min.",
    "body": "\n<div class=\"part\"><p class=\"kicker\">Parte I</p><p class=\"part-name\">Produtos e ferramentas — o que realmente saiu<span class=\"label-fact\">fatos</span></p></div>\n<h2><span class=\"num\">1.</span> OpenAI transforma Codex em plataforma de apps de trabalho, não só agente de código</h2>\n<p class=\"first\">A maior falha do primeiro rascunho de 9 de junho foi Codex. O lançamento concreto da OpenAI foi mais amplo do que “agentes para desenvolvedores”: Codex agora tem plugins por função, Sites e annotations para analistas, marketing, operações, designers, pesquisadores, investidores e bankers, além de engenheiros. A OpenAI diz que <strong>mais de 5 milhões de pessoas usam Codex por semana</strong>, e que não-desenvolvedores já são <strong>cerca de 20%</strong> da base, crescendo <strong>mais de 3x mais rápido</strong> que desenvolvedores.</p>\n<p>A camada de plugins é o movimento de distribuição. A OpenAI lançou <strong>seis plugins por função</strong> — data analytics, creative production, sales, product design, public-equity investing e investment banking — reunindo <strong>62 apps populares</strong> e <strong>110 skills</strong>. O plugin de dados conecta fluxos em Snowflake, Databricks Genie, Hex e Tableau; o criativo cita Figma, Canva, Shutterstock, Picsart e Fal; o de vendas cita Salesforce, HubSpot, Slack, Outreach, Clay, Rox e Actively; os plugins de investimento e banking apontam para data rooms, dados de mercado e diligência.</p>\n<p><strong>Sites</strong> é o primitivo de produto mais importante. A OpenAI o descreve como uma forma de Codex criar e compartilhar sites e apps interativos hospedados por URL. Na prática, dashboards, planners, espaços de revisão, project boards, galerias e ferramentas internas leves podem ser gerados dentro do Codex e compartilhados no workspace, em vez de exportados como deck ou planilha estática. Exemplos da OpenAI incluem um site de customer review com updates de produto, perguntas abertas e tendências de uso; um scenario planner a partir de um modelo financeiro; e um hub de lançamento com mensagens, marcos, responsáveis e decisões.</p>\n<p>A documentação de desenvolvedor adiciona detalhes operacionais. O <strong>plugin Sites</strong> pode criar, salvar, fazer deploy e inspecionar websites, web apps e jogos hospedados pela OpenAI. Toda URL de deploy é um <strong>deploy de produção</strong>, então a OpenAI recomenda salvar uma versão antes quando houver revisão. O fluxo tem dois estágios: <strong>salvar uma versão</strong>, em que Codex cria um candidato deployável ligado ao commit Git de origem, e <strong>fazer deploy de uma versão</strong>, em que o candidato vai ao ar. Sites está em preview para <strong>ChatGPT Business e Enterprise</strong>; workspaces Business têm o recurso ativo por padrão, enquanto admins Enterprise usam RBAC. Sites também suporta dados persistentes e uploads, com metadados como <code>.openai/hosting.json</code> e bindings de storage para <strong>D1</strong> e <strong>R2</strong>.</p>\n<h2><span class=\"num\">2.</span> Codex ganha loop de edição: annotations, parceiros e a pergunta sobre Convex</h2>\n<p>Annotations é o loop pós-primeiro-rascunho. Em vez de pedir ao Codex para regenerar uma página, slide ou documento inteiro, o usuário aponta para uma parte específica — navbar, rótulo de gráfico, afirmação em uma tese de investimento — e pede mudança ou checagem de fonte. Isso importa porque a primeira saída útil de um agente raramente é o artefato final; o gargalo vai para revisão, gosto e iteração.</p>\n<p>O ecossistema de Sites também começou a parecer superfície de distribuição. A OpenAI citou parceiros iniciais como <strong>Vercel, Wix, Base44, Replit, Lovable, Figma, Webflow e Emergent</strong>. A discussão entre criadores então foi para a pergunta prática: se Sites consegue se conectar a primitives reais de backend, como <strong>Convex</strong>, dados persistentes e workflows de app, ou se fica como uma tela de demo polida. Por isso Codex Sites precisava estar no report: é a ponte entre código escrito por agente e software interno compartilhável.</p>\n<h2><span class=\"num\">3.</span> Anthropic lança Claude Fable 5 e Mythos 5 — mesma família, safeguards diferentes</h2>\n<p>O lançamento da Anthropic em 9 de junho mudou o topo da pilha de modelos. <strong>Claude Fable 5</strong> é descrito como modelo <strong>Mythos-class</strong> tornado seguro para uso geral, com capacidades que a Anthropic diz excederem qualquer modelo já disponibilizado amplamente pela empresa. <strong>Claude Mythos 5</strong> é o mesmo modelo subjacente com alguns safeguards removidos para um grupo pequeno de cyberdefenders e provedores de infraestrutura verificados via Project Glasswing, com trusted-access mais amplo planejado.</p>\n<p>O design de segurança é a história de produto. A Anthropic diz que Fable 5 roteia alguns pedidos de cibersegurança, biologia e química para <strong>Claude Opus 4.8</strong>, em vez de responder com o modelo Mythos-level. Esses safeguards conservadores disparam em <strong>menos de 5% das sessões, em média</strong>, mas podem bloquear pedidos inofensivos. O acesso a Mythos 5 é mais restrito, e seu uso exige política de <strong>retenção de dados por 30 dias</strong> para monitoramento de segurança.</p>\n<p>Disponibilidade e preço foram excepcionalmente explícitos. Fable 5 está disponível via <code>claude-fable-5</code> na Claude API, em planos Enterprise por consumo e em marketplaces incluindo AWS, Google Cloud e Microsoft Foundry. O preço é <strong>US$ 10 por milhão de tokens de entrada</strong> e <strong>US$ 50 por milhão de tokens de saída</strong>, com o desconto existente de <strong>90%</strong> para input com prompt caching. Inferência US-only custa <strong>1,1x</strong>. Nos planos de assinatura, a Anthropic inclui Fable 5 em Pro, Max, Team e Enterprise por assento sem custo extra até <strong>22 de junho</strong>, depois movendo uso após <strong>23 de junho</strong> para créditos, salvo extensão por capacidade.</p>\n<h2><span class=\"num\">4.</span> Os ganhos alegados de Fable 5 são trabalho longo, código, visão e memória</h2>\n<p>Os exemplos de clientes da Anthropic apontam para autonomia longa, não só benchmark curto. A Stripe teria usado Fable 5 em uma base Ruby de <strong>50 milhões de linhas</strong> para fazer uma migração ampla em <strong>um dia</strong> que, segundo a Anthropic, levaria uma equipe inteira <strong>mais de dois meses</strong> manualmente. A Anthropic também diz que Fable 5 teve a maior pontuação entre modelos de fronteira no <strong>FrontierCode</strong> da Cognition mesmo em esforço médio, e que é mais eficiente em tokens que modelos Claude anteriores.</p>\n<p>Para knowledge work, a Anthropic cita o benchmark financeiro senior-level da Hebbia e avaliações de trading da IMC. Em visão, o exemplo memorável é que Fable 5 completou <strong>Pokémon FireRed</strong> com um harness mínimo só de visão, enquanto modelos Claude anteriores precisavam de tooling auxiliar mais elaborado. Em contexto longo, a Anthropic diz que Fable 5 mantém foco através de <strong>milhões de tokens</strong> em tarefas longas e melhora resultados ao longo do tempo. O padrão importante: o modelo está sendo vendido como um worker que persiste, checa seu próprio trabalho e usa visão — não apenas como chat model com resposta melhor.</p>\n<h2><span class=\"num\">5.</span> Google entrega infraestrutura em torno do Gemini: fala, APIs Apple, NotebookLM, Gemma e Kaggle</h2>\n<p>A semana do Google não foi um lançamento só; foi uma pilha. <strong>Gemini 3.5 Live Translate</strong> é um modelo de fala-para-fala em streaming que detecta <strong>mais de 70 idiomas</strong>, preserva entonação, ritmo e pitch, e fica poucos segundos atrás do falante. Está em preview público para desenvolvedores pela Gemini Live API e Google AI Studio, em preview privado para empresas no Google Meet este mês, e chegando ao Google Translate no Android e iOS.</p>\n<p>Para desenvolvedores Apple, o Google disse que Gemini pode ser chamado pelo Foundation Models framework usando o Firebase Apple SDK. A partir de <strong>iOS 27, macOS 27, iPadOS 27, visionOS 27 e watchOS 27</strong>, o protocolo público <code>LanguageModel</code> da Apple pode rotear para Gemini hospedado em nuvem atrás da mesma superfície usada por modelos locais da Apple. Isso transforma escolha de modelo em roteamento: inferência local quando latência e privacidade importam, Gemini em nuvem quando a tarefa precisa de raciocínio mais pesado ou capacidade agentic.</p>\n<p>NotebookLM avançou para ambiente de pesquisa agentic. O Google diz que o sistema atualizado roda em <strong>Gemini 3.5 e Antigravity</strong>, dá a cada notebook um computador seguro na nuvem e inclui <strong>mais de 100 skills de software curadas</strong> para execução de código e análise profunda. O Google diz que o novo NotebookLM venceu por média de <strong>mais de 65%</strong> nas cinco principais dimensões avaliadas, incluindo <strong>69,9%</strong> em análise de documentos longos e <strong>78,2%</strong> em pesquisa web avançada e descoberta de fontes. No lado open model, checkpoints <strong>Gemma 4</strong> QAT incluem formatos que reduzem <strong>Gemma 4 E2B para 1GB de memória</strong>, e Kaggle adicionou desenvolvimento local depois de sua comunidade Benchmarks produzir <strong>mais de 10.000 tarefas de avaliação</strong>.</p>\n<h2><span class=\"num\">6.</span> A outra semana da OpenAI: S-1, memória, Rosalind, biodefesa e runtime de edge</h2>\n<p>O feed da OpenAI de 3–9 de junho também incluiu envio confidencial de rascunho de <strong>S-1</strong> à SEC, a <strong>OpenAI Economic Research Exchange</strong>, o sistema de memória <strong>Dreaming</strong> para ChatGPT, plano de biodefesa com IA, novas capacidades de raciocínio biológico e workflow de laboratório para <strong>GPT-Rosalind</strong>, e documentos de política sobre governança pública de IA de fronteira. Os corpos dos artigos estavam parcialmente bloqueados neste ambiente, então o report usa descrições oficiais de feed/página em vez de detalhes sem suporte.</p>\n<p>O case de desenvolvedor mais concreto foi Wasmer: a OpenAI diz que a Wasmer usou <strong>Codex com GPT-5.5</strong> para construir um runtime Node.js para edge, acelerando o desenvolvimento em <strong>10x a 20x</strong> e entregando em semanas em vez de meses. Junto com Sites, annotations e plugins por função, o padrão é claro: Codex está sendo empurrado de “AI pair programmer” para “camada operacional agentic para artefatos de trabalho”.</p>\n<h2><span class=\"num\">7.</span> Canal de serviços e relatório cyber da Anthropic mostram comercialização e risco andando juntos</h2>\n<p>A Anthropic expandiu a Claude Partner Network com Services Track e Partner Hub, apoiados por investimento de <strong>US$ 100 milhões</strong> em treinamento de parceiros, suporte técnico e marketing conjunto. A Anthropic diz que <strong>mais de 40.000</strong> empresas pediram para entrar e <strong>mais de 10.000</strong> consultores receberam certificação Claude. Rollouts citados incluem Accenture treinando <strong>30.000</strong> profissionais, Cognizant levando Claude a cerca de <strong>350.000</strong> associados, Deloitte disponibilizando para <strong>470.000</strong> pessoas e KPMG integrando Claude em mais de <strong>276.000</strong> trabalhadores.</p>\n<p>O relatório cyber examinou <strong>832</strong> contas banidas associadas a atividade cibernética maliciosa entre março de 2025 e março de 2026 e as mapeou ao MITRE ATT&amp;CK. Escrita de malware apareceu em <strong>560 de 832 contas</strong>, ou <strong>67,3%</strong>; <strong>54 contas</strong>, ou <strong>6,5%</strong>, usaram IA para auxiliar movimento lateral. A pontuação de risco da Anthropic colocou <strong>33%</strong> dos atores em risco médio ou maior nos primeiros seis meses e <strong>56%</strong> nos seis meses seguintes. A empresa também argumentou que o MITRE ATT&amp;CK não tem categoria para orquestração agentic, citando operação estatal de novembro de 2025 com <strong>30 técnicas em 13 táticas</strong>.</p>\n<div class=\"part\"><p class=\"kicker\">Parte II</p><p class=\"part-name\">Economia — apenas números duros<span class=\"label-fact\">fatos</span></p></div>\n<h2><span class=\"num\">8.</span> Os números duros: uso do Codex, preço do Fable, canais, IPO e gasto com IA</h2>\n<p>A OpenAI divulgou <strong>mais de 5 milhões</strong> de usuários semanais de Codex, com não-desenvolvedores em <strong>cerca de 20%</strong> da base e crescendo <strong>mais de 3x</strong> mais rápido que desenvolvedores. Também divulgou seis plugins por função cobrindo <strong>62 apps</strong> e <strong>110 skills</strong>. A Anthropic precificou Fable 5 e Mythos 5 em <strong>US$ 10 por milhão de tokens de entrada</strong> e <strong>US$ 50 por milhão de tokens de saída</strong>, manteve desconto de <strong>90%</strong> em input com prompt caching, fixou inferência US-only em <strong>1,1x</strong>, e ofereceu acesso temporário em planos de assinatura até <strong>22 de junho</strong>.</p>\n<p>O programa de parceiros da Anthropic adicionou orçamento de enablement de <strong>US$ 100 milhões</strong>, <strong>mais de 40.000</strong> empresas candidatas e <strong>mais de 10.000</strong> consultores certificados. A OpenAI confirmou envio confidencial de rascunho de <strong>S-1</strong>, mas não divulgou valuation, receita, número de ações ou timing de listagem. Os sinais econômicos do Google foram sinais de custo de infraestrutura: Gemma 4 QAT mira inferência local mais barata, Kaggle Benchmarks chegou a <strong>mais de 10.000</strong> tarefas comunitárias, e a rota Gemini Apple/Firebase transforma chamadas de modelo em serviço de nuvem dentro de apps nativos.</p>\n<p>A lista de vídeos reforçou a mesma economia mesmo sem transcrições acessíveis deste IP: o episódio de Thomas Laffont no All-In em 4 de junho enquadrou uma possível onda de IPOs de IA de <strong>US$ 4 trilhões</strong>; os painéis do All-In de 7 e 6 de junho focaram mercados secundários e reabertura de IPOs; o episódio do a16z com Benedict Evans foi explicitamente sobre economia de uso de IA e SaaS; e o título “software development bottleneck moved” do Tech With Tim combina com a mudança de código para orquestração, revisão e deploy.</p>\n<div class=\"part\"><p class=\"kicker\">Parte III</p><p class=\"part-name\">Opiniões e ideias — argumentos atribuídos<span class=\"label-op\">opinião</span></p></div>\n<p>Estas são teses, interpretações e previsões de pessoas nomeadas ou episódios de criadores com títulos claros, não fatos estabelecidos.</p>\n<h3 class=\"op\"><span class=\"who\">Aaron Levie</span> — contexto, evals e roteamento viram moat enterprise</h3>\n<p>A thread mais forte de Levie foi que inteligência do modelo não elimina a necessidade de instruções, contexto de domínio e dados proprietários. Ele argumenta que o mesmo modelo geral será usado por advogados, engenheiros, analistas financeiros e profissionais de saúde, então output útil ainda depende de guiar o modelo para a tarefa diferenciada. Em outra thread, ele diz que custos de tokens estão virando linha relevante de OPEX empresarial, tornando roteamento de modelos e evals de domínio um diferencial central da camada de IA aplicada.</p>\n<h3 class=\"op\"><span class=\"who\">Aaron Levie</span> — benchmarks brutos precisam normalizar compute</h3>\n<p>Depois do lançamento de Fable 5, Levie argumentou que performance aparente depende cada vez mais de quanto compute de inferência é aplicado. Para ele, benchmarks normalizados por compute são o caminho lógico, mas difíceis porque “quanto pensar” gastar em uma tarefa é subjetivo e pode inverter rankings de modelos em níveis diferentes de esforço.</p>\n<h3 class=\"op\"><span class=\"who\">Riley Brown</span> — Fable/Mythos sinaliza uma nova classe de modelo da Anthropic</h3>\n<p>A reação imediata de Brown a Fable/Mythos foi que a Anthropic quebrou seu padrão recente Haiku/Sonnet/Opus com uma nova classe. Ele disse que o modelo era “really really good” depois dos primeiros testes e publicou um experimento no Cowork em que subiu um relatório estilo McKinsey e pediu ao Fable/Mythos para criar um documento de qualidade similar. Trate isso como avaliação inicial de criador, não benchmark.</p>\n<h3 class=\"op\"><span class=\"who\">Riley Brown</span> — plataformas agentic precisam de skills reutilizáveis que se corrigem</h3>\n<p>Brown enquadrou skills de Claude Code e Codex como a camada operacional que faltava para agentes pessoais. A observação-chave: quando uma skill causa erro, Claude pode corrigir a skill imediatamente, transformando falha pontual em melhoria persistente de processo. É a mesma ideia por trás de Codex Sites e annotations: agentes valem mais quando o trabalho deles é revisável, editável e reutilizável.</p>\n<h3 class=\"op\"><span class=\"who\">Riley Brown</span> — apps Mythos-level podem ser caros, mas qualitativamente diferentes</h3>\n<p>Brown previu que Mythos poderia criar quase qualquer app mobile full-stack de ponta a ponta e submetê-lo à app store, mas alertou que, se for <strong>5x mais caro que Opus</strong>, o custo de API poderia ficar em torno de <strong>US$ 120–US$ 400 por app</strong>. A ideia econômica importante não é o número exato; é a troca entre inferência frontier cara e substituir muitas rodadas humanas de prompting, debug e integração.</p>\n<h3 class=\"op\"><span class=\"who\">Tech With Tim</span> — o gargalo de desenvolvimento de software mudou</h3>\n<p>A semana de vídeos do Tech With Tim girou em torno de aprendizado, infraestrutura e gargalos do mercado de trabalho: “The Software Development Bottleneck Just Moved”, “Why Companies Won’t Hire Junior Devs And Why It’ll Backfire” e um recap de conferência de infraestrutura de IA. Sem acesso às transcrições aqui, o report trata os títulos só como sinais de fonte, mas o tema se alinha aos fatos da semana: gerar código ficou menos escasso; julgamento de produto, revisão, deploy, infraestrutura e treinamento ficam mais escassos.</p>\n<h3 class=\"op\"><span class=\"who\">Greg Isenberg</span> — Codex Sites leva “AI-native” do prompt ao produto</h3>\n<p>Os vídeos de Greg Isenberg sobre Codex e AI-native, junto com a discussão “Codex Sites is good.. but can it run Convex?”, colocam pressão prática em Sites: uma página gerada é útil, mas um app interno AI-native precisa de dados persistentes, permissões, workflows reais de backend e ciclo de manutenção. Por isso Convex e backends similares apareceram: a fronteira não é gerar UI, é tornar software gerado operacional.</p>\n<h3 class=\"op\"><span class=\"who\">Benedict Evans</span> — a economia de SaaS está sendo repriced em torno de uso</h3>\n<p>O episódio do a16z com Benedict Evans foi explicitamente sobre economia do uso de IA e o que vem depois para SaaS. Junto com os posts de Levie sobre orçamento de tokens e a expansão do Codex para funções não técnicas, o argumento a acompanhar é que preço de software se afasta de licenças por assento isoladas e vai para uso, outcome, roteamento e economia de mix de modelos.</p>\n<h3 class=\"op\"><span class=\"who\">Convidados do All-In</span> — o ciclo de capital de IA saiu da liquidez privada para mercados públicos</h3>\n<p>A semana financeira do All-In — Thomas Laffont falando de uma onda de IPOs de IA de <strong>US$ 4 trilhões</strong>, painéis sobre mercados secundários e reabertura de IPOs, e Bill Maris falando do estágio “Atari” da IA — enquadrou o mercado como inicial, não maduro. Como as transcrições foram bloqueadas aqui, o report não cita falas; registra a tese direcional visível no conjunto de episódios: formação de empresas de IA, liquidez secundária e prontidão para mercado público viraram uma história integrada.</p>\n",

ftware is not just code</a></li>\n  <li><a href=\"https://x.com/levie/status/2063320673217609936\">Aaron Levie — token budgets and model routing</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2064395899522998357\">Riley Brown — Anthropic’s new model class</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2064407515752722521\">Riley Brown — first Fable/Mythos test in Cowork</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2064006354772033761\">Riley Brown — Claude/Codex skills that repair themselves</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2063383381816029429\">Riley Brown — Mythos one-shot mobile app costs</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2063015700684329000\">Riley Brown — Cursor canvas / Sites-like feature</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2062576634025353444\">Riley Brown — content strategy in the age of AI agents</a></li>\n</ul>\n<p class=\"footnote\">Janela: 3–9 de junho de 2026, inclusive, com o anúncio de Codex Sites da OpenAI em 2 de junho incluído porque foi a feature que Paulo pediu explicitamente para cobrir e ela moldou a discussão de Codex da semana. O RSS do YouTube foi checado para todos os canais fixos; a obtenção de transcrições a partir deste IP em nuvem foi bloqueada pelo YouTube, então itens derivados de vídeo são tratados como ponteiros de fonte ou opiniões atribuídas, exceto quando sustentados por páginas oficiais ou posts no X. hermes-ai.net/news não teve artigo datado na janela; o changelog foi checado por completude.</p>"

<div class="part"><p class="kicker">Part I</p><p class="part-name">Features &amp; tools — what actually shipped<span class="label-fact">facts</span></p></div>

<h2><span class="num">1.</span> OpenAI / Codex</h2>
<p class="first">On <strong>June 2</strong>, OpenAI extended Codex beyond developers with <strong>six role-specific plugins</strong> — data analytics, creative production, sales, product design, public-equity investing, and investment banking — bundling <strong>62 apps and 110 skills</strong>, with connectors to Snowflake, Tableau, Figma, Canva, Salesforce, HubSpot, FactSet, S&amp;P and PitchBook. OpenAI states non-developers are now about <strong>20%</strong> of Codex users and growing roughly three times faster than developers. The same release added <strong>Sites</strong> (a preview for Business and Enterprise): Codex generates a hosted, shareable web app, dashboard or prototype from a prompt and can update it without further input; and it extended <strong>annotations</strong> — point-and-edit refinement — from code to documents, spreadsheets and slide decks. OpenAI also said Codex will be put <strong>into ChatGPT "in the next few weeks,"</strong> with agents running persistently in the cloud and reachable inside Excel, Slack and PowerPoint.</p>
<p>Three more OpenAI items landed the same week. On <strong>June 4</strong>, it began rolling out <strong>"Dreaming,"</strong> a background memory system that synthesizes and corrects stored memories (for example, revising a future-tense trip to past tense once it has happened); OpenAI says it reduces the compute to serve a free user by roughly five times and adds a reviewable memory page, live first for Plus/Pro in the US. On <strong>June 3</strong>, it updated <strong>GPT-Rosalind</strong>, its life-sciences model line, reporting benchmark gains over GPT-5.5 — MedChemBench 27.5% vs 25.1%, GeneBench 21.6% vs 20.4%, LabWorkBench 63.2% vs 55.8% — plus a new LifeSciBench eval and two Codex plugins (Life Sciences Research, NGS Analysis), with Novo Nordisk as a research-preview partner. On <strong>June 1</strong>, OpenAI's frontier models and Codex reached general availability on <strong>AWS via Amazon Bedrock</strong> (Commercial and GovCloud), previewing a cyber-defense effort named Daybreak.</p>

<h2><span class="num">2.</span> Cursor and the cheaper models</h2>
<p><strong>Cursor Composer 2.5</strong> — released <strong>May 18</strong>, built on the open <strong>Kimi K2.5</strong> checkpoint, mixture-of-experts — ran Cursor's coding benchmark at about <strong>$0.50 per task versus ~$7 for Opus 4.7</strong> (14x cheaper). On third-party measures it was roughly tied with Opus 4.7 and GPT-5.5 on the Artificial Analysis Coding Index, beat GPT-5.5 on SWE-Bench Multilingual, and trailed GPT-5.5 on terminal-heavy tasks. In a single live demo on Tech With Tim it produced a working whiteboard app in about four minutes while Opus 4.7 took about fifteen and shipped a broken one. Cursor also launched <strong>Canvases</strong> (deployable internal sites) and public profiles at cursor.com/profile. Separately, on Riley Brown's show, Lindy founder Flo Crivello reported moving all of his product's traffic to <strong>DeepSeek V4</strong>, citing roughly <strong>$1.30 per million tokens</strong> for DeepSeek V4 Pro against <strong>$30</strong> for Opus 4.8 and <strong>$35</strong> for GPT-5.5.</p>

<h2><span class="num">3.</span> Agent infrastructure and super-apps</h2>
<p><strong>Hermes</strong> shipped a <strong>Desktop super-app</strong> (previously terminal-only), model-agnostic across Anthropic, OpenAI, DeepSeek, MiniMax and Kimi K2 — though without an in-app browser. <strong>Apple</strong> reportedly approved <strong>Poke.com</strong> as the first AI agent permitted to operate natively inside iMessage. <strong>Microsoft</strong> is reported to be building an OpenClaw companion app into Windows, a Mac-Mini-style "dev box" for running local models, and its first set of frontier models. At <strong>Temporal's Replay</strong> conference, Temporal announced <strong>serverless workers, standalone activities and workflow streams</strong>, and said OpenAI grew its Temporal usage <strong>more than 60x in a year</strong> (other named users: Mistral, Docker, Replit, Retool, Netflix). Two building blocks aimed at agents-as-buyers were highlighted: <strong>AgentMail</strong>, a YC-backed inbox API that gives an agent its own email account, and <strong>Stripe's</strong> new ability to give an agent a wallet with spend caps, approval rules and audit trails.</p>

<h2><span class="num">4.</span> AI security</h2>
<p>Palo Alto Networks CEO Nikesh Arora said an internal model called <strong>Mythos</strong> found vulnerabilities in Palo Alto's own code in <strong>six weeks that would normally take five to seven years</strong>, for "low millions" of tokens, and on a persistent-reasoning "ultra mode" could chain vulnerabilities into new attack paths; he stated its <strong>false-positive rate was 30%</strong>. <strong>Anthropic</strong> expanded <strong>Project Glasswing</strong> (built on its Claude Mythos preview) from about 50 to roughly <strong>150 organizations across 15+ countries</strong>, with the first cohort having found <strong>10,000+ high/critical-severity flaws</strong>. Anthropic also published a year-long analysis of <strong>832 banned accounts</strong> mapped to MITRE ATT&amp;CK: <strong>67.3% used AI to write malware</strong>, 6.5% for lateral movement, and the share of medium-or-higher-risk actors rose from <strong>33% to 56%</strong> over the period. And it launched a <strong>Services Track and Partner Hub</strong> for the Claude Partner Network, reporting 40,000+ firms applied and 10,000+ consultants certified.</p>

<div class="part"><p class="kicker">Part II</p><p class="part-name">Economics — the stated numbers<span class="label-fact">facts</span></p></div>

<h2><span class="num">5.</span> The filings and raises</h2>
<p>On <strong>June 1</strong>, <strong>Anthropic confidentially submitted a draft Form S-1</strong> to the SEC for a proposed IPO of common stock; share count and price are not yet set. Days earlier, on May 28, Anthropic had announced a <strong>$65B Series H at a $965B post-money valuation</strong>. On All-In, Coatue's Thomas Laffont said <strong>SpaceX</strong> is expected to list within weeks, and OpenAI is also on the path to public markets.</p>

<h2><span class="num">6.</span> Valuation and revenue figures presented</h2>

<p>Alex Imas e Phil Trammell fazem o argumento mais contraintuitivo da semana: mesmo bens de IA infinitos e gratuitos podem não salvar a fatia de ~60% do trabalho na produção, porque se a variedade de bens automatizados segue se expandindo enquanto os bens humanos permanecem finitos, o gasto migra para as novas variedades e a fatia do trabalho pode cair rumo a zero. São céticos quanto ao viral cenário de "recessão por colapso de demanda" ("o mundo em que há uma singularidade e não queremos investir mais dinheiro é uma loucura") e aconselham paciência no pânico com empregos, notando que muitas demissões de 2026 parecem cortes comuns rotulados como IA. A ideia mais sombria deles é que uns poucos "otimizadores gananciosos" insaciáveis — citam Musk e Zuckerberg — poderiam, reinvestindo tudo, empurrar a fatia de capital da economia rumo a um; a mais prática, que a melhor jogada de um país de renda média pode ser "comprar o índice da AGI", o que funciona se a IA for como eletricidade e falha se for como mídia social.</p>

/* ============================================================
   RENDER
   ============================================================ */
const I18N = {
  en: { pubtitle: "The Weekly · AI &amp; Tech", sources: "Sources" },
  pt: { pubtitle: "The Weekly · IA &amp; Tech", sources: "Fontes" }
};

let state = { lang: "en", date: EDITIONS[0].date };

function editionByDate(d){ return EDITIONS.find(e => e.date === d) || EDITIONS[0]; }

function render(){
  const ed = editionByDate(state.date);
  const c = ed[state.lang];
  document.documentElement.lang = state.lang;
  document.querySelector('[data-i18n="pubtitle"]').innerHTML = I18N[state.lang].pubtitle;

  const art = document.getElementById('article');
  art.innerHTML =
    '<p class="eyebrow">' + c.eyebrow + '</p>' +
    '<h1 class="headline">' + c.headline + '</h1>' +
    '<p class="dek">' + c.dek + '</p>' +
    '<p class="byline">' + c.byline + '</p>' +
    '<hr class="rule">' +
    c.body +
    '<hr class="rule">' +
    '<div class="source-list"><h3 style="color:var(--accent);font-size:15px">' + I18N[state.lang].sources + '</h3>' + c.sources + '</div>';

  document.querySelectorAll('.lang button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === state.lang);
  });
  window.scrollTo({top:0, behavior:'instant'});
}

function buildDropdown(){
  const sel = document.getElementById('edition');
  sel.innerHTML = EDITIONS.map(e =>
    '<option value="' + e.date + '">' + e.label[state.lang] + '</option>'
  ).join('');
  sel.value = state.date;
}

/* ---- Dark mode toggle (moon = go dark, sun = go light) ---- */
const ICON_MOON = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 1 0 9.8 9.8z" fill="currentColor"/></svg>';
const ICON_SUN  = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5.2" y1="5.2" x2="6.9" y2="6.9"/><line x1="17.1" y1="17.1" x2="18.8" y2="18.8"/><line x1="5.2" y1="18.8" x2="6.9" y2="17.1"/><line x1="17.1" y1="6.9" x2="18.8" y2="5.2"/></g></svg>';

function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('theme');
  // Light mode shows the MOON (click to go dark); dark mode shows the SUN (click to go light).
  btn.innerHTML = (t === 'dark') ? ICON_SUN : ICON_MOON;
  btn.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  btn.setAttribute('title', t === 'dark' ? 'Light mode' : 'Dark mode');
  try { localStorage.setItem('weekly-theme', t); } catch(e){}
}
(function initTheme(){
  let t = null;
  try { t = localStorage.getItem('weekly-theme'); } catch(e){}
  if (t !== 'dark' && t !== 'light'){
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  applyTheme(t);
  document.getElementById('theme').addEventListener('click', ()=>{
    const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });
})();

document.getElementById('edition').addEventListener('change', e=>{
  state.date = e.target.value; render();
});
document.querySelectorAll('.lang button').forEach(b=>{
  b.addEventListener('click', ()=>{
    state.lang = b.dataset.lang;
    buildDropdown();
    render();
  });
});

buildDropdown();
render();
</script>
