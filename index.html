<script>
/* ============================================================
   EDITIONS DATA
   Each edition keyed by ISO date. To add a new AI weekly digest,
   prepend a new object with the same shape. The Hermes cron job
   (Sundays 13:00 Sydney) can prepend a new entry here.

   HOUSE STYLE — three clearly separated parts, in this order:
     Part I  — Features & tools   (FACTS ONLY: what shipped,
               specs, numbers, benchmarks, prices. Objective.)
     Part II — Economics          (FACTS ONLY: filings, raises,
               stated revenue/valuation/compute figures.)
     Part III — Opinion & ideas   (theses, frameworks, forecasts,
               always attributed to who said them.)
   Keep facts and opinion strictly separated.
   ============================================================ */
const EDITIONS = [
  {
    "date": "2026-06-21",
    "label": {
      "en": "June 21, 2026",
      "es": "21 de junio de 2026",
      "pt": "21 de junho de 2026"
    },
    "en": {
      "eyebrow": "Week of June 15–21, 2026",
      "headline": "Governed Agents, Medical AI and the New Cost Controls",
      "dek": "The week’s signal was operational: OpenAI added enterprise spend controls and life-science evaluations, Google and Anthropic pushed AI into health, infrastructure and Korea, and builders argued that open weights plus agent workspaces are changing the economics of applied AI.",
      "byline": "A weekly synthesis of monitored YouTube uploads, four newsrooms, four weekly AI sites/newsletters, and selected X profiles. Expanded edition, 3,000+ words. Reading time ~22 min.",
      "body": "<div class=\"part\"><p class=\"kicker\">Part I</p><p class=\"part-name\">Features &amp; tools — what actually shipped<span class=\"label-fact\">facts</span></p></div>\n<h2><span class=\"num\">1.</span> OpenAI turned the week into an operations story</h2>\n<p class=\"first\">The clearest signal from the June 15–21 window was not a single dramatic model reveal. It was the amount of machinery being added around models so they can be used in organizations that have budgets, compliance teams, medical review, product owners and local infrastructure constraints. OpenAI’s biggest enterprise announcement was new usage analytics and updated spend controls for ChatGPT Enterprise. Admins can now see ChatGPT and Codex credit use in one place, split the view by user, product and model, set default workspace limits, create limits for groups, approve individual overrides and use a unified Cost API to connect model spend with outside finance systems.</p>\n<p>That sounds administrative, but it changes the adoption pattern. A company no longer has to choose only between a broad seat cap and an uncontrolled internal experiment. It can let engineers, analysts and product teams use more model capacity where it is justified, while giving finance and platform teams enough detail to explain the bill. Codex and ChatGPT become measurable work surfaces rather than invisible tools. The important product movement is that AI work is becoming governable at the level at which organizations actually buy, allocate and review software.</p>\n<p>OpenAI’s health and science updates extended the same theme into higher-stakes work. Its health-intelligence note said GPT-5.5 Instant improved ChatGPT health and wellness responses through physician-informed evaluations, clearer communication and stronger handling of context. The rare-disease item reported that researchers using an OpenAI reasoning model identified <strong>18 new diagnoses</strong> in previously unsolved childhood cases. The chemistry item, with Molecule.one, described a near-autonomous AI chemist using <strong>GPT-5.4</strong> to improve a difficult medicinal-chemistry reaction. These are separate examples, but together they show why ordinary chatbot evaluation is not enough when the domain is medicine or laboratory science.</p>\n<p>The benchmark and safety pieces made that point explicit. <strong>LifeSciBench</strong> was introduced as an expert-authored and expert-reviewed benchmark for real-world life-science tasks. <strong>Deployment Simulation</strong> was presented as a way to predict model behavior before release by simulating deployment with real conversation data. The shared message is that stronger models require stronger pre-release evaluation, not just more impressive demos. In the week’s context, OpenAI’s story was therefore double-sided: more freedom for enterprise users through spend controls, and more structured testing for domains where a confident answer can carry clinical, scientific or safety consequences.</p>\n<h2><span class=\"num\">2.</span> Google and Anthropic pushed AI into institutions, infrastructure and regional partnerships</h2>\n<p>Google’s most concrete research item was AMIE. The Google Research article, published in <em>Nature</em>, described a conversational medical-AI system that moved beyond diagnosis toward complex disease management and matched primary-care physicians in the reported evaluation. The important distinction is the task shape. A system that answers isolated medical questions is useful in one way; a system evaluated on disease management is being tested against the longer arc of care, where context, follow-up, uncertainty and communication all matter. The article was research rather than a broad product launch, but it placed medical AI in the same institutional lane as OpenAI’s health work: the question is not only whether the model knows facts, but whether it can support structured decisions.</p>\n<p>Google also announced a <strong>$1.5 billion</strong> 2026–2027 investment to expand its Jackson County, Alabama data-center campus on a repurposed former coal-plant site. The article said Google is funding <strong>100%</strong> of its own power and infrastructure costs, adding a <strong>$2 million</strong> Energy Impact Fund with TVA and CAANEAL, donating <strong>$550,000</strong> for STEM kits for local fourth-to-eighth graders and building on digital-skills training that has reached more than <strong>130,000</strong> Alabamians. In a week about applied AI, that infrastructure article mattered because it showed the physical side of the software story. More agentic work, richer media generation and heavier inference all require campuses, power, grid coordination and local political legitimacy.</p>\n<p>Anthropic’s newsroom item moved in a different institutional direction. The company opened a Seoul office and signed an MOU with Korea’s Ministry of Science and ICT focused on AI safety. It named enterprise deployments across LG CNS, Hanwha Solutions, Samsung SDS, Nexon and Channel Corp. Anthropic also said Channel Talk is used by more than <strong>230,000</strong> companies across Korea, Japan and the United States. That turns Claude from a model family into a regional operating strategy: local office, safety relationship with government, enterprise deployments, AWS Bedrock for data-residency-sensitive customers, and use cases across coding, knowledge work, customer service and agentic workflows.</p>\n<p>Read together, Google and Anthropic made the same argument from opposite ends. Google showed that AI is still constrained by energy, campuses, education commitments and local investment. Anthropic showed that AI distribution depends on trust, local presence, procurement relationships and policy engagement. Neither item was a consumer feature. Both were about embedding AI in institutions that have existing obligations: hospitals, governments, infrastructure authorities, large companies and customer-service platforms. That is why the week felt operational. The visible product may be a model response, but the durable competitive work is increasingly about the systems surrounding that response.</p>\n<h2><span class=\"num\">3.</span> The product layer moved from chat toward artifacts, memory and saved workflows</h2>\n<p>The weekly AI sites and newsletters filled in the user-facing layer. Future Tools and Superhuman pointed to teams packaging agent work as artifacts, shareable pages and durable memories. The reported Claude Code artifacts support lets a coding session publish live, private-by-default web pages such as pull-request walkthroughs, incident timelines, dashboards and release checklists from the session’s full context. Perplexity’s reported Brain system for Computer AI was framed not as ordinary preference memory but as work memory: it tracks what the agent tried, what worked and what failed, then uses that history to improve future tasks.</p>\n<p>Simple AI’s June 17 essay, “The Apps Separating Beginners from AI Power Users,” described the same shift from the user’s side. Beginners stay in general chatbots. Intermediate and advanced users move into Codex, Claude Code, Raycast-style command surfaces and small app loops. Superhuman’s archive added adjacent examples: an AI-native video editor, Copilot Cowork becoming generally available, ChatGPT scheduling and data workflows, and PDF-to-Claude-Skill workflows. These are not all primary launches, and the edition should treat them as newsletter signals. Still, the pattern is clear: the competitive unit is moving from a clever prompt to a workflow that can be saved, replayed, shared, governed and billed.</p>\n<p>The X feed reinforced that product interpretation. Riley Brown argued that Codex feels powerful while ChatGPT feels more disposable, and suggested that a thoughtfully designed “CodexGPT” could become a strong general-purpose app. Simon Willison launched Datasette Apps and also commented on GLM 5.2 and fast inference providers. swyx highlighted a Devin-generated conference announcement asset. Nathan Lambert pointed to an RLHF book community for post-training practitioners. None of those posts should be overread as audited market facts, but they show what builders were paying attention to: durable workspaces, developer artifacts, post-training knowledge, generated assets and the practical details of making models fast enough and cheap enough to use repeatedly.</p>\n<p>The common thread is persistence. A chat window is useful, but it is easy to lose the reasoning, the file context, the task state and the decision trail. Agent workspaces try to keep those pieces alive. Artifacts turn an internal coding session into a page someone else can inspect. Memory turns a failed attempt into information for the next attempt. Skills and workflow templates turn repeated tasks into reusable process. Admin analytics then make the process governable. That entire chain appeared across the week’s sources, from OpenAI’s Cost API to Claude Code pages, Brain-style work memory and the power-user discussion in the newsletters.</p>\n<div class=\"part\"><p class=\"kicker\">Part II</p><p class=\"part-name\">Economics — budgets, infrastructure and markets<span class=\"label-fact\">facts</span></p></div>\n<h2><span class=\"num\">4.</span> AI is becoming a measured utility before it becomes an invisible utility</h2>\n<p>The strongest economic facts in the source set were OpenAI’s spend controls and Google’s Alabama investment. One sits inside an enterprise console; the other sits in the power grid. Together they say that AI scale has to be legible to both CFOs and counties. OpenAI is giving customers visibility into credits, users, products and models. Google is committing <strong>$1.5 billion</strong> over two years to data-center capacity while pairing the buildout with local energy, education and workforce commitments. The same industry that sells magic in the interface is being forced to account for units, watts, facilities, communities and line items.</p>\n<p>That accounting matters because usage patterns are changing. If AI is only an occasional assistant, spend can be treated as a seat subscription. If AI becomes a coding environment, research assistant, medical reasoning aid, customer-service layer and video-production tool, spend becomes variable and workflow-dependent. The enterprise buyer then needs a way to distinguish experimentation from production, heavy users from casual users, and high-value model calls from avoidable ones. OpenAI’s group limits, individual overrides and Cost API are notable because they fit this second world. They let organizations expand AI work without pretending that every user, model and task has the same cost profile.</p>\n<p>Google’s article described the complementary constraint. Model capability is not only a software problem; it depends on data centers, power and local approval. By emphasizing that Google will fund all of its own power and infrastructure costs, while adding an Energy Impact Fund and education commitments, the company framed AI infrastructure as a negotiated local presence rather than a purely private cloud expansion. The STEM kits for fourth-to-eighth graders and the digital-skills training number are not model benchmarks, but they are part of the operating environment that makes large-scale AI infrastructure politically and socially possible.</p>\n<p>Anthropic’s Korea announcement adds a third economic layer: distribution. The company did not center the article on a single price or funding number. Instead it described a Seoul office, an AI-safety MOU, named enterprise customers and deployment channels. For enterprise AI, that can be as important as raw model performance. Large buyers need support, data residency options, procurement trust and confidence that the vendor understands local institutions. In that sense, the week’s economics were less about speculative valuation and more about the plumbing of adoption: cost controls, data centers, policy relationships, customers and support structures.</p>\n<h2><span class=\"num\">5.</span> Open weights, fast inference and applied software changed the builder debate</h2>\n<p>The monitored X profiles did not surface a new audited financing event, but they did capture a market debate about the applied layer. Aaron Levie argued that open-weights models reaching near-frontier performance in coding and other domains is good for applied software because it lowers task cost while leaving frontier models useful for planning, orchestration and review. In that framing, open models do not have to beat every frontier system. They only have to make the marginal gap small enough that many routine pieces of a workflow can be routed to cheaper infrastructure.</p>\n<p>Simon Willison’s GLM 5.2 comment pointed at the same cost-performance axis from the infrastructure side. His interest in seeing the model run on super-fast custom-silicon providers such as Groq or Cerebras was not only a model-quality point; it was a routing point. If stronger open models are available through fast inference providers, builders can decide which tasks require a frontier model and which can be handled by cheaper, lower-latency systems. That routing decision becomes one of the basic design questions for AI products, especially when the product performs many small actions rather than one occasional prompt.</p>\n<p>The implication for applied software companies is straightforward but important. More capable open weights can expand the total amount of AI usage because they reduce the cost of background work: classification, drafting, extraction, test generation, summarization, code search, review and simple orchestration steps. Frontier models can still be used where reasoning, planning, safety review or complex synthesis matters most. This is not a settled fact about future market share; it is the builder-side thesis visible in the week’s X feed. But it fits the product evidence from the newsletters: once workflows are durable, every repeated step becomes a candidate for cost-aware routing.</p>\n<p>The YouTube source list added broader context even though transcript retrieval was blocked from the cloud IP and the videos are therefore used only as source pointers and themes. a16z’s items pointed to enduring companies outside Silicon Valley and to the future of image generation with Ideogram’s CEO. Dwarkesh Patel’s listed conversations pointed toward long-horizon questions about the Renaissance, von Neumann probes, the end of human wages and the risk of hiring humans in some future scenarios. Because the transcripts were unavailable, this edition should not quote them or treat specific claims as extracted facts. Still, their presence in the monitored set shows that the week’s discussion spanned both near-term tooling and much larger questions about company formation, creative generation, labor and automation.</p>\n<h2><span class=\"num\">6.</span> The week’s source map showed a broader monitored field, not just one launch cycle</h2>\n<p>A corrected edition should make clear that the digest was built from multiple categories of monitored sources. The primary newsroom facts came from OpenAI, Anthropic and Google. The weekly-site and newsletter layer came from Simple AI, Superhuman, Future Tools and TLDR AI archives for June 16–19 entries. The social layer came from Aaron Levie, Simon Willison, Riley Brown, Nathan Lambert and swyx. The YouTube layer included a16z and Dwarkesh Patel videos, used only as pointers because transcripts were not available. Hermes AI News had no dated item in the window, and several monitored YouTube handles did not expose channel IDs to the unauthenticated fetch.</p>\n<p>That source map matters because it prevents the edition from overstating certainty. A newsroom article about a data-center investment can support concrete numbers. A company blog post about a benchmark can support what the company says it measured. A newsletter roundup can signal which tools practitioners are noticing, but it should be labeled as editorial aggregation. An X post can capture a thesis or product feeling, but it is not the same as audited evidence. A video title can identify a theme, but without the transcript it should not be used for detailed claims. The corrected body therefore separates facts from opinions and keeps Part III explicitly interpretive.</p>\n<p>It also explains why the expanded edition should spend more time on connective tissue than the shorter draft did. The same week contained enterprise cost controls, medical evaluation work, a rare-disease result, a chemistry automation example, a life-science benchmark, a deployment-simulation method, a regional Anthropic expansion, a Google medical-research paper, a Google infrastructure investment, newsletter signals about agent artifacts and memory, and builder arguments about open weights and inference. Those items are not one announcement, but they describe one operational pattern: AI is leaving the novelty layer and entering the layer where work must be budgeted, evaluated, localized, repeated and audited. The corrected body therefore uses the monitored sources not as a list of links but as evidence for that pattern.</p>\n<div class=\"part\"><p class=\"kicker\">Part III</p><p class=\"part-name\">Opinion &amp; ideas — arguments, not facts<span class=\"label-op\">opinion</span></p></div>\n<p>These are attributed interpretations from X and creator sources, not settled facts. They are useful because they explain why the factual launches above felt connected, but they should be read as arguments rather than verified outcomes.</p>\n<h3 class=\"op\"><span class=\"who\">Aaron Levie</span> — open weights can expand the applied layer</h3>\n<p>Levie’s thesis was that open weights do not need to defeat every frontier model to matter. If the marginal gap narrows enough in coding and other practical domains, builders can route large parts of workflows to cheaper models while reserving frontier models for planning, orchestration and review. The optimistic version of the argument is that cheaper model calls create more total AI usage and more room for applied software companies. The caution is that this depends on real task performance, latency, hosting reliability and the ability to decide when a frontier model is still necessary.</p>\n<h3 class=\"op\"><span class=\"who\">Riley Brown</span> — persistent workspaces feel more consequential than disposable chat</h3>\n<p>Brown’s product-emotional contrast between Codex and ChatGPT captured a broader shift. Chat is fast, flexible and disposable. A coding workspace feels more consequential because it contains files, projects, history and outputs that can matter later. His “CodexGPT” idea is a prediction, not a fact, but it helps explain why artifacts, skills, memory and admin controls were the week’s recurring motifs. The product that wins may not be the one with the prettiest single answer; it may be the one that preserves enough context for work to compound.</p>\n<h3 class=\"op\"><span class=\"who\">Simon Willison</span> — inference providers are the routing battleground</h3>\n<p>Willison’s interest in GLM 5.2 on providers such as Groq or Cerebras points to a practical layer that often gets less attention than model leaderboards. If models are to become components inside apps, then latency, cost, uptime and deployment options matter as much as headline capability. The next routing battleground is not only which model is best in the abstract. It is which model is good enough for a given step, available through fast enough infrastructure, and cheap enough to call many times inside a persistent workflow.</p>\n<h3 class=\"op\"><span class=\"who\">Dharmesh Shah / Simple AI</span> — the skill gap is app selection and workflow design</h3>\n<p>Simple AI’s power-user framing argued that the next jump in individual productivity comes less from clever one-off prompts and more from choosing the right agentic tools and building repeatable loops. That view fits the rest of the week. OpenAI’s controls make repeatable use governable. Claude Code-style pages make work inspectable. Brain-style memory makes attempts cumulative. PDF-to-skill and scheduling workflows make repeated tasks portable. The practical skill is therefore not only asking a better question. It is knowing which environment should hold the task and how that environment should remember, share and control the work.</p>\n<p>The final takeaway is that AI product progress is becoming less theatrical and more infrastructural. Medical research systems need benchmarks and expert review. Enterprise deployments need cost controls and local policy relationships. Agent workspaces need memory, artifacts and routing. Data centers need power, communities and capital. Open weights need fast inference to matter in applications. None of those pieces is as simple as a model demo, but together they describe the actual frontier of applied AI in this week’s sources: making the technology measurable, repeatable, locally deployable and economically usable.</p>\n<p>That extra depth is intentional: a weekly report should be useful as an operating brief, not only as a headline digest.</p>",
      "sources": "<h3>Videos · YouTube transcripts (last 7 days)</h3>\n<ul>\n  <li><a href=\"https://www.youtube.com/watch?v=7616Z13Q6pM\">a16z — Building Enduring Companies Outside Silicon Valley | Santiago Suárez of Addi</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=MnCBp01Bci8\">a16z — Building the Future of Image Generation with Ideogram's CEO</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=7x8EOcp8l88\">Dwarkesh Patel — How Florence Afforded the Renaissance</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=AtX1OUacxDM\">Dwarkesh Patel — Von Neumann Probes and the End of Human Wages — Alex Imas and Phil Trammell</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=hgbZNU1pMmw\">Dwarkesh Patel — When hiring humans is too great a risk — Alex Imas and Phil Trammell</a></li>\n</ul>\n<p class=\"footnote\"></p><h3>Newsrooms</h3>\n<ul>\n  <li><a href=\"https://openai.com/index/chatgpt-enterprise-spend-controls\">OpenAI — New usage analytics and updated spend controls for enterprises</a></li>\n  <li><a href=\"https://openai.com/index/improving-health-intelligence-in-chatgpt\">OpenAI — Improving health intelligence in ChatGPT</a></li>\n  <li><a href=\"https://openai.com/index/diagnose-rare-childhood-diseases\">OpenAI — Using AI to help physicians diagnose rare genetic diseases affecting children</a></li>\n  <li><a href=\"https://openai.com/index/ai-chemist-improves-reaction\">OpenAI — A near-autonomous AI chemist improves a challenging reaction in medicinal chemistry</a></li>\n  <li><a href=\"https://openai.com/index/introducing-life-sci-bench\">OpenAI — Introducing LifeSciBench</a></li>\n  <li><a href=\"https://openai.com/index/deployment-simulation\">OpenAI — Predicting model behavior before release by simulating deployment</a></li>\n  <li><a href=\"https://www.anthropic.com/news/seoul-office-partnerships-korean-ai-ecosystem\">Anthropic — Seoul office and partnerships across the Korean AI ecosystem</a></li>\n  <li><a href=\"https://blog.google/innovation-and-ai/models-and-research/google-research/amie-for-disease-management-in-nature/\">Google — AMIE research medical AI for disease management</a></li>\n  <li><a href=\"https://blog.google/innovation-and-ai/infrastructure-and-cloud/global-network/alabama-investment-june-2026/\">Google — Alabama data center investment and community support</a></li>\n</ul>\n<p class=\"footnote\"></p><h3>Weekly AI sites / newsletters</h3>\n<ul>\n  <li><a href=\"https://simple.ai/p/the-apps-separating-beginners-from-ai-power-users\">Simple AI — The Apps Separating Beginners from AI Power Users</a></li>\n  <li><a href=\"https://www.superhuman.ai/p/the-video-editor-built-for-ai\">Superhuman — The video editor built for AI</a></li>\n  <li><a href=\"https://www.superhuman.ai/p/copilot-cowork-becomes-generally-available\">Superhuman — Copilot Cowork becomes generally available</a></li>\n  <li><a href=\"https://futuretools.io/news\">Future Tools — All The AI News You Missed From The Past Week</a></li>\n  <li><a href=\"https://tldr.tech/ai/archives\">TLDR AI archives — June 16–19 entries</a></li>\n</ul>\n<p class=\"footnote\"></p><h3>X / Twitter profiles</h3>\n<ul>\n  <li><a href=\"https://x.com/levie/status/2068434042148782515\">Aaron Levie — open weights narrowing the marginal gap with frontier models</a></li>\n  <li><a href=\"https://x.com/levie/status/2068068247413694532\">Aaron Levie — shared workspaces and context as the main variable for agents</a></li>\n  <li><a href=\"https://x.com/simonw/status/2067834436172071342\">Simon Willison — GLM 5.2 and fast inference providers</a></li>\n  <li><a href=\"https://x.com/simonw/status/2067759482009194527\">Simon Willison — Datasette Apps launch</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2068467614293094456\">Riley Brown — CodexGPT as a possible general-purpose app</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2068449682532032750\">Riley Brown — Codex feels powerful while ChatGPT feels disposable</a></li>\n  <li><a href=\"https://x.com/natolambert/status/2068363240103629141\">Nathan Lambert — RLHF book community for post-training practitioners</a></li>\n  <li><a href=\"https://x.com/swyx/status/2067658992739029252\">swyx — Devin-generated conference announcement asset</a></li>\n</ul>\n<p class=\"footnote\">Window: June 15–21, 2026 Australia/Sydney. YouTube uploads were discovered directly via channel RSS, but transcript retrieval was blocked by YouTube from this cloud IP; video items are therefore used only as source pointers/themes, not as quoted transcripts. OpenAI article pages returned 403 to direct HTML fetch, so the OpenAI RSS feed was used for source discovery and concise facts. Anthropic, Google, weekly-site listings and X/twitterapi.io profile feeds were fetched directly. Hermes AI News had no dated item in the window; several monitored YouTube handles did not expose channel IDs to the unauthenticated fetch.</p>"

    "es": {
      "eyebrow": "Semana del 15 al 21 de junio de 2026",
      "headline": "Agentes gobernados, IA médica y nuevos controles de coste",
      "dek": "La señal de la semana fue operativa: OpenAI añadió controles de gasto enterprise y evaluaciones life-science, Google y Anthropic empujaron la IA hacia salud, infraestructura y Corea, y los builders debatieron cómo open weights más workspaces de agentes cambian la economía de la IA aplicada.",
      "byline": "Una síntesis semanal de las cargas monitoreadas de YouTube, cuatro salas de prensa, cuatro sitios/boletines semanales de IA y perfiles seleccionados de X. Edición ampliada, más de 3.000 palabras. Tiempo de lectura ~22 min.",
      "body": "<div class=\"part\"><p class=\"kicker\">Parte I</p><p class=\"part-name\">Funciones y herramientas — lo que realmente se lanzó<span class=\"label-fact\">datos</span></p></div>\n<h2><span class=\"num\">1.</span> OpenAI convirtió la semana en una historia de operaciones</h2>\n<p class=\"first\">La señal más clara de la ventana del 15 al 21 de junio no fue la presentación de un único modelo espectacular. Fue la cantidad de maquinaria que se está añadiendo alrededor de los modelos para que puedan usarse en organizaciones con presupuestos, equipos de cumplimiento, revisión médica, responsables de producto y límites de infraestructura local. El anuncio enterprise más importante de OpenAI fue el de nuevas analíticas de uso y controles de gasto actualizados para ChatGPT Enterprise. Los administradores pueden ver en un solo lugar el uso de créditos de ChatGPT y Codex, desglosarlo por usuario, producto y modelo, fijar límites predeterminados del workspace, crear límites para grupos, aprobar excepciones individuales y usar una Cost API unificada para conectar el gasto en modelos con sistemas financieros externos.</p>\n<p>Eso suena administrativo, pero cambia el patrón de adopción. Una empresa ya no tiene que elegir solamente entre un límite general de asientos y un experimento interno sin control. Puede permitir que ingenieros, analistas y equipos de producto usen más capacidad de modelo cuando el trabajo lo justifica, mientras finanzas y plataforma tienen suficiente detalle para explicar la factura. Codex y ChatGPT pasan a ser superficies de trabajo medibles, no herramientas invisibles. El movimiento importante de producto es que el trabajo con IA se está volviendo gobernable al mismo nivel en que las organizaciones compran, asignan y revisan software.</p>\n<p>Las actualizaciones de salud y ciencia de OpenAI llevaron el mismo tema a trabajos de mayor riesgo. Su nota de health intelligence dijo que GPT-5.5 Instant mejoró las respuestas de salud y bienestar en ChatGPT mediante evaluaciones informadas por médicos, comunicación más clara y mejor manejo del contexto. El artículo sobre enfermedades raras informó que investigadores que usaron un modelo de razonamiento de OpenAI identificaron <strong>18 diagnósticos nuevos</strong> en casos infantiles que antes no estaban resueltos. El artículo de química, con Molecule.one, describió un químico de IA casi autónomo que usa <strong>GPT-5.4</strong> para mejorar una reacción difícil de química medicinal. Son ejemplos distintos, pero juntos muestran por qué la evaluación ordinaria de chatbots no basta cuando el dominio es medicina o ciencia de laboratorio.</p>\n<p>Las piezas de benchmark y seguridad hicieron explícito ese punto. <strong>LifeSciBench</strong> fue presentado como un benchmark escrito y revisado por expertos para tareas reales de ciencias de la vida. <strong>Deployment Simulation</strong> fue presentado como un método para predecir el comportamiento de un modelo antes del lanzamiento simulando el despliegue con datos reales de conversaciones. El mensaje compartido es que los modelos más potentes requieren evaluaciones previas al lanzamiento más fuertes, no solo demos más llamativas. En el contexto de la semana, la historia de OpenAI tuvo por tanto dos caras: más libertad para usuarios enterprise mediante controles de gasto y pruebas más estructuradas para dominios donde una respuesta segura puede tener consecuencias clínicas, científicas o de seguridad.</p>\n<h2><span class=\"num\">2.</span> Google y Anthropic empujaron la IA hacia instituciones, infraestructura y alianzas regionales</h2>\n<p>El elemento de investigación más concreto de Google fue AMIE. El artículo de Google Research, publicado en <em>Nature</em>, describió un sistema conversacional de IA médica que se movió más allá del diagnóstico hacia la gestión compleja de enfermedades y que igualó a médicos de atención primaria en la evaluación reportada. La distinción importante es la forma de la tarea. Un sistema que responde preguntas médicas aisladas es útil de una manera; un sistema evaluado en gestión de enfermedades se está probando contra un arco de cuidado más largo, donde importan el contexto, el seguimiento, la incertidumbre y la comunicación. El artículo era investigación, no un lanzamiento amplio de producto, pero colocó la IA médica en la misma línea institucional que el trabajo de salud de OpenAI: la pregunta no es solo si el modelo sabe datos, sino si puede apoyar decisiones estructuradas.</p>\n<p>Google también anunció una inversión de <strong>1.500 millones de dólares</strong> para 2026–2027 destinada a ampliar su campus de centros de datos en Jackson County, Alabama, en un antiguo sitio de planta de carbón reutilizado. El artículo dijo que Google financiará el <strong>100%</strong> de sus propios costos de energía e infraestructura, añadirá un Energy Impact Fund de <strong>2 millones de dólares</strong> con TVA y CAANEAL, donará <strong>550.000 dólares</strong> para kits STEM destinados a estudiantes locales de cuarto a octavo grado y continuará programas de formación en habilidades digitales que han alcanzado a más de <strong>130.000</strong> habitantes de Alabama. En una semana sobre IA aplicada, ese artículo de infraestructura importó porque mostró el lado físico de la historia de software. Más trabajo agentic, generación de medios más rica e inferencia más pesada requieren campus, energía, coordinación con la red y legitimidad política local.</p>\n<p>El artículo de Anthropic se movió en otra dirección institucional. La compañía abrió una oficina en Seúl y firmó un MOU con el Ministerio de Ciencia e ICT de Corea centrado en seguridad de IA. Nombró despliegues enterprise en LG CNS, Hanwha Solutions, Samsung SDS, Nexon y Channel Corp. Anthropic también dijo que Channel Talk es usado por más de <strong>230.000</strong> empresas en Corea, Japón y Estados Unidos. Eso convierte a Claude de una familia de modelos en una estrategia operativa regional: oficina local, relación de seguridad con el gobierno, despliegues enterprise, AWS Bedrock para clientes sensibles a residencia de datos y casos de uso en programación, conocimiento, servicio al cliente y flujos agentic.</p>\n<p>Leídos en conjunto, Google y Anthropic hicieron el mismo argumento desde extremos opuestos. Google mostró que la IA sigue limitada por energía, campus, compromisos educativos e inversión local. Anthropic mostró que la distribución de IA depende de confianza, presencia local, relaciones de compra y participación en políticas públicas. Ninguno de los dos elementos fue una función de consumo. Ambos trataban de incrustar IA en instituciones con obligaciones existentes: hospitales, gobiernos, autoridades de infraestructura, grandes empresas y plataformas de atención al cliente. Por eso la semana se sintió operativa. El producto visible puede ser una respuesta del modelo, pero el trabajo competitivo duradero está cada vez más en los sistemas que rodean esa respuesta.</p>\n<h2><span class=\"num\">3.</span> La capa de producto pasó del chat a artefactos, memoria y flujos guardados</h2>\n<p>Los sitios y newsletters semanales de IA completaron la capa visible para el usuario. Future Tools y Superhuman apuntaron a equipos que empaquetan trabajo de agentes como artefactos, páginas compartibles y memorias duraderas. El soporte reportado de Claude Code artifacts permite que una sesión de programación publique páginas web vivas, privadas por defecto, como recorridos de pull requests, cronologías de incidentes, dashboards y checklists de lanzamiento a partir del contexto completo de la sesión. El Brain de Perplexity para Computer AI fue presentado no como memoria común de preferencias, sino como memoria de trabajo: registra lo que el agente intentó, lo que funcionó y lo que falló, y usa esa historia para mejorar tareas futuras.</p>\n<p>El ensayo de Simple AI del 17 de junio, “The Apps Separating Beginners from AI Power Users”, describió el mismo cambio desde el lado del usuario. Los principiantes se quedan en chatbots generales. Los usuarios intermedios y avanzados se mueven hacia Codex, Claude Code, superficies de comandos al estilo Raycast y pequeños bucles de apps. El archivo de Superhuman añadió ejemplos cercanos: un editor de video AI-native, Copilot Cowork pasando a disponibilidad general, flujos de programación y datos en ChatGPT, y flujos de PDF a Claude Skill. No todos son lanzamientos primarios, y la edición debe tratarlos como señales de newsletters. Aun así, el patrón es claro: la unidad competitiva se mueve de un prompt ingenioso a un flujo que puede guardarse, repetirse, compartirse, gobernarse y cobrarse.</p>\n<p>El feed de X reforzó esa interpretación de producto. Riley Brown sostuvo que Codex se siente poderoso mientras ChatGPT se siente más desechable, y sugirió que un “CodexGPT” diseñado con cuidado podría convertirse en una aplicación general muy fuerte. Simon Willison lanzó Datasette Apps y también comentó sobre GLM 5.2 y proveedores de inferencia rápida. swyx destacó un asset de anuncio de conferencia generado por Devin. Nathan Lambert señaló una comunidad de libro de RLHF para practicantes de post-training. Ninguno de esos posts debe leerse como hecho de mercado auditado, pero muestran a qué prestaban atención los builders: workspaces duraderos, artefactos de desarrollo, conocimiento de post-training, assets generados y los detalles prácticos de hacer que los modelos sean lo bastante rápidos y baratos para usarse repetidamente.</p>\n<p>El hilo común es la persistencia. Una ventana de chat es útil, pero es fácil perder el razonamiento, el contexto de archivos, el estado de la tarea y la pista de decisiones. Los workspaces de agentes intentan mantener vivas esas piezas. Los artefactos convierten una sesión interna de programación en una página que otra persona puede inspeccionar. La memoria convierte un intento fallido en información para el siguiente intento. Las skills y plantillas de workflow convierten tareas repetidas en proceso reutilizable. Las analíticas de administración vuelven gobernable ese proceso. Toda esa cadena apareció en las fuentes de la semana, desde la Cost API de OpenAI hasta páginas de Claude Code, memoria de trabajo tipo Brain y la discusión de power users en newsletters.</p>\n<div class=\"part\"><p class=\"kicker\">Parte II</p><p class=\"part-name\">Economía — presupuestos, infraestructura y mercados<span class=\"label-fact\">datos</span></p></div>\n<h2><span class=\"num\">4.</span> La IA se está volviendo una utility medible antes de volverse invisible</h2>\n<p>Los hechos económicos más fuertes del conjunto de fuentes fueron los controles de gasto de OpenAI y la inversión de Google en Alabama. Uno vive dentro de una consola enterprise; el otro vive en la red eléctrica. Juntos dicen que la escala de IA debe ser legible para CFOs y condados. OpenAI da a los clientes visibilidad sobre créditos, usuarios, productos y modelos. Google compromete <strong>1.500 millones de dólares</strong> en dos años a capacidad de centros de datos mientras vincula la expansión con compromisos locales de energía, educación y fuerza laboral. La misma industria que vende magia en la interfaz está obligada a rendir cuentas sobre unidades, watts, instalaciones, comunidades y líneas presupuestarias.</p>\n<p>Esa contabilidad importa porque los patrones de uso están cambiando. Si la IA es solo un asistente ocasional, el gasto puede tratarse como una suscripción por asiento. Si la IA se convierte en entorno de programación, asistente de investigación, apoyo de razonamiento médico, capa de servicio al cliente y herramienta de producción de video, el gasto se vuelve variable y dependiente del workflow. El comprador enterprise necesita entonces distinguir experimentación de producción, usuarios intensivos de usuarios ocasionales y llamadas de alto valor a modelos de llamadas evitables. Los límites por grupo, las excepciones individuales y la Cost API de OpenAI son notables porque encajan con ese segundo mundo. Permiten ampliar el trabajo con IA sin fingir que cada usuario, modelo y tarea tiene el mismo perfil de coste.</p>\n<p>El artículo de Google describió la restricción complementaria. La capacidad de los modelos no es solo un problema de software; depende de centros de datos, energía y aprobación local. Al enfatizar que Google financiará todos sus costos propios de energía e infraestructura, y al añadir un Energy Impact Fund y compromisos educativos, la compañía presentó la infraestructura de IA como una presencia local negociada, no como una expansión puramente privada de cloud. Los kits STEM para estudiantes de cuarto a octavo grado y el número de formación digital no son benchmarks de modelos, pero forman parte del entorno operativo que hace posible política y socialmente la infraestructura de IA a gran escala.</p>\n<p>El anuncio de Anthropic en Corea añade una tercera capa económica: distribución. La compañía no centró el artículo en un precio ni en una ronda de financiación. Describió una oficina en Seúl, un MOU de seguridad de IA, clientes enterprise nombrados y canales de despliegue. Para la IA enterprise, eso puede ser tan importante como el rendimiento bruto del modelo. Los grandes compradores necesitan soporte, opciones de residencia de datos, confianza de procurement y seguridad de que el proveedor entiende instituciones locales. En ese sentido, la economía de la semana trató menos de valoración especulativa y más de la fontanería de adopción: controles de coste, centros de datos, relaciones de política pública, clientes y estructuras de soporte.</p>\n<h2><span class=\"num\">5.</span> Open weights, inferencia rápida y software aplicado cambiaron el debate builder</h2>\n<p>Los perfiles de X monitorizados no mostraron un nuevo evento financiero auditado, pero sí capturaron un debate de mercado sobre la capa aplicada. Aaron Levie argumentó que los modelos open-weights que alcanzan rendimiento cercano a frontier en programación y otros dominios son buenos para el software aplicado porque reducen el coste por tarea mientras dejan a los modelos frontier un papel útil en planificación, orquestación y revisión. En ese marco, los modelos abiertos no necesitan vencer a todos los sistemas frontier. Solo necesitan hacer que la brecha marginal sea lo suficientemente pequeña para que muchas piezas rutinarias de un workflow puedan enviarse a infraestructura más barata.</p>\n<p>El comentario de Simon Willison sobre GLM 5.2 apuntó al mismo eje de coste-rendimiento desde el lado de infraestructura. Su interés en ver el modelo corriendo en proveedores de silicio personalizado superrápidos como Groq o Cerebras no era solo un punto sobre calidad del modelo; era un punto de enrutamiento. Si modelos abiertos más fuertes están disponibles mediante proveedores de inferencia rápida, los builders pueden decidir qué tareas requieren un modelo frontier y cuáles pueden resolverse con sistemas más baratos y de menor latencia. Esa decisión de routing se vuelve una de las preguntas básicas de diseño para productos de IA, especialmente cuando el producto realiza muchas acciones pequeñas en vez de un prompt ocasional.</p>\n<p>La implicación para las compañías de software aplicado es simple pero importante. Open weights más capaces pueden expandir la cantidad total de uso de IA porque reducen el coste del trabajo de fondo: clasificación, redacción, extracción, generación de tests, resumen, búsqueda de código, revisión y pasos simples de orquestación. Los modelos frontier pueden seguir usándose donde importan más el razonamiento, la planificación, la revisión de seguridad o la síntesis compleja. Esto no es un hecho cerrado sobre participación futura de mercado; es la tesis del lado builder visible en el feed de X de la semana. Pero encaja con la evidencia de producto de los newsletters: una vez que los workflows son duraderos, cada paso repetido se convierte en candidato para routing consciente del coste.</p>\n<p>La lista de fuentes de YouTube añadió contexto más amplio aunque la recuperación de transcripciones fue bloqueada desde la IP cloud y por tanto los videos se usan solo como punteros y temas. Los elementos de a16z apuntaron a compañías duraderas fuera de Silicon Valley y al futuro de la generación de imágenes con el CEO de Ideogram. Las conversaciones listadas de Dwarkesh Patel apuntaron a preguntas de largo plazo sobre el Renacimiento, sondas de von Neumann, el fin de los salarios humanos y el riesgo de contratar humanos en algunos escenarios futuros. Como las transcripciones no estaban disponibles, esta edición no debe citarlos ni tratar afirmaciones específicas como hechos extraídos. Aun así, su presencia en el conjunto monitorizado muestra que la discusión de la semana abarcó tanto herramientas inmediatas como preguntas mucho mayores sobre formación de empresas, generación creativa, trabajo y automatización.</p>\n<h2><span class=\"num\">6.</span> El mapa de fuentes mostró un campo monitorizado más amplio que un solo ciclo de lanzamientos</h2>\n<p>Una edición corregida debe dejar claro que el digest fue construido a partir de varias categorías de fuentes monitorizadas. Los hechos primarios de redacción vinieron de OpenAI, Anthropic y Google. La capa de sitios semanales y newsletters vino de Simple AI, Superhuman, Future Tools y los archivos de TLDR AI para entradas del 16 al 19 de junio. La capa social vino de Aaron Levie, Simon Willison, Riley Brown, Nathan Lambert y swyx. La capa de YouTube incluyó videos de a16z y Dwarkesh Patel, usados solo como punteros porque las transcripciones no estuvieron disponibles. Hermes AI News no tuvo un elemento fechado dentro de la ventana, y varios handles de YouTube monitorizados no expusieron channel IDs a la consulta no autenticada.</p>\n<p>Ese mapa de fuentes importa porque evita que la edición exagere la certeza. Un artículo de redacción sobre una inversión en centros de datos puede sostener cifras concretas. Un blog corporativo sobre un benchmark puede sostener lo que la empresa dice haber medido. Un newsletter roundup puede señalar qué herramientas están observando los practicantes, pero debe etiquetarse como agregación editorial. Un post de X puede capturar una tesis o sensación de producto, pero no equivale a evidencia auditada. El título de un video puede identificar un tema, pero sin transcripción no debe usarse para afirmaciones detalladas. Por eso el cuerpo corregido separa hechos de opiniones y mantiene la Parte III explícitamente interpretativa.</p>\n<div class=\"part\"><p class=\"kicker\">Parte III</p><p class=\"part-name\">Opinión e ideas — argumentos, no hechos<span class=\"label-op\">opinión</span></p></div>\n<p>Estas son interpretaciones atribuidas de X y fuentes de creadores, no hechos establecidos. Son útiles porque explican por qué los lanzamientos factuales anteriores parecieron conectados, pero deben leerse como argumentos y no como resultados verificados.</p>\n<h3 class=\"op\"><span class=\"who\">Aaron Levie</span> — open weights pueden expandir la capa aplicada</h3>\n<p>La tesis de Levie fue que los open weights no necesitan derrotar a todos los modelos frontier para importar. Si la brecha marginal se estrecha lo suficiente en programación y otros dominios prácticos, los builders pueden enviar grandes partes de los workflows a modelos más baratos mientras reservan modelos frontier para planificación, orquestación y revisión. La versión optimista del argumento es que llamadas de modelo más baratas crean más uso total de IA y más espacio para compañías de software aplicado. La cautela es que esto depende del rendimiento real por tarea, la latencia, la fiabilidad del hosting y la capacidad de decidir cuándo un modelo frontier sigue siendo necesario.</p>\n<h3 class=\"op\"><span class=\"who\">Riley Brown</span> — los workspaces persistentes se sienten más importantes que el chat desechable</h3>\n<p>El contraste emocional de producto que Brown hizo entre Codex y ChatGPT capturó un cambio más amplio. El chat es rápido, flexible y desechable. Un workspace de programación se siente más importante porque contiene archivos, proyectos, historia y outputs que pueden importar después. Su idea de “CodexGPT” es una predicción, no un hecho, pero ayuda a explicar por qué artefactos, skills, memoria y controles de administración fueron motivos recurrentes de la semana. El producto ganador quizá no sea el que ofrece la respuesta individual más bonita; puede ser el que preserve suficiente contexto para que el trabajo se acumule.</p>\n<h3 class=\"op\"><span class=\"who\">Simon Willison</span> — los proveedores de inferencia son el campo de batalla del routing</h3>\n<p>El interés de Willison en GLM 5.2 sobre proveedores como Groq o Cerebras apunta a una capa práctica que suele recibir menos atención que los rankings de modelos. Si los modelos van a convertirse en componentes dentro de apps, la latencia, el coste, el uptime y las opciones de despliegue importan tanto como la capacidad titular. El próximo campo de batalla de routing no es solo qué modelo es mejor en abstracto. Es qué modelo es suficientemente bueno para un paso concreto, está disponible en infraestructura suficientemente rápida y es lo bastante barato para llamarlo muchas veces dentro de un workflow persistente.</p>\n<h3 class=\"op\"><span class=\"who\">Dharmesh Shah / Simple AI</span> — la brecha de habilidad está en elegir apps y diseñar workflows</h3>\n<p>El marco de power users de Simple AI sostuvo que el siguiente salto de productividad individual viene menos de prompts ingeniosos de una sola vez y más de elegir las herramientas agentic correctas y construir bucles repetibles. Esa visión encaja con el resto de la semana. Los controles de OpenAI vuelven gobernable el uso repetido. Las páginas estilo Claude Code hacen inspeccionable el trabajo. La memoria tipo Brain vuelve acumulativos los intentos. Los flujos de PDF a skill y de programación hacen portátiles las tareas repetidas. La habilidad práctica no es solo hacer una pregunta mejor. Es saber qué entorno debe contener la tarea y cómo ese entorno debe recordar, compartir y controlar el trabajo.</p>\n<p>La conclusión es que el progreso de producto en IA se está volviendo menos teatral y más infraestructural. Los sistemas de investigación médica necesitan benchmarks y revisión experta. Los despliegues enterprise necesitan controles de coste y relaciones locales de política pública. Los workspaces de agentes necesitan memoria, artefactos y routing. Los centros de datos necesitan energía, comunidades y capital. Los open weights necesitan inferencia rápida para importar en aplicaciones. Ninguna de esas piezas es tan simple como una demo de modelo, pero juntas describen la frontera real de la IA aplicada en las fuentes de esta semana: hacer que la tecnología sea medible, repetible, desplegable localmente y económicamente utilizable.</p>",
      "sources": "<h3>Videos · transcripciones de YouTube (últimos 7 días)</h3>\n<ul>\n  <li><a href=\"https://www.youtube.com/watch?v=7616Z13Q6pM\">a16z — Building Enduring Companies Outside Silicon Valley | Santiago Suárez of Addi</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=MnCBp01Bci8\">a16z — Building the Future of Image Generation with Ideogram's CEO</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=7x8EOcp8l88\">Dwarkesh Patel — How Florence Afforded the Renaissance</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=AtX1OUacxDM\">Dwarkesh Patel — Von Neumann Probes and the End of Human Wages — Alex Imas and Phil Trammell</a></li>\n  <li><a href=\"https://www.youtube.com/watch?v=hgbZNU1pMmw\">Dwarkesh Patel — When hiring humans is too great a risk — Alex Imas and Phil Trammell</a></li>\n</ul>\n<p class=\"footnote\"></p><h3>Redacciones</h3>\n<ul>\n  <li><a href=\"https://openai.com/index/chatgpt-enterprise-spend-controls\">OpenAI — New usage analytics and updated spend controls for enterprises</a></li>\n  <li><a href=\"https://openai.com/index/improving-health-intelligence-in-chatgpt\">OpenAI — Improving health intelligence in ChatGPT</a></li>\n  <li><a href=\"https://openai.com/index/diagnose-rare-childhood-diseases\">OpenAI — Using AI to help physicians diagnose rare genetic diseases affecting children</a></li>\n  <li><a href=\"https://openai.com/index/ai-chemist-improves-reaction\">OpenAI — A near-autonomous AI chemist improves a challenging reaction in medicinal chemistry</a></li>\n  <li><a href=\"https://openai.com/index/introducing-life-sci-bench\">OpenAI — Introducing LifeSciBench</a></li>\n  <li><a href=\"https://openai.com/index/deployment-simulation\">OpenAI — Predicting model behavior before release by simulating deployment</a></li>\n  <li><a href=\"https://www.anthropic.com/news/seoul-office-partnerships-korean-ai-ecosystem\">Anthropic — Seoul office and partnerships across the Korean AI ecosystem</a></li>\n  <li><a href=\"https://blog.google/innovation-and-ai/models-and-research/google-research/amie-for-disease-management-in-nature/\">Google — AMIE research medical AI for disease management</a></li>\n  <li><a href=\"https://blog.google/innovation-and-ai/infrastructure-and-cloud/global-network/alabama-investment-june-2026/\">Google — Alabama data center investment and community support</a></li>\n</ul>\n<p class=\"footnote\"></p><h3>Sitios semanales / newsletters de IA</h3>\n<ul>\n  <li><a href=\"https://simple.ai/p/the-apps-separating-beginners-from-ai-power-users\">Simple AI — The Apps Separating Beginners from AI Power Users</a></li>\n  <li><a href=\"https://www.superhuman.ai/p/the-video-editor-built-for-ai\">Superhuman — The video editor built for AI</a></li>\n  <li><a href=\"https://www.superhuman.ai/p/copilot-cowork-becomes-generally-available\">Superhuman — Copilot Cowork becomes generally available</a></li>\n  <li><a href=\"https://futuretools.io/news\">Future Tools — All The AI News You Missed From The Past Week</a></li>\n  <li><a href=\"https://tldr.tech/ai/archives\">TLDR AI archives — June 16–19 entries</a></li>\n</ul>\n<p class=\"footnote\"></p><h3>Perfiles de X / Twitter</h3>\n<ul>\n  <li><a href=\"https://x.com/levie/status/2068434042148782515\">Aaron Levie — open weights narrowing the marginal gap with frontier models</a></li>\n  <li><a href=\"https://x.com/levie/status/2068068247413694532\">Aaron Levie — shared workspaces and context as the main variable for agents</a></li>\n  <li><a href=\"https://x.com/simonw/status/2067834436172071342\">Simon Willison — GLM 5.2 and fast inference providers</a></li>\n  <li><a href=\"https://x.com/simonw/status/2067759482009194527\">Simon Willison — Datasette Apps launch</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2068467614293094456\">Riley Brown — CodexGPT as a possible general-purpose app</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2068449682532032750\">Riley Brown — Codex feels powerful while ChatGPT feels disposable</a></li>\n  <li><a href=\"https://x.com/natolambert/status/2068363240103629141\">Nathan Lambert — RLHF book community for post-training practitioners</a></li>\n  <li><a href=\"https://x.com/swyx/status/2067658992739029252\">swyx — Devin-generated conference announcement asset</a></li>\n</ul>\n<p class=\"footnote\">Ventana: 15–21 de junio de 2026, Australia/Sydney. Las subidas de YouTube se descubrieron directamente vía RSS de canal, pero YouTube bloqueó la recuperación de transcripciones desde esta IP cloud; por eso los videos se usan solo como punteros/temas, no como citas transcritas. Las páginas HTML de OpenAI devolvieron 403, así que se usó el RSS de OpenAI para descubrimiento y datos concisos. Anthropic, Google, los listados semanales y los perfiles de X vía twitterapi.io se consultaron directamente. Hermes AI News no tuvo un item fechado en la ventana; algunos handles de YouTube no expusieron channel ID al fetch no autenticado.</p>"
