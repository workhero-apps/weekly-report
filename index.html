    "es": {
      "eyebrow": "Semana del 3 al 9 de junio de 2026",
      "headline": "Los agentes se convierten en productos, plataformas y presupuestos",
      "dek": "La señal de la semana fue más grande que las demos de modelos: Codex Sites convirtió a los agentes en apps internas compartibles, Claude Fable 5 llevó el trabajo de largo horizonte al nivel de producto, y la conversación pasó a enrutamiento, precios, ciclos de revisión y mercados de capitales.",
      "byline": "Una síntesis semanal de seis canales de YouTube, cuatro redacciones y perfiles seleccionados de X. Tiempo de lectura: ~18 min.",
      "body": "\n<div class=\"part\"><p class=\"kicker\">Parte I</p><p class=\"part-name\">Funciones y herramientas — lo que realmente se lanzó<span class=\"label-fact\">datos</span></p></div>\n<h2><span class=\"num\">1.</span> OpenAI convierte Codex en una plataforma de apps de trabajo, no solo en un agente de programación</h2>\n<p class=\"first\">La mayor pieza que faltaba en el primer borrador del 9 de junio era Codex. El lanzamiento concreto de Codex por parte de OpenAI fue más amplio que “agentes para desarrolladores”: Codex ahora tiene plugins específicos por rol, Sites y anotaciones dirigidas a analistas, especialistas en marketing, operadores, diseñadores, investigadores, inversores y banqueros, además de ingenieros. OpenAI dice que <strong>más de 5 millones de personas usan Codex cada semana</strong>, y que quienes no son desarrolladores ya representan <strong>alrededor del 20%</strong> del total de usuarios de Codex, mientras crecen <strong>más de 3 veces más rápido</strong> que los desarrolladores.</p>\n<p>La capa de plugins es la jugada de distribución. OpenAI lanzó <strong>seis plugins específicos por rol</strong> — análisis de datos, producción creativa, ventas, diseño de producto, inversión en renta variable pública y banca de inversión — que agrupan <strong>62 apps populares</strong> y <strong>110 habilidades</strong>. El plugin de datos conecta flujos de trabajo en torno a herramientas como Snowflake, Databricks Genie, Hex y Tableau; el plugin creativo nombra a Figma, Canva, Shutterstock, Picsart y Fal; el plugin de ventas nombra a Salesforce, HubSpot, Slack, Outreach, Clay, Rox y Actively; y los plugins de inversión y banca apuntan a salas de datos, datos de mercado y flujos de diligencia.</p>\n<p><strong>Sites</strong> es el primitivo de producto más importante. OpenAI lo describe como una forma para que Codex cree y comparta sitios web y apps interactivos, alojados, mediante una URL. En la práctica, eso significa que paneles, planificadores, espacios de revisión, tableros de proyecto, galerías y herramientas internas ligeras pueden generarse dentro de Codex y compartirse con un espacio de trabajo en vez de exportarse como una presentación o una hoja de cálculo estática. Los ejemplos de OpenAI incluyen un sitio de reseñas de clientes con actualizaciones de producto, preguntas abiertas y tendencias de uso; un planificador de escenarios de modelos financieros; y un hub de lanzamiento con mensajes, hitos, responsables y decisiones.</p>\n<p>La documentación para desarrolladores añade detalle operativo. El <strong>plugin Sites</strong> puede crear, guardar, desplegar e inspeccionar sitios web, apps web y juegos alojados por OpenAI. Cada URL de despliegue es un <strong>despliegue de producción</strong>, por lo que OpenAI recomienda guardar primero una versión cuando se necesita revisión. El flujo de trabajo tiene dos etapas: <strong>guardar una versión</strong>, donde Codex construye un candidato desplegable vinculado al commit de Git fuente, y <strong>desplegar una versión</strong>, donde ese candidato pasa a estar activo. Sites está en vista previa para <strong>ChatGPT Business y Enterprise</strong>; los espacios de trabajo Business lo tienen activado por defecto, mientras que los administradores de Enterprise usan RBAC. Sites también admite datos de aplicación duraderos y archivos subidos, con metadatos de proyecto como <code>.openai/hosting.json</code> y enlaces de almacenamiento para <strong>D1</strong> y <strong>R2</strong>.</p>\n<h2><span class=\"num\">2.</span> Codex obtiene un ciclo de edición: anotaciones, sitios asociados y la pregunta sobre Convex</h2>\n<p>La función de anotaciones de OpenAI es el ciclo posterior al primer borrador. En lugar de pedirle a Codex que regenere una página, diapositiva o documento completo, los usuarios pueden señalar una parte específica — una barra de navegación, la etiqueta de un gráfico, una afirmación en una tesis de inversión — y pedir un cambio puntual o una verificación de fuente. Esto importa porque el primer resultado útil de un agente rara vez es el artefacto final; el cuello de botella se desplaza hacia la revisión, el criterio y la iteración.</p>\n<p>El ecosistema de Sites también empezó a parecer una superficie de distribución. OpenAI nombró socios iniciales como <strong>Vercel, Wix, Base44, Replit, Lovable, Figma, Webflow y Emergent</strong>. La conversación de creadores de la semana se centró entonces en la siguiente pregunta práctica: si Sites puede conectarse a primitivos reales de backend como <strong>Convex</strong>, datos persistentes y flujos de trabajo de apps, en lugar de quedarse en un lienzo de demos pulido. Por eso Codex Sites pertenece al informe: es el puente entre el código escrito por agentes y el software interno compartible.</p>\n<h2><span class=\"num\">3.</span> Anthropic lanza Claude Fable 5 y Mythos 5 — misma familia de modelos, distintas salvaguardas</h2>\n<p>El lanzamiento de Anthropic del 9 de junio cambió la parte alta de la pila de modelos. <strong>Claude Fable 5</strong> se describe como un modelo de <strong>clase Mythos</strong> hecho seguro para uso general, con capacidades que Anthropic dice que superan a cualquier modelo que haya puesto antes a disposición general. <strong>Claude Mythos 5</strong> es el mismo modelo subyacente con algunas salvaguardas levantadas para un pequeño grupo de ciberdefensores y proveedores de infraestructura verificados mediante Project Glasswing, con un programa de acceso confiable más amplio previsto.</p>\n<p>El diseño de seguridad es la historia de producto. Anthropic dice que Fable 5 enruta algunas solicitudes de ciberseguridad, biología y química a <strong>Claude Opus 4.8</strong> en vez de responder con el modelo de nivel Mythos. Esas salvaguardas conservadoras se activan en <strong>menos del 5% de las sesiones en promedio</strong>, pero Anthropic advierte que pueden atrapar solicitudes inofensivas. El acceso a Mythos 5 es más restringido, y usarlo requiere una <strong>política de retención de datos de 30 días</strong> para monitoreo de seguridad.</p>\n<p>La disponibilidad y el precio son inusualmente explícitos. Fable 5 está disponible mediante <code>claude-fable-5</code> en la API de Claude, en planes Enterprise basados en consumo y a través de marketplaces como AWS, Google Cloud y Microsoft Foundry. El precio es de <strong>$10 por millón de tokens de entrada</strong> y <strong>$50 por millón de tokens de salida</strong>, con el <strong>descuento de entrada del 90% por caché de prompts</strong> existente. La inferencia solo en EE. UU. cuesta <strong>1.1x</strong>. En los planes de suscripción, Anthropic incluye Fable 5 en Pro, Max, Team y Enterprise por puesto sin costo adicional hasta el <strong>22 de junio</strong>, y luego trasladará el uso posterior al <strong>23 de junio</strong> a créditos, salvo que la capacidad permita una extensión.</p>\n<h2><span class=\"num\">4.</span> Las mejoras atribuidas a Fable 5 son trabajo de largo horizonte, programación, visión y memoria</h2>\n<p>Los ejemplos de clientes de Anthropic apuntan a autonomía de larga duración más que a victorias breves en benchmarks. Stripe habría usado Fable 5 en una <strong>base de código Ruby de 50 millones de líneas</strong> para realizar una migración en toda la base de código en <strong>un día</strong> que, según Anthropic, de otro modo habría requerido que un equipo completo trabajara <strong>más de dos meses</strong> manualmente. Anthropic también dice que Fable 5 obtuvo la puntuación más alta entre modelos frontier en la evaluación <strong>FrontierCode</strong> de Cognition incluso con esfuerzo medio, y que es más eficiente en tokens que modelos Claude anteriores.</p>\n<p>Para trabajo de conocimiento, Anthropic cita el benchmark financiero de nivel sénior de Hebbia y evaluaciones de análisis de trading de IMC. En visión, el ejemplo memorable es que Fable 5 completó <strong>Pokémon FireRed</strong> con un arnés mínimo basado solo en visión, mientras que modelos Claude anteriores necesitaban herramientas auxiliares más elaboradas. Para contexto largo, Anthropic dice que Fable 5 puede mantenerse enfocado a través de <strong>millones de tokens</strong> en tareas de larga duración y mejorar los resultados con el tiempo. El patrón importante: el modelo se vende como un trabajador que puede persistir, revisarse a sí mismo y usar visión — no solo como un modelo de chat con una respuesta mejor.</p>\n<h2><span class=\"num\">5.</span> Google lanza infraestructura alrededor de Gemini: voz, APIs de Apple, NotebookLM, Gemma y Kaggle</h2>\n<p>La semana de Google no fue un solo lanzamiento; fue una pila. <strong>Gemini 3.5 Live Translate</strong> es un modelo de voz a voz en streaming que detecta <strong>70+ idiomas</strong>, preserva entonación, ritmo y tono, y corre unos segundos detrás del hablante. Está en vista previa pública para desarrolladores mediante la Gemini Live API y Google AI Studio, en vista previa privada para empresas en Google Meet este mes, y desplegándose a través de Google Translate en Android e iOS.</p>\n<p>Para desarrolladores de Apple, Google dijo que Gemini puede llamarse mediante el framework Foundation Models de Apple usando el Firebase Apple SDK. A partir de <strong>iOS 27, macOS 27, iPadOS 27, visionOS 27 y watchOS 27</strong>, el protocolo público <code>LanguageModel</code> de Apple puede enrutar hacia Gemini alojado en la nube detrás de la misma superficie usada para modelos locales de Apple. Eso convierte la elección de modelo en enrutamiento: inferencia local cuando importan la latencia y la privacidad, Gemini en la nube cuando la tarea necesita razonamiento más pesado o capacidad agéntica.</p>\n<p>NotebookLM avanzó más hacia un entorno de investigación agéntico. Google dice que el sistema actualizado funciona sobre <strong>Gemini 3.5 y Antigravity</strong>, da a cada notebook una computadora segura en la nube e incluye <strong>100+ habilidades de software seleccionadas</strong> para ejecución de código y análisis más profundo. Google dice que el nuevo NotebookLM ganó por un promedio de <strong>más del 65%</strong> en sus cinco principales dimensiones de evaluación, incluido <strong>69.9%</strong> en análisis de documentos extensos y <strong>78.2%</strong> en investigación web avanzada y descubrimiento de fuentes. Del lado de los modelos abiertos, los checkpoints QAT de <strong>Gemma 4</strong> incluyen formatos que llevan <strong>Gemma 4 E2B a una huella de memoria de 1GB</strong>, y Kaggle añadió desarrollo local después de que su comunidad Benchmarks produjera <strong>10,000+ tareas de evaluación</strong>.</p>\n<h2><span class=\"num\">6.</span> La otra semana de OpenAI: S-1, memoria, Rosalind, biodefensa y trabajo de runtime en el edge</h2>\n<p>El feed de OpenAI del 3 al 9 de junio también incluyó una presentación confidencial de borrador <strong>S-1</strong> ante la SEC, el <strong>OpenAI Economic Research Exchange</strong>, un sistema de memoria <strong>Dreaming</strong> para ChatGPT, un plan de biodefensa impulsado por IA, nuevas capacidades de razonamiento biológico y flujos de laboratorio para <strong>GPT-Rosalind</strong>, y documentos de política sobre la gobernanza pública de la IA frontier. Los cuerpos de los artículos estaban parcialmente restringidos en este entorno, por lo que el informe usa descripciones oficiales del feed/de las páginas en lugar de detalles no respaldados.</p>\n<p>El caso de estudio para desarrolladores más concreto fue Wasmer: OpenAI dice que Wasmer usó <strong>Codex con GPT-5.5</strong> para construir un runtime de Node.js para el edge, acelerando el desarrollo <strong>10x a 20x</strong> y lanzando en semanas en vez de meses. Junto con Sites, anotaciones y plugins por rol, el patrón es claro: Codex está siendo empujado desde “programador par de IA” hacia “capa operativa agéntica para artefactos de trabajo”.</p>\n<h2><span class=\"num\">7.</span> El canal de servicios y el informe cibernético de Anthropic muestran comercialización y gestión de riesgos avanzando juntas</h2>\n<p>Anthropic amplió la Claude Partner Network con un Services Track y Partner Hub, respaldados por una inversión de <strong>$100 million</strong> en capacitación de socios, soporte técnico y marketing compartido. Anthropic dice que <strong>40,000+</strong> firmas han solicitado unirse y que <strong>10,000+</strong> consultores obtuvieron una certificación Claude. Los despliegues nombrados incluyen a Accenture capacitando a <strong>30,000</strong> profesionales, Cognizant desplegando Claude a aproximadamente <strong>350,000</strong> asociados, Deloitte poniéndolo a disposición de <strong>470,000</strong> personas y KPMG integrando Claude en más de <strong>276,000</strong> trabajadores.</p>\n<p>Su informe cibernético examinó <strong>832</strong> cuentas prohibidas asociadas con actividad cibernética maliciosa desde marzo de 2025 hasta marzo de 2026 y las mapeó a MITRE ATT&amp;CK. La escritura de malware apareció en <strong>560 de 832 cuentas</strong>, o <strong>67.3%</strong>; <strong>54 cuentas</strong>, o <strong>6.5%</strong>, usaron IA para asistir en movimiento lateral. La puntuación de riesgo de Anthropic ubicó al <strong>33%</strong> de los actores en riesgo medio o superior en los primeros seis meses y al <strong>56%</strong> en los segundos seis meses. También sostuvo que MITRE ATT&amp;CK carece de una categoría para orquestación agéntica, citando una operación patrocinada por un Estado en noviembre de 2025 que usó <strong>30 técnicas en 13 tácticas</strong>.</p>\n<div class=\"part\"><p class=\"kicker\">Parte II</p><p class=\"part-name\">Economía — solo cifras duras<span class=\"label-fact\">datos</span></p></div>\n<h2><span class=\"num\">8.</span> Las cifras duras: uso de Codex, precio de Fable, presupuestos de socios, señales de IPO y gasto en IA</h2>\n<p>OpenAI reveló <strong>5 million+</strong> usuarios semanales de Codex, con no desarrolladores en <strong>alrededor del 20%</strong> de la base y creciendo <strong>más de 3x</strong> tan rápido como los desarrolladores. También reveló seis plugins por rol que abarcan <strong>62 apps</strong> y <strong>110 habilidades</strong>. Anthropic fijó el precio de Fable 5 y Mythos 5 en <strong>$10 por millón de tokens de entrada</strong> y <strong>$50 por millón de tokens de salida</strong>, mantuvo un descuento de entrada por caché de prompts del <strong>90%</strong>, estableció la inferencia solo en EE. UU. en <strong>1.1x</strong>, y ofreció acceso temporal en planes de suscripción hasta el <strong>22 de junio</strong>.</p>\n<p>El programa de socios de Anthropic añadió un presupuesto de habilitación de canal de <strong>$100 million</strong>, <strong>40,000+</strong> firmas solicitantes y <strong>10,000+</strong> consultores certificados. OpenAI confirmó una presentación confidencial de borrador <strong>S-1</strong>, pero no reveló valoración, ingresos, número de acciones ni fecha objetivo de cotización. Las señales económicas de Google fueron señales de costos de infraestructura: Gemma 4 QAT apunta a inferencia local más barata, Kaggle Benchmarks alcanzó <strong>10,000+</strong> tareas comunitarias, y la ruta Gemini Apple/Firebase convierte las llamadas al modelo en un servicio cloud disponible dentro de apps nativas.</p>\n<p>La lista de videos reforzó la misma economía incluso donde las transcripciones no estaban disponibles desde esta IP: el episodio de Thomas Laffont del 4 de junio en All-In enmarcó una posible <strong>ola de IPO de IA de $4T</strong>; los paneles de All-In del 7 y 6 de junio se centraron en mercados secundarios y reapertura de IPO; el episodio de a16z con Benedict Evans trató explícitamente sobre la economía del uso de IA y SaaS; y el título de Tech With Tim “software development bottleneck moved” coincide con el cambio desde programar hacia orquestación, revisión y despliegue.</p>\n<div class=\"part\"><p class=\"kicker\">Parte III</p><p class=\"part-name\">Opinión e ideas — solo argumentos atribuidos<span class=\"label-op\">opinión</span></p></div>\n<p>Estos son argumentos, interpretaciones y pronósticos de personas nombradas o episodios de creadores con títulos claros, no hechos establecidos.</p>\n<h3 class=\"op\"><span class=\"who\">Aaron Levie</span> — contexto, evaluaciones y enrutamiento se convierten en el foso empresarial</h3>\n<p>El hilo más fuerte de Levie esta semana fue que la inteligencia de los modelos no elimina la necesidad de instrucciones, contexto de dominio y datos propietarios. Sostiene que el mismo modelo de propósito general será usado por abogados, ingenieros, analistas financieros y trabajadores de salud, de modo que el resultado útil todavía depende de guiarlo hacia la tarea diferenciada. En otro hilo dice que los costos de tokens se están convirtiendo en una línea importante de gasto operativo empresarial, lo que hace del enrutamiento de modelos y de las evaluaciones específicas por dominio un diferenciador central de IA aplicada.</p>\n<h3 class=\"op\"><span class=\"who\">Aaron Levie</span> — las puntuaciones brutas de benchmarks necesitan normalización por cómputo</h3>\n<p>Tras el lanzamiento de Fable 5, Levie argumentó que el rendimiento aparente de los modelos depende cada vez más de cuánto cómputo en tiempo de inferencia se aplica. Su visión es que los benchmarks normalizados por cómputo son el camino lógico, pero difíciles de implementar porque “cuánto pensar” gastar en una tarea es subjetivo y puede invertir los rankings de modelos en distintos niveles de esfuerzo.</p>\n<h3 class=\"op\"><span class=\"who\">Riley Brown</span> — Fable/Mythos señala una nueva clase de modelo de Anthropic</h3>\n<p>La reacción inmediata de Brown ante Fable/Mythos fue que Anthropic había roto su patrón reciente de nombres Haiku/Sonnet/Opus con una nueva clase de modelo. Llamó al modelo “really really good” después de las primeras pruebas y publicó un experimento de Cowork que subió un informe estilo McKinsey y pidió a Fable/Mythos crear un documento de calidad similar. Trátese como evaluación temprana de creador, no como benchmark.</p>\n<h3 class=\"op\"><span class=\"who\">Riley Brown</span> — las plataformas de agentes necesitan habilidades reutilizables que se reparen solas</h3>\n<p>Brown enmarcó las habilidades de Claude Code y Codex como la capa operativa faltante para agentes personales. Su observación clave: cuando una habilidad causa un error, Claude puede corregir de inmediato la habilidad, convirtiendo un fallo puntual en mejora persistente de proceso. Esa es la misma idea detrás de Codex Sites y las anotaciones: los agentes se vuelven más valiosos cuando su producto de trabajo es revisable, editable y reutilizable.</p>\n<h3 class=\"op\"><span class=\"who\">Riley Brown</span> — las apps de nivel Mythos pueden ser caras pero cualitativamente distintas</h3>\n<p>Brown predijo que Mythos podría crear de una sola vez casi cualquier app móvil full-stack de extremo a extremo y enviarla a una tienda de apps, pero advirtió que si es <strong>5x más caro que Opus</strong>, el costo de API podría rondar <strong>$120–$400 por app</strong>. La idea económica importante no es la estimación exacta; es el intercambio entre inferencia frontier de alto precio y reemplazar muchas rondas de prompting humano, depuración e integración.</p>\n<h3 class=\"op\"><span class=\"who\">Tech With Tim</span> — el cuello de botella del desarrollo de software se movió</h3>\n<p>La semana de videos de Tech With Tim se centró en aprendizaje, infraestructura y cuellos de botella del mercado laboral: “The Software Development Bottleneck Just Moved,” “Why Companies Won’t Hire Junior Devs And Why It’ll Backfire,” y un resumen de una conferencia de infraestructura de IA. Sin acceso a transcripciones aquí, el informe solo trata los títulos como señales de fuente, pero el tema coincide con los hechos de la semana: la generación de código es menos escasa; el juicio de producto, la revisión, el despliegue, la infraestructura y los pipelines de capacitación se vuelven más escasos.</p>\n<h3 class=\"op\"><span class=\"who\">Greg Isenberg</span> — Codex Sites empuja lo “AI-native” del prompt al producto</h3>\n<p>Los videos de Greg Isenberg sobre Codex y lo AI-native, más la conversación “Codex Sites is good.. but can it run Convex?”, ponen presión práctica sobre Sites: una página generada es útil, pero una app interna AI-native necesita datos persistentes, permisos, flujos reales de backend y un ciclo de mantenimiento. Por eso aparecieron Convex y backends similares: la frontera no es generar UI, sino hacer operativo el software generado.</p>\n<h3 class=\"op\"><span class=\"who\">Benedict Evans</span> — la economía de SaaS se está revalorando alrededor del uso</h3>\n<p>El episodio de a16z con Benedict Evans se tituló en torno a la economía del uso de IA y lo que viene para SaaS. Combinado con los posts de Levie sobre presupuestos de tokens y la expansión de Codex de OpenAI hacia roles no desarrolladores, el argumento a vigilar es que el precio del software se aleja de las licencias por puesto únicamente y se acerca a una economía de uso, resultado, enrutamiento y mezcla de modelos.</p>\n<h3 class=\"op\"><span class=\"who\">All-In guests</span> — el ciclo de capital de IA pasó de liquidez privada a mercados públicos</h3>\n<p>La semana de episodios de All-In cargados de finanzas — Thomas Laffont sobre una <strong>ola de IPO de IA de $4T</strong>, paneles sobre mercados secundarios y reapertura de IPO, y Bill Maris sobre la “etapa Atari” de la IA — enmarcó el mercado como temprano más que maduro. Como las transcripciones estuvieron bloqueadas aquí, el informe no los cita; registra la tesis direccional visible en el conjunto de episodios: la formación de empresas de IA, la liquidez secundaria y la preparación para mercados públicos se están convirtiendo en una sola historia integrada.</p>\n",

ps://x.com/levie/status/2063756386572681606\">Aaron Levie — el software empresarial no es solo código</a></li>\n  <li><a href=\"https://x.com/levie/status/2063320673217609936\">Aaron Levie — presupuestos de tokens y enrutamiento de modelos</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2064395899522998357\">Riley Brown — la nueva clase de modelo de Anthropic</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2064407515752722521\">Riley Brown — primera prueba de Fable/Mythos en Cowork</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2064006354772033761\">Riley Brown — habilidades de Claude/Codex que se reparan solas</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2063383381816029429\">Riley Brown — costos de apps móviles de una sola pasada con Mythos</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2063015700684329000\">Riley Brown — canvas de Cursor / función similar a Sites</a></li>\n  <li><a href=\"https://x.com/rileybrown/status/2062576634025353444\">Riley Brown — estrategia de contenidos en la era de los agentes de IA</a></li>\n</ul>\n<p class=\"footnote\">Ventana: del 3 al 9 de junio de 2026 inclusive, con el anuncio de Codex Sites de OpenAI del 2 de junio incluido porque es la función que Paulo pidió explícitamente cubrir y dio forma a la conversación de la semana sobre Codex. Se revisó el RSS de YouTube de todos los canales permanentes; la recuperación de transcripciones desde esta IP en la nube fue bloqueada por YouTube, por lo que los elementos derivados de videos se tratan solo como punteros de fuente u opiniones atribuidas, salvo que estén respaldados por páginas oficiales o publicaciones de X. hermes-ai.net/news no tenía ningún artículo fechado en la ventana; se revisó su changelog por completitud.</p>"

const I18N = {
  en: { pubtitle: "The Weekly · AI &amp; Tech", sources: "Sources" },
  es: { pubtitle: "The Weekly · IA &amp; Tech", sources: "Fuentes" },
  pt: { pubtitle: "The Weekly · IA &amp; Tech", sources: "Fontes" }
};

let state = { lang: "en", date: EDITIONS[0].date };

function editionByDate(d){ return EDITIONS.find(e => e.date === d) || EDITIONS[0]; }

function render(){
  const ed = editionByDate(state.date);
  const c = ed[state.lang] || ed.en;
  document.documentElement.lang = state.lang;
  document.querySelector('[data-i18n="pubtitle"]').innerHTML = I18N[state.lang].pubtitle;

  const art = document.getElementById('article');
  art.innerHTML =
    '<p class="eyebrow">' + c.eyebrow + '</p>' +
    '<h1 class="headline">' + c.headline + '</h1>' +
    '<p class="dek">' + c.dek + '</p>' +
    '<p class="byline">' + c.byline + '</p>' +
    '<hr class="rule">' +
    c.body +
    '<hr class="rule">' +
    '<div class="source-list"><h3 style="color:var(--accent);font-size:15px">' + I18N[state.lang].sources + '</h3>' + c.sources + '</div>';

  document.querySelectorAll('.lang button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === state.lang);
  });
  window.scrollTo({top:0, behavior:'instant'});
}

function buildDropdown(){
  const sel = document.getElementById('edition');
  sel.innerHTML = EDITIONS.map(e =>
    '<option value="' + e.date + '">' + (e.label[state.lang] || e.label.en) + '</option>'
  ).join('');
  sel.value = state.date;
}

/* ---- Dark mode toggle (moon = go dark, sun = go light) ---- */
const ICON_MOON = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 1 0 9.8 9.8z" fill="currentColor"/></svg>';
const ICON_SUN  = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5.2" y1="5.2" x2="6.9" y2="6.9"/><line x1="17.1" y1="17.1" x2="18.8" y2="18.8"/><line x1="5.2" y1="18.8" x2="6.9" y2="17.1"/><line x1="17.1" y1="6.9" x2="18.8" y2="5.2"/></g></svg>';

function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('theme');
  // Light mode shows the MOON (click to go dark); dark mode shows the SUN (click to go light).
  btn.innerHTML = (t === 'dark') ? ICON_SUN : ICON_MOON;
  btn.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  btn.setAttribute('title', t === 'dark' ? 'Light mode' : 'Dark mode');
  try { localStorage.setItem('weekly-theme', t); } catch(e){}
}
(function initTheme(){
  let t = null;
  try { t = localStorage.getItem('weekly-theme'); } catch(e){}
  if (t !== 'dark' && t !== 'light'){
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  applyTheme(t);
  document.getElementById('theme').addEventListener('click', ()=>{
    const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });
})();

document.getElementById('edition').addEventListener('change', e=>{
  state.date = e.target.value; render();
});
document.querySelectorAll('.lang button').forEach(b=>{
  b.addEventListener('click', ()=>{
    state.lang = b.dataset.lang;
    buildDropdown();
    render();
  });
});

buildDropdown();
render();
</script>
